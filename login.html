<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>স্টুডেন্ট লগইন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e2f5a;font-family:'Hind Siliguri',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:0}
.wrap{width:100%;max-width:430px;background:#0e2f5a;min-height:100vh;padding:12px}
.top-card{background:#fff;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px}
.top-card img{width:52px;height:52px;border-radius:50%;border:1px solid #ddd;object-fit:cover}
.t1{font-size:14px;font-weight:700;color:#0a3d8f;line-height:1.2}
.t2{font-size:11px;font-weight:700;color:#c00000;margin-top:2px}
.t3{font-size:10px;font-weight:600;color:#333;margin-top:3px}
.login-box{background:#fff;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 10px 25px rgba(0,0,0,.3)}
.login-box h2{font-size:20px;color:#0e2f5a;margin-bottom:16px}
.lbl{font-size:14px;font-weight:600;margin:12px 0 6px;color:#222}
.inp{width:100%;padding:13px 40px 13px 12px;border:1.6px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none}
.inp:focus{border-color:#0e2f5a}
.row{position:relative}
.icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px}
.btn{width:100%;padding:14px;background:#ffcc00;border:none;border-radius:12px;font-size:18px;font-weight:800;margin-top:18px;cursor:pointer;box-shadow:0 4px 0 #d4a800}
.small{font-size:11px;text-align:center;margin-top:12px;color:#666}
</style>
</head>
<body>
<div class="wrap">
<div class="top-card">
<img id="logo" src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
<div>
<div class="t1" id="bn">মমতাজ উদ্দীন বিজনেস ম্যানেজমেন্ট কলেজ</div>
<div class="t2" id="en">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div>
<div class="t3">■ EIIN: <b id="eiin">132332</b> &nbsp; ■ Ins. Code: <b id="code">50017</b></div>
</div>
</div>

<div class="login-box">
<h2>🎓 স্টুডেন্ট লগইন</h2>

<div class="lbl">কলেজ কোড</div>
<div class="row"><input id="cCode" class="inp" value="50017" oninput="loadPad()" placeholder="50017"><span class="icon">🏫</span></div>

<div class="lbl">পাসওয়ার্ড দিন</div>
<div class="row"><input id="pass" class="inp" type="password" value="12345678"><span class="icon" onclick="pass.type=pass.type=='password'?'text':'password'" style="cursor:pointer">👁️</span></div>

<div class="lbl">শ্রেণী নির্বাচন করুন</div>
<div class="row">
<select id="cls" class="inp">
<option>-- শ্রেণী বেছে নিন --</option>
<option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>একাদশ শ্রেণি</option><option>দ্বাদশ শ্রেণি</option>
</select>
</div>

<button class="btn" onclick="doLogin()">🔒 লগইন</button>
<div class="small">পাসওয়ার্ড ভুলে গেলে মিলিয়ে চালুন<br>সাহায্য: 01912427294</div>
</div>
</div>

<script>
function loadPad(){
 let code=document.getElementById('cCode').value.trim();
 let all=JSON.parse(localStorage.getItem('allColleges')||'{}');
 let c=all[code];
 if(!c){ // ডিফল্ট 50017
   if(code=='50017' &&!all['50017']){
     c={nameBN:'মমতাজ উদ্দীন বিজনেস ম্যানেজমেন্ট কলেজ',nameEN:'MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE',eiin:'132332',logo:'https://cdn-icons-png.flaticon.com/512/2232/2232688.png'};
   } else {return;}
 }
 document.getElementById('bn').innerText=c.nameBN;
 document.getElementById('en').innerText=c.nameEN;
 document.getElementById('eiin').innerText=c.eiin||'132332';
 document.getElementById('code').innerText=code;
 document.getElementById('logo').src=c.logo||'https://cdn-icons-png.flaticon.com/512/2232/2232688.png';
}
function doLogin(){
 let code=document.getElementById('cCode').value.trim();
 let cls=document.getElementById('cls').value;
 if(!code){alert('কোড দিন');return;}
 if(cls.includes('বেছে')){alert('শ্রেণী নির্বাচন করুন');return;}
 // ১ম পেজের জন্য কাউন্ট
 let todayStr=new Date().toDateString();
 let d=JSON.parse(localStorage.getItem('todayLogins')||'{"date":"","list":[]}');
 if(d.date!==todayStr) d={date:todayStr,list:[]};
 if(!d.list.includes(code)) d.list.push(code);
 localStorage.setItem('todayLogins',JSON.stringify(d));
 localStorage.setItem('lastLoginCode',code);
 alert('✅ লগইন সফল!\n'+code+' - '+cls);
 location.href='index.html';
}
loadPad();
</script>
</body>
</html>
