<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek 50K</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
body{background:#0a2342;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;box-shadow:0 0 25px rgba(255,215,0,.5);margin-top:10px}
.card{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:16px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.card h2{text-align:center;font-size:28px;color:#111}
.sub{text-align:center;color:#6b7280;font-size:13px;font-weight:700;margin:4px 0 16px;letter-spacing:1px}
select,input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #d1d5db;font-size:16px;margin:7px 0;background:white;outline:none}
.btn-login{width:100%;padding:14px;border-radius:14px;border:none;background:#0f2d5a;color:white;font-size:16px;font-weight:700;margin-top:8px;cursor:pointer}
#main{display:none;background:#f5f5f0;width:100%;min-height:100vh;position:fixed;top:0;left:0;z-index:9999;overflow-y:auto;padding:0;padding-bottom:100px}
/* দ্বিতীয় পাতা - ফাইনাল লক ডিজাইন */
.header2{background:#0f3d2e;color:white;padding:28px 15px 65px 15px;text-align:center;border-radius:0 0 28px 28px}
.header2 h1{margin:0;font-size:22px;line-height:1.3}
.header2 p{color:#ffde59;margin:8px 0 0;font-size:18px;font-weight:600}
.card2{background:white;margin:-35px 12px 20px;border-radius:22px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,0.1)}
.yellow-btn{background:#ffcc00;width:100%;padding:16px;border:none;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer}
.attendance{display:flex;gap:10px;margin:10px 0}
.att-box{flex:1;border-radius:16px;padding:14px;text-align:center}
.att-box b{font-size:32px;display:block}.att-box small{font-size:12px}
.blue{background:#eef6ff;color:#1e3a8a}.green{background:#e6f7ed;color:#15803d}.red{background:#ffe9e9;color:#dc2626}
.sms-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
.sms-grid button{padding:14px 5px;border:none;border-radius:14px;color:white;font-weight:700;font-size:13px}
.g{background:#16a34a}.o{background:#ea580c}.y{background:#ffcc00;color:#000!important}
.btm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btm-grid button{padding:14px;border:none;border-radius:14px;color:white;font-weight:700}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #eee;gap:6px}
.btn-e{background:#2563eb;color:white;border:none;padding:6px 10px;border-radius:6px}
.btn-d{background:#ef4444;color:white;border:none;padding:6px 10px;border-radius:6px;margin-left:5px}
.btn-p,.btn-a,.btn-l{width:36px;height:34px;border-radius:8px;border:none;color:white;font-weight:700}.btn-p{background:#16a34a}.btn-a{background:#ef4444}.btn-l{background:#f59e0b}
.active2{outline:3px solid #000}.inactive2{opacity:.35}
.m-input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0;background:white}
</style>
</head>
<body>

<!-- প্রথম পাতা - একদম তোমার দেওয়াটা, কোন চেঞ্জ নাই -->
<img class="logo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" id="topLogo">
<div id="loginBox" class="card">
<h2>🔐 শিক্ষক লগইন</h2><div class="sub">MALEK ATTENDANCE</div>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button class="btn-login" onclick="doLogin()">🔐 লগইন করুন - MALEK ATTENDANCE</button>
<p style="text-align:center;margin-top:10px;font-size:12px;color:#888">পাসওয়ার্ড: 1234</p>
</div>

<!-- দ্বিতীয় পাতা - তোমার ফাইনাল লক ডিজাইন -->
<div id="main">
<div class="header2">
<h1>মমতাজউদ্দিন বিজনেস<br>ম্যানেজমেন্ট কলেজ</h1>
<p>শ্রেণী: <span id="showClass2"></span></p>
</div>
<div class="card2">
<button class="yellow-btn" onclick="toggleList()">👥 শিক্ষার্থীর তালিকা</button>

<div id="studentArea" style="display:none;margin-top:15px">
<div style="display:flex;gap:8px;margin-bottom:10px">
<input type="text" id="searchBox" class="m-input" placeholder="🔍 নাম/রোল খুঁজুন" onkeyup="renderList()" style="flex:1">
<input type="date" id="attDate" class="m-input" style="flex:1">
</div>
<div id="list"></div>
<div style="margin-top:15px;background:#f8fafc;padding:12px;border-radius:12px;border:1px solid #ddd">
<b>➕ নাম-রোল-মোবাইল যোগ</b>
<input id="sname" class="m-input" placeholder="নাম"><div style="display:flex;gap:6px"><input id="sroll" class="m-input" placeholder="রোল"><input id="smobile" class="m-input" placeholder="মোবাইল"></div>
<button style="width:100%;padding:12px;background:#0a2342;color:white;border:none;border-radius:10px;font-weight:700" onclick="addOne()">+ যোগ করুন</button>
</div>
</div>

<div style="font-weight:700;margin:18px 0 10px;display:flex;justify-content:space-between">আজকের উপস্থিতি 📅 <span id="todayDate" style="font-weight:400;font-size:13px"></span></div>
<div class="attendance">
<div class="att-box blue"><span>👥 মোট</span><b id="tTotal">0</b><small>মোট শিক্ষার্থী</small></div>
<div class="att-box green"><span>✅ উপস্থিত</span><b id="tPresent">0</b><small>উপস্থিত</small></div>
<div class="att-box red"><span>➕ অনুপস্থিত</span><b id="tAbsent">0</b><small>অনুপস্থিত</small></div>
</div>

<div style="font-weight:700;margin:18px 0 8px">🔔 নোটিশ বোর্ড</div>
<input type="text" id="noticeText" class="m-input" placeholder="নোটিশ লিখুন...">

<div style="font-weight:700;margin:18px 0 8px">এসএমএস পাঠান</div>
<div class="sms-grid">
<button class="g" onclick="sendSMS('P')">💬 Present SMS</button>
<button class="o" onclick="sendSMS('A')">💬 Absent SMS</button>
<button class="y" onclick="sendSMS('N')">🔔 Notice SMS</button>
</div>

<div class="btm-grid">
<button class="g" onclick="exportExcel()">⬇️ Excel Export</button>
<button style="background:#2563eb" onclick="monthlyReport()">📊 Monthly Report</button>
</div>

<button style="width:100%;padding:12px;background:#555;color:white;border:none;border-radius:12px;margin-top:15px;font-weight:700" onclick="location.reload()">🔙 লগআউট</button>
</div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('malek_final_permanent')||'[]');
let attendance=JSON.parse(localStorage.getItem('malek_att_permanent')||'{}');
let listOpen=false;
document.getElementById('todayDate').innerText=new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});
function doLogin(){let c=loginClass.value,p=loginPass.value;if(!c){alert('শ্রেণি সিলেক্ট করুন');return}if(p!='1234'){alert('1234');return}showClass2.innerText=c;loginBox.style.display='none';topLogo.style.display='none';main.style.display='block';attDate.value=new Date().toISOString().split('T')[0];render();}
function toggleList(){listOpen=!listOpen;studentArea.style.display=listOpen?'block':'none';if(listOpen)renderList();}
function save(){localStorage.setItem('malek_final_permanent',JSON.stringify(students));localStorage.setItem('malek_att_permanent',JSON.stringify(attendance));render();}
function addOne(){let cls=loginClass.value,n=sname.value.trim(),r=sroll.value.trim(),m=smobile.value.trim();if(!n||!r){alert('নাম রোল দিন');return}students.push({class:cls,roll:r,name:n,mobile:m});sname.value='';sroll.value='';smobile.value='';save();renderList();}
function getStatus(i,d){return (attendance[d]&&attendance[d][i])||'P'}
function render(){let cls=loginClass.value,date=attDate.value;let all=students.filter(s=>s.class==cls);tTotal.innerText=all.length;tPresent.innerText=all.filter((_,idx)=>{let realIdx=students.indexOf(all[idx]);return getStatus(realIdx,date)!='A'}).length;tAbsent.innerText=all.length-parseInt(tPresent.innerText||0);if(listOpen)renderList();}
function renderList(){let cls=loginClass.value,q=searchBox.value.toLowerCase(),date=attDate.value;let filtered=students.map((s,i)=>({...s,realIdx:i})).filter(s=>s.class==cls).filter(s=>q==''||s.name.toLowerCase().includes(q)||s.roll.includes(q)).sort((a,b)=>a.roll-b.roll);let div=document.getElementById('list');div.innerHTML='';if(filtered.length==0)div.innerHTML='<p style="text-align:center;color:#888;padding:15px">কোনো শিক্ষার্থী নেই</p>';filtered.forEach(s=>{let st=getStatus(s.realIdx,date);div.innerHTML+=`<div class="student-row"><div style="flex:1"><b>${s.name}</b><br><small>রোল:${s.roll} | ${s.mobile||''}</small><br><button class="btn-e" onclick="editS(${s.realIdx})">✏️</button><button class="btn-d" onclick="delS(${s.realIdx})">🗑️</button></div><div style="display:flex;gap:4px"><button class="btn-p ${st=='P'?'active2':'inactive2'}" onclick="mark(${s.realIdx},'P')">P</button><button class="btn-a ${st=='A'?'active2':'inactive2'}" onclick="mark(${s.realIdx},'A')">A</button><button class="btn-l ${st=='L'?'active2':'inactive2'}" onclick="mark(${s.realIdx},'L')">L</button></div></div>`});render();}
function mark(i,s){let d=attDate.value;if(!attendance[d])attendance[d]={};attendance[d][i]=s;save();}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);save();}}
function editS(i){let s=students[i];let n=prompt('নাম:',s.name);if(n===null)return;let r=prompt('রোল:',s.roll);let m=prompt('মোবাইল:',s.mobile||'');students[i]={...s,name:n,roll:r,mobile:m};save();}
function exportExcel(){let cls=loginClass.value,date=attDate.value;let all=students.filter(s=>s.class==cls);if(!all.length)return alert('তালিকা খালি');let data=all.map(s=>({শ্রেণি:s.class,রোল:s.roll,নাম:s.name,মোবাইল:s.mobile||'',তারিখ:date,স্ট্যাটাস:(attendance[date]&&attendance[date][students.indexOf(s)])||'P'}));let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,cls);XLSX.writeFile(wb,cls+"_"+date+".xlsx");}
function monthlyReport(){alert('📊 Monthly Report - '+loginClass.value+'\nমোট: '+tTotal.innerText+' জন');}
function sendSMS(t){let notice=noticeText.value;alert(t+' SMS পাঠানো হবে। নোটিশ: '+notice);}
attDate.addEventListener('change',render);
</script>
</body>
</html>
