<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>মালেক ৫০কে</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{background:#eef2ff;min-height:100vh}.header{background:#2ee3ff;padding:18px 16px 22px 16px}.top-row{display:flex;justify-content:space-between;align-items:center}.date{font-size:22px;font-weight:800;color:#222;text-align:center}.time{font-size:14px;color:#444;text-align:center}.stats{display:flex;justify-content:space-around;margin-top:18px;font-weight:800;font-size:18px}.stats span{color:#5a0a0a}.search-box{padding:12px;background:#eef2ff}.search{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #d0d5e0;font-size:16px;background:white}.container{padding:16px}.title{font-size:22px;font-weight:800;margin:8px 0 14px 0}.inp{width:100%;padding:16px;border-radius:14px;border:1px solid #c9d0e0;margin-bottom:12px;font-size:16px;background:white}.inp:focus{outline:2px solid #0a2a5a}.btn-add{width:100%;padding:16px;background:#0a2a5a;color:white;border:none;border-radius:14px;font-size:18px;font-weight:700;margin-bottom:12px}.row{display:flex;gap:10px;margin-bottom:12px}.btn-sms{flex:1;padding:14px;border:none;border-radius:12px;color:white;font-weight:700;font-size:16px}.btn-present{background:#1aad5a}.btn-absent{background:#e53935}.btn-excel{width:100%;padding:14px;background:#0aa3e8;color:white;border:none;border-radius:14px;font-size:17px;font-weight:600;margin-bottom:16px}.list-card{background:white;border-radius:14px;padding:8px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}table{width:100%;border-collapse:collapse;font-size:14px}th{padding:8px;background:#f5f7ff}td{padding:10px 6px;border-bottom:1px solid #eee;text-align:center}.pill{padding:5px 10px;border-radius:20px;border:none;font-weight:700;font-size:13px;margin:2px}.p-on{background:#1aad5a;color:white}.p-off{background:#e8e8e8}.a-on{background:#e53935;color:white}.a-off{background:#e8e8e8}</style></head><body><div class="header"><div class="top-row"><span style="font-size:28px">←</span><div><div class="date" id="dateText"></div><div class="time" id="timeText"></div></div><span style="font-size:24px">🔒</span></div><div class="stats"><div>মোট:<span id="total">0</span></div><div>P:<span id="pCount">0</span></div><div>A:<span id="aCount">0</span></div></div></div><div class="search-box"><input id="search" class="search" placeholder="Search নাম / রোল..." oninput="render()"></div><div class="container"><div class="title">নতুন শিক্ষার্থী যোগ করুন</div><input id="name" class="inp" placeholder="নাম"><input id="roll" class="inp" placeholder="রোল" type="number"><input id="mobile" class="inp" placeholder="অভিভাবকের মোবাইল 01..." type="tel" style="border:2px solid #0a2a5a"><button class="btn-add" onclick="addStudent()">+ যোগ করো</button><div class="row"><button class="btn-sms btn-present" onclick="sendPresentSMS()">✉️ উপস্থিত SMS</button><button class="btn-sms btn-absent" onclick="sendAbsentSMS()">✉️ অনুপস্থিত SMS</button></div><button class="btn-excel" onclick="exportExcel()">Excel Download</button><div id="listArea" class="list-card" style="display:none"><table><thead><tr><th>রোল</th><th>নাম</th><th>হাজিরা</th><th>SMS</th></tr></thead><tbody id="list"></tbody></table></div></div><script>function updateDateTime(){let n=new Date();document.getElementById('dateText').innerText=n.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});document.getElementById('timeText').innerText=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}updateDateTime();setInterval(updateDateTime,60000);let old=JSON.parse(localStorage.getItem('malek50k')||'[]');let students=JSON.parse(localStorage.getItem('malek50k_final')||'[]');if(students.length==0&&old.length>0){students=old.map(s=>({name:s.name||'',roll:String(s.roll||''),mobile:s.mobile||''}))}let attendance=JSON.parse(localStorage.getItem('malek_att_final')||'{}');let todayKey=new Date().toISOString().split('T')[0];function save(){localStorage.setItem('malek50k_final',JSON.stringify(students));localStorage.setItem('malek_att_final',JSON.stringify(attendance))}function getStatus(r){return(attendance[todayKey]&&attendance[todayKey][r])||''}function setStatus(r,s){if(!attendance[todayKey])attendance[todayKey]={};attendance[todayKey][r]=s;save();render()}function addStudent(){let n=name.value.trim(),r=roll.value.trim(),m=mobile.value.trim();if(!n||!r||!m){alert('সব লিখুন');return}students.push({name:n,roll:r,mobile:m});save();name.value='';roll.value='';mobile.value='';render()}function render(){let q=search.value.toLowerCase();let f=students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.includes(q));let tb=list;tb.innerHTML='';let p=0,a=0;f.forEach(s=>{let st=getStatus(s.roll);if(st=='P')p++;if(st=='A')a++;tb.innerHTML+=`<tr><td>${s.roll}</td><td>${s.name}</td><td><button class="pill ${st=='P'?'p-on':'p-off'}" onclick="setStatus('${s.roll}','P')">P</button><button class="pill ${st=='A'?'a-on':'a-off'}" onclick="setStatus('${s.roll}','A')">A</button></td><td><button class="pill" style="background:#ff9500;color:white" onclick="location.href='sms:${s.mobile}?body='+encodeURIComponent('প্রিয় ${s.name} - মমতাজ উদ্দিন কলেজ')">SMS</button></td></tr>`});total.innerText=students.length;pCount.innerText=p;aCount.innerText=a;listArea.style.display=students.length?'block':'none'}function sendPresentSMS(){let l=students.filter(s=>getStatus(s.roll)=='P');if(!l.length){alert('উপস্থিত নাই');return}location.href=`sms:${l.map(s=>s.mobile).join(',')}?body=${encodeURIComponent(`আজ ${todayKey} উপস্থিত - মমতাজ উদ্দিন কলেজ`)}`}function sendAbsentSMS(){let l=students.filter(s=>getStatus(s.roll)=='A');if(!l.length){alert('অনুপস্থিত নাই');return}location.href=`sms:${l.map(s=>s.mobile).join(',')}?body=${encodeURIComponent(`আজ ${todayKey} আপনার সন্তান অনুপস্থিত - মমতাজ উদ্দিন কলেজ`)}`}function exportExcel(){let csv="Roll,Name,Guardian Mobile,Date,Status\n";students.forEach(s=>{csv+=`${s.roll},"${s.name}",${s.mobile},${todayKey},${getStatus(s.roll)||''}\n`});let b=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Hazira_${todayKey}.csv`;a.click()}render();</script></body></html>
