<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মালিক প্যানেল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1931;font-family:'Hind Siliguri';display:flex;justify-content:center;padding:10px}
.w{max-width:500px;width:100%}
.top{border:3px solid #ffcc00;border-radius:22px;overflow:hidden;box-shadow:0 0 20px rgba(255,204,0,.5)}
.top img{width:100%;display:block}
.card{background:#fff;border-radius:22px;padding:18px;margin-top:14px}
h2{text-align:center;font-size:24px}
.sub{text-align:center;color:#666;margin:4px 0 12px}
input{width:100%;padding:14px;border:2px solid #0a1931;border-radius:14px;font-family:'Hind Siliguri';font-size:18px;outline:none;text-align:center;margin-top:10px}
.btn{width:100%;padding:14px;background:#0a1931;color:#fff;border:none;border-radius:14px;font-weight:800;font-size:18px;font-family:'Hind Siliguri';cursor:pointer;margin-top:12px}
.btn2{width:100%;padding:12px;background:#fff;border:2px dashed #0a1931;border-radius:14px;font-weight:700;font-family:'Hind Siliguri';cursor:pointer;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sbox{background:#eef0ff;border-radius:14px;padding:12px;font-weight:800;font-size:15px}
.inst{background:#f8f9ff;border:1px solid #c5ccff;border-radius:14px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.online{color:#0e8a3c;font-weight:800}.offline{color:#c62828;font-weight:800}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;color:#fff}
</style>
</head>
<body>
<div class="w">

<div class="top">
<img src="https://i.ibb.co/3Y0Z9kXj/malek-logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2232/2232688.png'">
</div>

<div class="card">
<h2>🔐 মালিক লগইন</h2>
<div class="sub">পাসওয়ার্ড দিন</div>
<input id="pass" type="password" placeholder="••••">
<button class="btn" onclick="login()">🔓 লগইন করুন</button>
<button class="btn2" onclick="changePass()">🔑 পাসওয়ার্ড পরিবর্তন / রিসেট</button>

<div style="margin-top:16px;font-weight:800;font-size:18px">📊 ড্যাশবোর্ড পরিসংখ্যান</div>
<div class="stats">
<div class="sbox">🏢 মোট প্রতিষ্ঠান:<br><span id="totalC">0 টা</span></div>
<div class="sbox">👤 আজ লগইন:<br><span id="todayL">0 টা</span></div>
<div class="sbox">📶 অফলাইন:<br><span id="offlineC">0 টা</span></div>
<div class="sbox">💰 পেমেন্ট বাকি:<br><span id="dueC">0 টা</span></div>
</div>

<div style="margin-top:18px;font-weight:800;font-size:18px">🏫 কোন কোন প্রতিষ্ঠান লগইন করছে</div>
<div id="instList"></div>

<div style="text-align:center;margin-top:16px;color:#666;font-size:13px;line-height:1.4">
Engineered by Mohammad Abdul Malek<br>
01912427294 | sikkhaoniom80.github.io<br>
বর্তমান পাস: <span id="showPass">1234</span>
</div>

<div style="display:flex;gap:8px;margin-top:12px">
<button onclick="location.href='login.html'" style="flex:1;padding:12px;background:#0bb34a;color:#fff;border:none;border-radius:12px;font-weight:800;font-family:'Hind Siliguri'">২য় পেজ → কলেজ লগইন</button>
</div>

</div>
</div>

<script>
let ownerPass=localStorage.getItem('ownerPass')||'1234';
document.getElementById('showPass').innerText=ownerPass;

function loadDashboard(){
let all=JSON.parse(localStorage.getItem('allColleges')||'{}');
let keys=Object.keys(all);
let total=keys.length;
let today=new Date().toISOString().slice(0,10);
let todayLogin=0, offline=0, due=0;
let html='';
keys.forEach(k=>{
let c=all[k];
let last=c.lastLogin||'কখনো না';
let isToday=last.startsWith(today);
if(isToday) todayLogin++;
let isOnline = c.isOnline || isToday;
if(!isOnline) offline++;
if(c.due!==false) due++;
let status=isOnline?`<span class="online">● অনলাইন</span>`:`<span class="offline">● অফলাইন</span>`;
let badge=isOnline?`<span class="badge" style="background:#0e8a3c">ON</span>`:`<span class="badge" style="background:#c62828">OFF</span>`;
html+=`
<div class="inst">
<div>
<div style="font-weight:800;font-size:15px">${c.bn||c.nameBN||k}</div>
<div style="font-size:12px;color:#666">Code:${c.code||k} | EIIN:${c.eiin||''}</div>
<div style="font-size:12px;margin-top:2px">⏰ শেষ লগইন: ${last}</div>
<div>${status}</div>
</div>
<div>${badge}</div>
</div>`;
});
document.getElementById('totalC').innerText=total+' টা';
document.getElementById('todayL').innerText=todayLogin+' টা';
document.getElementById('offlineC').innerText=offline+' টা';
document.getElementById('dueC').innerText=due+' টা';
document.getElementById('instList').innerHTML=html||'<div style="padding:12px;text-align:center;color:#888;border:1px dashed #ccc;border-radius:12px;margin-top:10px">এখনো কোনো প্রতিষ্ঠান যোগ হয়নি</div>';
}
loadDashboard();

function login(){
let p=document.getElementById('pass').value;
if(p===ownerPass){
alert('✅ মালিক লগইন সফল!');
localStorage.setItem('ownerLogged','true');
location.href='login.html';
}else{alert('❌ ভুল পাসওয়ার্ড!');}
}
function changePass(){
let np=prompt('নতুন পাসওয়ার্ড দিন:',ownerPass);
if(np){localStorage.setItem('ownerPass',np);ownerPass=np;document.getElementById('showPass').innerText=np;alert('✅ পাসওয়ার্ড পরিবর্তন হয়েছে: '+np);}
}

// ২য় পেজে লগইন করলে এই পেজে টাইম আপডেট হবে
setInterval(loadDashboard,2000);
</script>
</body>
</html>
