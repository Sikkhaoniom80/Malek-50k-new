<!-- 📊 ড্যাশবোর্ড - শুধু এইটা বসান -->
<div class="card">
<h3 style="text-align:center;margin:0 0 10px">📊 ড্যাশবোর্ড</h3>

<!-- ১। প্রতিষ্ঠানের তালিকা - ভিতরে শ্রেণি নাই -->
<button onclick="toggleList()" style="background:#0f3d2e;color:white;width:100%;padding:13px;border:none;border-radius:12px;font-weight:700;cursor:pointer">🏫 ১। প্রতিষ্ঠানের তালিকা (হাইড) - ক্লিকে দেখুন</button>
<div id="listDiv" class="hide" style="display:none;margin-top:10px;border:2px dashed #0f3d2e;border-radius:12px;padding:10px;max-height:400px;overflow:auto;background:#f8fafc"></div>

<!-- ২। লগইন / লগআউট -->
<div style="margin-top:12px;border:2px solid #0284c7;border-radius:14px;padding:12px">
<p style="text-align:center;margin:0 0 8px;font-weight:700">২। লগইন / লগআউট স্ট্যাটাস</p>
<div style="display:flex;gap:8px">
<div style="flex:1;text-align:center;background:#dcfce7;border:2px solid #16a34a;border-radius:14px;padding:14px"><small>🟢 লগইন আছে</small><br><b id="loginCount" style="font-size:26px">0</b><br><small>টি</small></div>
<div style="flex:1;text-align:center;background:#fee2e2;border:2px solid #dc2626;border-radius:14px;padding:14px"><small>🔴 লগআউট</small><br><b id="logoutCount" style="font-size:26px">0</b><br><small>টি</small></div>
<div style="flex:1;text-align:center;background:#e0f2fe;border:2px solid #0284c7;border-radius:14px;padding:14px"><small>🏫 মোট প্রতিষ্ঠান</small><br><b id="total" style="font-size:26px">0</b><br><small>টি</small></div>
</div>
</div>
</div>

<script>
let list = JSON.parse(localStorage.getItem('instituteList')||'[]');
function updateDash(){
  let total=list.length;
  let login = list.filter(x=> x.status==='login').length;
  let logout = total - login;
  document.getElementById('total').innerText=total;
  document.getElementById('loginCount').innerText=login;
  document.getElementById('logoutCount').innerText=logout;
}
function toggleList(){
  let d=document.getElementById('listDiv');
  d.style.display=d.style.display=='block'?'none':'block';
  if(d.style.display=='block'){
    if(list.length==0){d.innerHTML='<p style="text-align:center">এখনো কোন প্রতিষ্ঠান এড হয়নি</p>';return;}
    // শ্রেণি বাদ - শুধু প্রতিষ্ঠান, স্ট্যাটাস, সময়
    let h='<table border=1 cellpadding=6 style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#0f3d2e;color:#fff"><th>প্রতিষ্ঠান</th><th>স্ট্যাটাস</th><th>সময়</th></tr>';
    list.forEach(x=>{
      let st = x.status==='login' ? '<span style="color:green">🟢 লগইন</span>' : '<span style="color:red">🔴 লগআউট</span>';
      let name = x.name || x.college || 'মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ';
      h+='<tr><td>'+name+'</td><td>'+st+'</td><td style="font-size:10px">'+(x.time||'')+'</td></tr>';
    });
    h+='</table>'; d.innerHTML=h;
  }
}
window.onload=updateDash;
</script>
