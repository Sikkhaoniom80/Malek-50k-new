<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>মালেক ৫০কে</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#eef2ff}.header{background:#22e5ff;padding:16px 12px 18px 12px;text-align:center}.college{font-size:15px;font-weight:700;color:#003366;margin-bottom:2px}.mainTitle{font-size:22px;font-weight:900;color:#000;margin-bottom:4px}.date{font-size:14px;color:#333}.stats{display:flex;justify-content:space-around;margin-top:12px;font-weight:800;font-size:17px;background:#fff;padding:10px;border-radius:10px}.search{width:94%;margin:10px 3%;padding:14px;border-radius:12px;border:1px solid #ccc;font-size:16px}.box{padding:14px}.inp{width:100%;padding:15px;border-radius:12px;border:1px solid #c0c8d8;margin-bottom:10px;font-size:16px;background:#fff}.btn{width:100%;padding:15px;border-radius:12px;border:none;color:#fff;font-size:18px;font-weight:700}.add{background:#0a2a5a;margin-bottom:10px}.row{display:flex;gap:8px;margin-bottom:10px}.sms{flex:1;padding:13px;border-radius:12px;border:none;color:#fff;font-weight:700}.present{background:#1aad5a}.absent{background:#e53935}.excel{background:#0aa3e8}.list{background:#fff;border-radius:12px;padding:8px;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:center;font-size:14px}.pill{padding:8px 14px;border-radius:20px;border:none;font-weight:700;margin:3px}.onP{background:#1aad5a;color:#fff;border:2px solid #000}.onA{background:#e53935;color:#fff;border:2px solid #000}.off{background:#e5e7eb}</style></head><body><div class="header"><div class="college">মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div><div class="mainTitle">📚 মালেক ৫০কে অ্যাটেনডেন্স</div><div class="date" id="dateD">September 17, 2026 - 19:45</div><div class="stats"><div>মোট:<span id="tTotal">0</span></div><div>P:<span id="tP">0</span></div><div>A:<span id="tA">0</span></div></div></div><input id="searchInput" class="search" placeholder="Search নাম / রোল..." oninput="showList()"><div class="box"><h3 style="margin-bottom:10px">নতুন শিক্ষার্থী যোগ করুন</h3><input id="inputName" class="inp" placeholder="নাম"><input id="inputRoll" class="inp" placeholder="রোল" type="number"><input id="inputMobile" class="inp" placeholder="অভিভাবকের মোবাইল 01..." type="tel"><button class="btn add" onclick="addNow()">+ যোগ করো</button><div class="row"><button class="sms present" onclick="sendPresent()">✉️ উপস্থিত SMS</button><button class="sms absent" onclick="sendAbsent()">✉️ অনুপস্থিত SMS</button></div><button class="btn excel" onclick="downloadExcel()">📊 Excel Download</button><div class="list"><table><thead><tr><th>রোল</th><th>নাম</th><th>P / A</th></tr></thead><tbody id="tableBody"></tbody></table><p id="emptyMsg" style="text-align:center;padding:18px;color:#888">উপরে নাম, রোল, মোবাইল লিখে + যোগ করো চাপুন মামা</p></div></div><script>
var students=[];var attendance={};var today=new Date().toISOString().split('T')[0];
function load(){try{students=JSON.parse(localStorage.getItem("malek_V6")||"[]");attendance=JSON.parse(localStorage.getItem("att_V6")||"{}");}catch(e){}}
function save(){localStorage.setItem("malek_V6",JSON.stringify(students));localStorage.setItem("att_V6",JSON.stringify(attendance));}
function getS(r){return attendance[today]&&attendance[today][r]||"";}
function setS(r,s){if(!attendance[today])attendance[today]={};attendance[today][r]=s;save();showList();}
function addNow(){var n=document.getElementById("inputName").value.trim();var r=document.getElementById("inputRoll").value.trim();var m=document.getElementById("inputMobile").value.trim();if(n==""||r==""||m==""){alert("মামা ৩টাই লিখুন");return;}if(students.find(x=>x.roll==r)){alert("এই রোল আছে");return;}students.push({name:n,roll:r,mobile:m});save();document.getElementById("inputName").value="";document.getElementById("inputRoll").value="";document.getElementById("inputMobile").value="";showList();}
function showList(){var q=document.getElementById("searchInput").value.toLowerCase();var tb=document.getElementById("tableBody");tb.innerHTML="";var p=0,a=0;for(var i=0;i<students.length;i++){var s=students[i];if(s.name.toLowerCase().indexOf(q)==-1&&s.roll.indexOf(q)==-1)continue;var st=getS(s.roll);if(st=="P")p++;if(st=="A")a++;tb.innerHTML+='<tr><td>'+s.roll+'</td><td>'+s.name+'<br><small>'+s.mobile+'</small></td><td><button class="pill '+(st=="P"?"onP":"off")+'" onclick="setS(\''+s.roll+'\',\'P\')">P উপস্থিত</button><button class="pill '+(st=="A"?"onA":"off")+'" onclick="setS(\''+s.roll+'\',\'A\')">A অনুপ</button></td></tr>';}document.getElementById("tTotal").innerText=students.length;document.getElementById("tP").innerText=p;document.getElementById("tA").innerText=a;document.getElementById("emptyMsg").style.display=students.length?"none":"block";}
function sendPresent(){var l=students.filter(s=>getS(s.roll)=="P");if(!l.length){alert("আগে P চাপুন");return;}location.href="sms:"+l.map(s=>s.mobile).join(",")+"?body="+encodeURIComponent("আজ উপস্থিত - মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ");}
function sendAbsent(){var l=students.filter(s=>getS(s.roll)=="A");if(!l.length){alert("আগে A চাপুন");return;}location.href="sms:"+l.map(s=>s.mobile).join(",")+"?body="+encodeURIComponent("আজ আপনার সন্তান অনুপস্থিত - মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ, মালেক স্যার");}
function downloadExcel(){var csv="Roll,Name,Mobile,Date,Status,College\n";for(var i=0;i<students.length;i++){var s=students[i];csv+=s.roll+","+s.name+","+s.mobile+","+today+","+getS(s.roll)+",Momotaz Uddin Business Management College\n";}var b=new Blob([csv],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Hazira_"+today+".csv";a.click();}
var now=new Date();document.getElementById("dateD").innerText=now.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+" - "+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});load();showList();
</script></body></html>
