<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মমতাজ উদ্দিন - মালেক ৫০কে</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;padding:10px;font-family:Arial}
.h{background:#1e40af;color:#fff;padding:18px;border-radius:14px;text-align:center}
.c{background:#fff;padding:15px;border-radius:12px;margin:10px 0}
input{width:100%;padding:14px;margin:6px 0;border:1.5px solid #ccc;border-radius:10px;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;color:#fff;font-weight:bold;margin:5px 0;background:#2563eb}
.item{background:#f8fafc;padding:10px;margin:6px 0;border-radius:8px;border-left:4px solid #2563eb}
</style>
</head>
<body>
<div class="h"><h2>মমতাজ উদ্দিন কলেজ</h2><p>মালেক ৫০কে - নাম রোল মোবাইল</p><p id="cnt">মোট: 0 জন</p></div>
<div class="c">
<input id="n" placeholder="👤 নাম বাংলায়">
<input id="r" placeholder="🔢 রোল">
<input id="m" placeholder="📱 মোবাইল">
<button class="btn" onclick="add()">➕ যোগ করুন</button>
</div>
<div class="c"><input id="s" placeholder="🔍 খুঁজুন" oninput="show()"><div id="list"></div></div>
<script>
let d=JSON.parse(localStorage.getItem('MALEK50K')||'[]');
function add(){let n=document.getElementById('n').value,r=document.getElementById('r').value,m=document.getElementById('m').value;if(!n||!r)return alert('নাম রোল লিখুন মামা');d.unshift({n,r,m});localStorage.setItem('MALEK50K',JSON.stringify(d));document.getElementById('n').value='';document.getElementById('r').value='';document.getElementById('m').value='';show()}
function show(){let q=document.getElementById('s').value.toLowerCase(),h='';d.forEach((x,i)=>{if(x.n.toLowerCase().includes(q)||x.r.includes(q))h+=`<div class=item><b>${x.n}</b> - রোল: ${x.r} - ${x.m} <button onclick="d.splice(${i},1);localStorage.setItem('MALEK50K',JSON.stringify(d));show()" style=float:right;color:red;border:none;background:#fee2e2;padding:5px 10px;border-radius:6px>X</button></div>`});document.getElementById('list').innerHTML=h||'কোনো ছাত্র নেই';document.getElementById('cnt').innerText='মোট: '+d.length+' জন'}show()
</script>
</body>
</html>
