<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</title>
<style>
body{margin:0;font-family:sans-serif;background:#f0f2f5}
.header{background:#0f3d2e;color:white;padding:25px 15px 60px 15px;border-radius:0 0 30px 30px;text-align:center}
.header h1{font-size:22px;margin:0;line-height:1.3}
.header p{color:#ffde59;font-size:18px;font-weight:bold;margin:10px 0}
.card{background:white;margin:-30px 15px 15px;border-radius:20px;padding:15px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.yellow-btn{background:#ffcc00;width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.page{display:none}
.page.active{display:block}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.btn-edit{background:#2196F3;color:white;border:none;padding:5px 10px;border-radius:5px}
.btn-del{background:#f44336;color:white;border:none;padding:5px 10px;border-radius:5px;margin-left:5px}
.attendance{display:flex;gap:10px;margin-top:15px}
.att-box{background:white;flex:1;text-align:center;padding:15px;border-radius:12px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.sms-btns{display:flex;gap:8px;margin-top:10px}
.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:black!important}
</style>
</head>
<body>

<!-- ===== প্রথম পাতা - এটা ফিক্সড থাকবে ===== -->
<div id="firstPage" class="page active">
  <div class="header">
    <h1>মমতাজউদ্দিন বিজনেস<br>ম্যানেজমেন্ট কলেজ</h1>
    <p>শ্রেণী: নবম</p>
  </div>
  <div class="card">
    <button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা (সম্পূর্ণ তালিকা দেখুন - শিক্ষার্থী যোগ করুন)</button>

    <h3>📅 উপস্থিতি</h3>
    <div class="attendance">
      <div class="att-box"><b>মোট<br><span id="total">0</span></b></div>
      <div class="att-box" style="color:green"><b>উপস্থিত<br><span id="present">0</span></b></div>
      <div class="att-box" style="color:red"><b>অনুপস্থিত<br><span id="absent">0</span></b></div>
    </div>

    <h3>📢 নোটিশ বোর্ড</h3>
    <input type="text" id="noticeText" placeholder="এখানে নোটিশ লিখুন..." style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc">

    <h3>💬 SMS পাঠান</h3>
    <div class="sms-btns">
      <button class="green">Present SMS</button>
      <button class="orange">Absent SMS</button>
      <button class="yellow">Notice SMS</button>
    </div>
  </div>
</div>

<!-- ===== দ্বিতীয় পাতা - এটা চেঞ্জ হবে ===== -->
<div id="secondPage" class="page">
  <div class="header" style="padding-bottom:25px">
    <h1>শিক্ষার্থীর তালিকা</h1>
    <button onclick="goFirst()" style="background:white;color:#0f3d2e;border:none;padding:5px 15px;border-radius:20px;margin-top:10px">⬅️ প্রথম পাতায় ফিরুন</button>
  </div>
  <div class="card">
    <button class="yellow-btn" onclick="showTab('list')">📋 সম্পূর্ণ তালিকা দেখুন</button>
    <button class="yellow-btn" style="margin-top:10px;background:#e0f2e9" onclick="showTab('add')">➕ শিক্ষার্থী যোগ করুন</button>

    <!-- সম্পূর্ণ তালিকা -->
    <div id="listTab" style="margin-top:20px">
      <h3>সম্পূর্ণ তালিকা (এডিট/ডিলিট সহ)</h3>
      <div id="studentList"></div>
    </div>

    <!-- শিক্ষার্থী যোগ -->
    <div id="addTab" style="display:none;margin-top:20px">
      <h3>নতুন শিক্ষার্থী যোগ করুন</h3>
      <input type="text" id="sName" placeholder="নাম" style="width:100%;padding:10px;margin:5px 0">
      <input type="text" id="sRoll" placeholder="রোল" style="width:100%;padding:10px;margin:5px 0">
      <input type="text" id="sMobile" placeholder="মোবাইল" style="width:100%;padding:10px;margin:5px 0">
      <button onclick="addStudent()" style="width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;margin-top:10px">যোগ করুন</button>
    </div>
  </div>
</div>

<script>
let students = JSON.parse(localStorage.getItem('students9') || '[]');
function openStudentPage(){document.getElementById('firstPage').classList.remove('active');document.getElementById('secondPage').classList.add('active');render();}
function goFirst(){document.getElementById('secondPage').classList.remove('active');document.getElementById('firstPage').classList.add('active');}
function showTab(t){document.getElementById('listTab').style.display=t=='list'?'block':'none';document.getElementById('addTab').style.display=t=='add'?'block':'none';}
function addStudent(){
  let name=document.getElementById('sName').value, roll=document.getElementById('sRoll').value, mob=document.getElementById('sMobile').value;
  if(!name||!roll) return alert('নাম ও রোল দিন');
  students.push({name,roll,mob});localStorage.setItem('students9',JSON.stringify(students));
  document.getElementById('sName').value='';document.getElementById('sRoll').value='';document.getElementById('sMobile').value='';
  render();showTab('list');alert('যোগ হয়েছে');
}
function render(){
  let list=document.getElementById('studentList');list.innerHTML='';
  students.forEach((s,i)=>{
    list.innerHTML+=`<div class="student-row"><div><b>${s.name}</b> - রোল: ${s.roll}</div><div><button class="btn-edit" onclick="editS(${i})">এডিট</button><button class="btn-del" onclick="delS(${i})">ডিলিট</button></div></div>`;
  });
  document.getElementById('total').innerText=students.length;
}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);localStorage.setItem('students9',JSON.stringify(students));render();}}
function editS(i){let s=students[i];let n=prompt('নাম:',s.name);if(n){s.name=n;s.roll=prompt('রোল:',s.roll);s.mob=prompt('মোবাইল:',s.mob);localStorage.setItem('students9',JSON.stringify(students));render();}}
render();
</script>
</body>
</html>
