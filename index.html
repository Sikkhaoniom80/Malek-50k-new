<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malek 50K - Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;margin-top:10px}
.card-login{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:16px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.attendance{display:flex;gap:8px;margin:10px 0}.att-box{flex:1;background:#fff;text-align:center;padding:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}.blue{background:#2563eb}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.filter-tabs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-active{outline:3px solid #0f3d2e}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
</style>
</head>
<body>
<img class="logo" id="topLogo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" onerror="this.style.display='none'">
<div id="loginPage" class="card-login">
<h2 style="text-align:center">🔐 শিক্ষক লগইন</h2>
<select id="loginClass">
<option value="">শ্রেণি সিলেক্ট করুন</option>
<option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>একাদশ শ্রেণি</option><option>দ্বাদশ শ্রেণি</option>
</select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button style="width:100%;padding:14px;border:none;border-radius:14px;background:#0f2d5a;color:white;font-weight:700;margin-top:8px" onclick="doLogin()">🔐 লগইন করুন</button>
</div>

<!-- ২য় পাতা - ড্যাশবোর্ড -->
<div id="firstPage" class="page">
  <div class="header"><h1>মমতাজউদ্দিন বিজনেস<br>ম্যানেজমেন্ট কলেজ</h1><p>শ্রেণী: <span id="showClass"></span></p></div>
  <div class="card">
    <button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা (৪ ট্যাব - সম্পূর্ণ তালিকা)</button>
    <h3>📅 উপস্থিতি</h3>
    <div class="attendance"><div class="att-box"><small>মোট</small><br><b id="total">0</b></div><div class="att-box"><small>উপস্থিত</small><br><b id="present" style="color:green">0</b></div><div class="att-box"><small>অনুপস্থিত</small><br><b id="absent" style="color:red">0</b></div></div>
    <h3>📢 নোটিশ বোর্ড</h3><input type="text" id="noticeText" placeholder="এখানে নোটিশ লিখুন...">
    <h3>💬 SMS পাঠান</h3>
    <div class="sms-btns"><button class="green" onclick="sendSMS('present')">Present SMS</button><button class="orange" onclick="sendSMS('absent')">Absent SMS</button><button class="yellow" onclick="sendSMS('notice')">Notice SMS</button></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="green" style="flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold" onclick="exportExcel()">⬇️ Excel Export</button><button class="blue" style="flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold" onclick="monthlyReport2()">📊 Monthly Report</button></div>
    <div id="monthlyDiv2" style="display:none;overflow:auto;margin-top:12px;border:2px solid #2563eb;border-radius:12px;padding:10px;background:#f8fafc"></div>
    <button onclick="location.reload()" style="width:100%;margin-top:12px;padding:10px;background:#555;color:white;border:none;border-radius:10px">🔙 লগআউট</button>
  </div>
</div>

<!-- ৩য় পাতা - ৪ ট্যাব -->
<div id="secondPage" class="page">
  <div class="header" style="padding-bottom:20px"><h2 style="margin:0">শিক্ষার্থীর তালিকা</h2><button onclick="goFirst()" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
  <div class="card">
    <button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন - ক্লিক করুন</button>
    <div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a">
      <input type="text" id="sName" placeholder="শিক্ষার্থীর নাম"><input type="text" id="sRoll" placeholder="রোল নম্বর"><input type="text" id="sMobile" placeholder="মোবাইল 017xxxxxxxx">
      <div style="display:flex;gap:8px;margin-top:8px"><button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold">✅ যোগ করুন</button><button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px">❌ বন্ধ</button></div>
    </div>
    <div class="filter-tabs"><button id="tabAll" style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><span id="cAll">0</span></button><button id="tabPresent" style="background:#16a34a;color:white" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent">0</span></button><button id="tabAbsent" style="background:#ef4444;color:white" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent">0</span></button><button id="tabMonthly" style="background:#2563eb;color:white" onclick="filterList('monthly')">📅 মাসিক</button></div>
    <div id="studentList"></div><div id="monthlyDiv" style="display:none;overflow:auto;margin-top:10px;border:2px dashed #2563eb;border-radius:12px;padding:10px"></div>
  </div>
</div>

<script>
let students = JSON.parse(localStorage.getItem('students9')||'[]');
let attendance = JSON.parse(localStorage.getItem('att9')||'{}');
let currentFilter='all';
function doLogin(){let c=loginClass.value,p=loginPass.value;if(!c)return alert('শ্রেণি সিলেক্ট করুন');if(p!='1234')return alert('পাসওয়ার্ড 1234');showClass.innerText=c;loginPage.style.display='none';topLogo.style.display='none';firstPage.classList.add('active');document.body.style.background='#f0f2f5';updateCounts();}
function openStudentPage(){firstPage.classList.remove('active');secondPage.classList.add('active');filterList('all');}
function goFirst(){secondPage.classList.remove('active');firstPage.classList.add('active');updateCounts();}
function toggleAdd(){let f=document.getElementById('addForm');f.style.display=f.style.display=='none'?'block':'none';}
function addStudent(){let n=sName.value.trim(),r=sRoll.value.trim(),m=sMobile.value.trim();if(!n||!r)return alert('নাম ও রোল দিন');if(!m)return alert('মোবাইল দিন মামা, না হলে SMS যাবে না');students.push({name:n,roll:r,mobile:m});localStorage.setItem('students9',JSON.stringify(students));sName.value='';sRoll.value='';sMobile.value='';document.getElementById('addForm').style.display='none';filterList('all');}
function filterList(type){currentFilter=type;document.querySelectorAll('.filter-tabs button').forEach(b=>b.classList.remove('btn-active'));let el=document.getElementById('tab'+type.charAt(0).toUpperCase()+type.slice(1));if(el)el.classList.add('btn-active');if(type=='monthly'){studentList.style.display='none';monthlyDiv.style.display='block';renderMonthly3();}else{studentList.style.display='block';monthlyDiv.style.display='none';render();}}
function render(){students.sort((a,b)=>parseInt(a.roll)-parseInt(b.roll));let list=document.getElementById('studentList');list.innerHTML='';let filtered=students.map((s,i)=>({...s,idx:i})).filter(s=>{if(currentFilter=='present')return attendance[s.idx]!=='absent';if(currentFilter=='absent')return attendance[s.idx]=='absent';return true;});if(filtered.length==0)list.innerHTML='<p style="text-align:center;color:gray">তালিকা খালি</p>';filtered.forEach(s=>{let i=s.idx;let checked=attendance[i]=='absent'?'':'checked';list.innerHTML+=`<div class="student-row"><div><input type="checkbox" ${checked} onchange="toggleAtt(${i},this.checked)"> <b>${s.name}</b> (${s.roll})<br><small>${s.mobile}</small></div><div><button onclick="editS(${i})">✏️</button><button onclick="delS(${i})">🗑️</button></div></div>`;});updateCounts();}
function renderMonthly3(){let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'});let div=document.getElementById('monthlyDiv');let html=`<h4>📅 মাসিক হাজিরা - ${monthName}</h4><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><tr><th>মাস</th><th>নাম (রোল)</th><th>অবস্থা</th></tr>`;students.forEach((s,i)=>{let isP=attendance[i]!=='absent';html+=`<tr><td>${monthName}</td><td>${s.name} (${s.roll})</td><td style="color:${isP?'green':'red'};font-weight:bold">${isP?'P - উপস্থিত':'A - অনুপস্থিত'}</td></tr>`;});html+=`</table>`;div.innerHTML=html;}
function monthlyReport2(){let div=document.getElementById('monthlyDiv2');if(div.style.display=='block'){div.style.display='none';return;}div.style.display='block';let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'});let html=`<h4>📊 মাসিক রিপোর্ট - ${monthName}</h4><table border="1" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:12px"><tr><th>রোল</th><th>নাম</th><th>মোবাইল</th><th>অবস্থা</th></tr>`;students.forEach((s,i)=>{let isP=attendance[i]!=='absent';html+=`<tr><td>${s.roll}</td><td>${s.name}</td><td>${s.mobile}</td><td style="color:${isP?'green':'red'};font-weight:bold">${isP?'উপস্থিত':'অনুপস্থিত'}</td></tr>`;});html+=`</table><br><button onclick="exportExcel()" style="width:100%;padding:10px;background:#16a34a;color:white;border:none;border-radius:8px">⬇️ ${monthName} Excel ডাউনলোড</button><button onclick="document.getElementById('monthlyDiv2').style.display='none'" style="width:100%;margin-top:6px;padding:8px;background:#555;color:white;border:none;border-radius:8px">বন্ধ করুন</button>`;div.innerHTML=html;div.scrollIntoView({behavior:'smooth'});}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent';localStorage.setItem('att9',JSON.stringify(attendance));render();updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});let tot=students.length;let ab=tot-p;document.getElementById('total').innerText=tot;document.getElementById('present').innerText=p;document.getElementById('absent').innerText=ab;document.getElementById('cAll').innerText=tot;document.getElementById('cPresent').innerText=p;document.getElementById('cAbsent').innerText=ab;}
function sendSMS(type){let notice=document.getElementById('noticeText').value.trim();if(type=='notice'&&!notice)return alert('নোটিশ বোর্ডে আগে নোটিশ লিখুন মামা');let targets=students.filter((s,i)=>{if(!s.mobile)return false;let isP=attendance[i]!=='absent';if(type=='present')return isP;if(type=='absent')return!isP;return true;});if(targets.length==0)return alert(type=='present'?'উপস্থিত তালিকায় নাম্বার নেই':type=='absent'?'অনুপস্থিত তালিকায় নাম্বার নেই':'কোনো নাম্বার নেই');let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'});let date=new Date().toLocaleDateString('bn-BD');let msg=type=='present'?`মমতাজউদ্দিন কলেজ (${monthName}): আপনার সন্তান ${date} উপস্থিত আছে।`:type=='absent'?`মমতাজউদ্দিন কলেজ (${monthName}): আপনার সন্তান ${date} অনুপস্থিত।`:`মমতাজউদ্দিন কলেজ নোটিশ (${monthName}): ${notice} - ${date}`;let numbers=targets.map(t=>t.mobile).join(',');window.location.href=`sms:${numbers}?body=${encodeURIComponent(msg)}`;}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);delete attendance[i];localStorage.setItem('students9',JSON.stringify(students));localStorage.setItem('att9',JSON.stringify(attendance));filterList(currentFilter);}}
function editS(i){let s=students[i];let n=prompt('নাম:',s.name);if(n===null)return;let r=prompt('রোল:',s.roll);let m=prompt('মোবাইল:',s.mobile);students[i]={name:n,roll:r,mobile:m};localStorage.setItem('students9',JSON.stringify(students));render();}
function exportExcel(){let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'});if(students.length==0)return alert('খালি');let data=students.map((s,i)=>({মাস:monthName,নাম:s.name,রোল:s.roll,মোবাইল:s.mobile,অবস্থা:attendance[i]!=='absent'?'উপস্থিত':'অনুপস্থিত'}));let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,monthName);XLSX.writeFile(wb,`Monthly_${monthName}.xlsx`);}
</script>
</body>
</html>
