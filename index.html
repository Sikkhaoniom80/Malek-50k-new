<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek Final 2 Change</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;margin-top:10px}
.card-login,.card-dash{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:16px;margin-top:12px}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center}
.header{background:#0f3d2e;color:#fff;padding:10px 10px 35px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:#fff;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important}
.pad-bn{font-size:11.5px!important;font-weight:700!important;color:#0f2d5a!important}.pad-en{font-size:9px!important;color:#cc0000!important}
select,input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #ccc;margin:6px 0}
button{cursor:pointer}
</style>
</head>
<body>
<div id="loginWrapper" style="width:100%;display:flex;flex-direction:column;align-items:center">
<img class="logo" src="logo.jpg" onerror="this.style.display='none'">
<div class="card-dash">
<div style="text-align:center;font-weight:700">📊 ড্যাশবোর্ড</div>
<button onclick="toggleInst()" style="width:100%;padding:11px;background:#0f3d2e;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:8px">🏫 প্রতিষ্ঠানের তালিকা দেখুন</button>
<div id="instDiv" style="display:none;margin-top:8px;background:#fff;padding:8px;border-radius:8px;font-size:13px"></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;text-align:center">
<div style="background:#e8f5e9;border:2px solid #16a34a;border-radius:10px;padding:10px">🟢<br>লগইন<br><b id="cntLogin">1</b></div>
<div style="background:#fdecea;border:2px solid #ef4444;border-radius:10px;padding:10px">🔴<br>লগআউট<br><b>0</b></div>
<div style="background:#e3f2fd;border:2px solid #0284c7;border-radius:10px;padding:10px">🏫<br>মোট<br><b id="cntTotal">1</b></div>
</div>
</div>
<div class="card-login"><h2 style="text-align:center">🔐 শিক্ষক লগইন</h2>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button onclick="doLogin()" style="width:100%;padding:14px;background:#0f2d5a;color:#fff;border:none;border-radius:12px;font-weight:700">🔐 লগইন</button>
</div></div>

<div id="firstPage" class="page">
<div class="header"><div class="college-pad">
<div onclick="logoInput.click()" style="text-align:center"><img id="boxLogo" src="https://via.placeholder.com/65"><div style="font-size:9px;color:blue">লোগো চেঞ্জ</div><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></div>
<div style="flex:1;overflow:hidden"><div id="boxNameBn" class="pad-bn" contenteditable="true" onblur="saveBox()">মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div><div id="boxNameEn" class="pad-en" contenteditable="true" onblur="saveBox()">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div><div style="font-size:10px;color:#333">EIIN: <b><span id="boxEIIN" contenteditable="true" onblur="saveBox()">132332</span></b> | Code: <b><span id="boxIns" contenteditable="true" onblur="saveBox()">50017</span></b></div></div>
</div><p id="boxStatus" style="color:#ffcc00;font-size:12px;height:12px"></p><p>শ্রেণী: <span id="showClass"></span></p></div>
<div class="card"><button onclick="openStudentPage()" style="width:100%;padding:14px;background:#ffcc00;border:none;border-radius:12px;font-weight:bold">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="location.reload()" style="width:100%;margin-top:10px;padding:10px;background:#555;color:#fff;border:none;border-radius:10px">⬅️ লগআউট</button></div>
</div>

<div id="secondPage" class="page">
<div class="header"><div class="college-pad"><img id="boxLogo3"><div style="flex:1"><div id="boxNameBn3" class="pad-bn"></div><div id="boxNameEn3" class="pad-en"></div></div></div>
<h3>শিক্ষার্থীর তালিকা - <span id="showClass3"></span></h3><button onclick="goFirst()" style="background:#fff;border:none;padding:6px 15px;border-radius:20px">⬅️ ড্যাশবোর্ড</button></div>
<div class="card">
<div style="display:flex;gap:6px;margin:10px 0">
<button onclick="filterList('all')" style="flex:1;padding:10px;background:#ffcc00;border:none;border-radius:8px">📋 সবাই</button>
<button onclick="filterList('result')" style="flex:1;padding:10px;background:#7c3aed;color:#fff;border:none;border-radius:8px">🏆 ফলাফল</button>
</div>
<div id="studentList"></div>
<div id="resultDiv" style="display:none;margin-top:10px;border:2px solid #7c3aed;border-radius:10px;padding:10px"></div>
</div></div>

<script>
let students=JSON.parse(localStorage.getItem('students9')||'[]');
let results=JSON.parse(localStorage.getItem('results9')||'{}');
let showSubjects=false;
let subNames=JSON.parse(localStorage.getItem('subNames9')||'["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"]');

// --- পরিবর্তন ১: মাল্টি প্রতিষ্ঠান ---
function getInstList(){return JSON.parse(localStorage.getItem('institutionList')||'[]');}
function updateDash(){
 let list=getInstList();
 if(!list.length){list=[{nameBn:'মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ',eiin:'132332'}];localStorage.setItem('institutionList',JSON.stringify(list));}
 cntTotal.innerText=list.length;cntLogin.innerText=list.length;
 instDiv.innerHTML=list.map(x=>`🏫 ${x.nameBn} - 🟢 লগইন`).join('<br>');
}
function toggleInst(){updateDash();instDiv.style.display=instDiv.style.display=='block'?'none':'block';}
function saveBox(){
 let info={nameBn:boxNameBn.innerText.trim(),nameEn:boxNameEn.innerText.trim(),eiin:boxEIIN.innerText.trim(),ins:boxIns.innerText.trim(),logo:boxLogo.src};
 localStorage.setItem('collegeInfo',JSON.stringify(info));
 let list=getInstList();let i=list.findIndex(x=>x.eiin==info.eiin);
 if(i>=0)list[i]=info;else list.push(info);
 localStorage.setItem('institutionList',JSON.stringify(list));
 boxStatus.innerText="✅ সেভ";setTimeout(()=>boxStatus.innerText="",1000);
 boxNameBn3.innerText=info.nameBn;boxLogo3.src=info.logo;updateDash();
}
function changeBoxLogo(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox();};r.readAsDataURL(f);}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(info.nameBn){boxNameBn.innerText=info.nameBn;boxNameBn3.innerText=info.nameBn;}if(info.logo){boxLogo.src=info.logo;boxLogo3.src=info.logo;}if(info.eiin)boxEIIN.innerText=info.eiin;}
function doLogin(){if(loginPass.value!='1234')return alert('1234 দিন');showClass.innerText=loginClass.value;showClass3.innerText=loginClass.value;loginWrapper.style.display='none';firstPage.classList.add('active');loadBox();}
function openStudentPage(){firstPage.classList.remove('active');secondPage.classList.add('active');}
function goFirst(){secondPage.classList.remove('active');firstPage.classList.add('active');}
function filterList(t){studentList.style.display=t=='result'?'none':'block';resultDiv.style.display=t=='result'?'block':'none';if(t=='result')renderResult();else renderStudents();}
function renderStudents(){studentList.innerHTML=students.map((s,i)=>`<div style="padding:8px;border-bottom:1px solid #eee"><b>${s.name}</b> (${s.roll})</div>`).join('')||'খালি';}

// --- পরিবর্তন ২: ফলাফল বিষয় হাইড, আপনি লিখবেন ---
function renderResult(){
 let h=`<button onclick="showSubjects=!showSubjects;renderResult()" style="width:100%;padding:10px;background:#0f3d2e;color:#fff;border:none;border-radius:10px;margin-bottom:8px;font-weight:bold">${showSubjects?'🙈 লুকান':'✏️ বিষয়ের নাম লিখুন'}</button>
 <div style="${showSubjects?'':'display:none'};background:#fffbe6;padding:10px;border-radius:10px;border:1px dashed #eab308;margin-bottom:10px"><b>বিষয়ের নাম লিখুন:</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">`;
 for(let i=0;i<13;i++){h+=`<input placeholder="বিষয় ${i+1}" value="${subNames[i].includes('বিষয়')?'':subNames[i]}" onchange="subNames[${i}]=this.value||'বিষয় ${i+1}';localStorage.setItem('subNames9',JSON.stringify(subNames))" style="padding:8px;border:1px solid #ccc;border-radius:8px">`;}
 h+=`</div></div><table border="1" cellpadding="6" style="width:100%;border-collapse:collapse;font-size:12px;text-align:center"><tr style="background:#0f3d2e;color:#fff"><th>নাম</th><th>মোট</th><th>মার্ক</th></tr>`;
 students.forEach((s,idx)=>{let r=results[idx]||{};let tot=0;for(let i=0;i<13;i++)tot+=parseInt(r['s'+i]||0);h+=`<tr><td>${s.name}</td><td>${tot}</td><td><button onclick="editMarks(${idx})" style="background:#7c3aed;color:#fff;border:none;padding:6px 10px;border-radius:6px">📝</button></td></tr>`;});
 h+=`</table>`;resultDiv.innerHTML=h;
}
function editMarks(idx){let v=prompt('কমা দিয়ে ১৩টা মার্ক দিন');if(!v)return;let a=v.split(',');if(!results[idx])results[idx]={};for(let i=0;i<13;i++)results[idx]['s'+i]=a[i]||0;localStorage.setItem('results9',JSON.stringify(results));renderResult();}
window.onload=()=>{loadBox();updateDash();}
</script>
</body>
</html>
