<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALEK 50K ATTENDANCE</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Hind Siliguri',sans-serif;box-sizing:border-box}
body{margin:0;background:#f1f5f9}
.top{padding:15px;text-align:center;background:#fff;border-bottom:3px solid #ffcc00}
.top h1{margin:0;font-size:28px}.top h1 span{color:#ffcc00}
.card{background:#fff;margin:12px;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001}
.row{display:flex;gap:8px;flex-wrap:wrap}
.b{padding:10px 14px;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer}
.b-blue{background:#2563eb}.b-green{background:#16a34a}.b-red{background:#dc2626}.b-yellow{background:#eab308;color:#000}.b-black{background:#111827}.b-purple{background:#7c3aed}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px}
.count div{background:#fff;padding:12px;border-radius:10px;text-align:center;box-shadow:0 2px 5px #0001}
.count b{font-size:22px;display:block}
table{width:100%;border-collapse:collapse} th,td{border:1px solid #e5e7eb;padding:8px;text-align:center} th{background:#111827;color:#fff}
.st-P{background:#dcfce7;color:#166534;font-weight:700}.st-A{background:#fee2e2;color:#991b1b;font-weight:700}.st-L{background:#fef9c3;color:#854d0e;font-weight:700}
input,select{padding:10px;border:1px solid #d1d5db;border-radius:8px;width:100%}
#loginPage{height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9}
.loginBox{background:#fff;padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center}
</style>
</head>
<body>

<div id="loginPage">
<div class="loginBox">
<h2>🏛️ মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</h2>
<p>১০ম শ্রেণি - হাজিরা প্যানেল</p>
<select id="loginClass"><option>৬ষ্ঠ</option><option>৭ম</option><option>৮ম</option><option>৯ম</option><option selected>১০ম</option></select><br><br>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড দিন (1234)"><br><br>
<button class="b b-blue" style="width:100%" onclick="doLogin()">প্রবেশ করুন</button>
<p style="font-size:12px;color:gray">Engineered by Mohammad Abdul Malek</p>
</div>
</div>

<div id="mainPage" style="display:none">
<div class="top">
<h1>MALEK <span>50K ATTENDANCE</span></h1>
<div style="font-weight:700">🏛️ মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ | <span id="showClass"></span> | 📅 <input type="date" id="attDate" style="width:160px;display:inline-block" onchange="render()"></div>
</div>

<div class="count">
<div><small>মোট ছাত্র</small><b id="cTotal">0</b></div>
<div><small>✅ উপস্থিত</small><b id="cP" style="color:#16a34a">0</b></div>
<div><small>❌ অনুপস্থিত</small><b id="cA" style="color:#dc2626">0</b></div>
<div><small>⚠️ পলাতক</small><b id="cL" style="color:#eab308">0</b></div>
</div>

<div class="card row">
<button class="b b-blue" onclick="addOne()">+ একজন</button>
<button class="b b-black" onclick="addBulk()">বাল্ক যোগ</button>
<input id="searchBox" placeholder="🔍 নাম/রোল দিয়ে খুঁজুন" style="max-width:200px" oninput="render()">
<button class="b b-green" onclick="sendSMS('P')">P SMS</button>
<button class="b b-red" onclick="sendSMS('A')">A SMS</button>
<button class="b b-yellow" onclick="sendSMS('L')">L SMS</button>
<button class="b b-black" onclick="exportExcel()">Excel</button>
<button class="b b-purple" onclick="monthlyReport()">📅 মাসিক রিপোর্ট</button>
<button class="b b-black" onclick="window.print()">🖨️ প্রিন্ট</button>
</div>

<div class="card">
<table>
<thead><tr><th>রোল</th><th>নাম</th><th>মোবাইল</th><th>হাজিরা</th><th>অ্যাকশন</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('malek_students')||'[]');
let attendance=JSON.parse(localStorage.getItem('malek_attendance')||'{}');

document.getElementById('attDate').valueAsDate=new Date();

function doLogin(){
if(document.getElementById('loginPass').value!='1234'){alert('পাসওয়ার্ড ভুল! 1234 দিন');return}
document.getElementById('loginPage').style.display='none';
document.getElementById('mainPage').style.display='block';
document.getElementById('showClass').innerText=document.getElementById('loginClass').value+' শ্রেণি';
render();
}
function save(){localStorage.setItem('malek_students',JSON.stringify(students));localStorage.setItem('malek_attendance',JSON.stringify(attendance));render();}
function getDate(){return document.getElementById('attDate').value}
function addOne(){
let roll=prompt('রোল:'), name=prompt('নাম:'), mobile=prompt('মোবাইল:');
if(!roll||!name)return;
students.push({roll,name,mobile,class:document.getElementById('loginClass').value});
save();
}
function addBulk(){
let txt=prompt('এভাবে লিখুন:\n1,রহিম,017...\n2,করিম,018...');
if(!txt)return;
txt.split('\n').forEach(l=>{
let [roll,name,mobile]=l.split(',');
if(roll&&name)students.push({roll:roll.trim(),name:name.trim(),mobile:(mobile||'').trim(),class:document.getElementById('loginClass').value});
});save();
}
function mark(roll,status){
let d=getDate();
if(!attendance[d])attendance[d]={};
attendance[d][roll]=status;
save();
}
function render(){
let cls=document.getElementById('loginClass').value;
let d=getDate();
let q=document.getElementById('searchBox').value.toLowerCase();
let filtered=students.filter(s=>s.class==cls && (s.name.toLowerCase().includes(q)||s.roll.includes(q)));
let tbody=document.getElementById('tbody');tbody.innerHTML='';
let cT=filtered.length,cP=0,cA=0,cL=0;
filtered.forEach(s=>{
let st=(attendance[d]&&attendance[d][s.roll])||'-';
if(st=='P')cP++;else if(st=='A')cA++;else if(st=='L')cL++;
let clsSt=st=='P'?'st-P':st=='A'?'st-A':st=='L'?'st-L':'';
tbody.innerHTML+=`<tr><td>${s.roll}</td><td>${s.name}</td><td>${s.mobile}</td><td class="${clsSt}"><button class="b b-green" style="padding:4px 8px" onclick="mark('${s.roll}','P')">P</button> <button class="b b-red" style="padding:4px 8px" onclick="mark('${s.roll}','A')">A</button> <button class="b b-yellow" style="padding:4px 8px" onclick="mark('${s.roll}','L')">L</button> <b> ${st}</b></td><td><button onclick="del('${s.roll}')">❌</button></td></tr>`;
});
document.getElementById('cTotal').innerText=cT;
document.getElementById('cP').innerText=cP;
document.getElementById('cA').innerText=cA;
document.getElementById('cL').innerText=cL;
}
function del(roll){if(confirm('ডিলিট করবেন?')){students=students.filter(s=>s.roll!=roll);save();}}
function sendSMS(type){
let d=getDate();let list=students.filter(s=>attendance[d]&&attendance[d][s.roll]==type);
if(!list.length){alert('কেউ নেই');return}
alert(type+' SMS লিস্ট:\n'+list.map(s=>s.name+' - '+s.mobile).join('\n'));
}
function exportExcel(){
let d=getDate();let rows=[['রোল','নাম','মোবাইল','হাজিরা','তারিখ']];
students.forEach(s=>{rows.push([s.roll,s.name,s.mobile,(attendance[d]&&attendance[d][s.roll])||'-',d])});
let csv=rows.map(r=>r.join(',')).join('\n');
let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download=`attendance_${d}.csv`;a.click();
}
function monthlyReport(){
let month=prompt('মাস লিখুন (YYYY-MM) যেমন 2026-09','2026-09');
if(!month)return;
let cls=document.getElementById('loginClass').value;
let filtered=students.filter(s=>s.class==cls);
let rep=`🏛️ মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ\n📅 মাসিক রিপোর্ট: ${month}\nশ্রেণি: ${cls}\n\n`;
filtered.forEach(s=>{
let p=0,a=0,l=0;
Object.keys(attendance).forEach(dt=>{if(dt.startsWith(month)){let st=attendance[dt][s.roll];if(st=='P')p++;else if(st=='A')a++;else if(st=='L')l++;}});
rep+=`রোল ${s.roll} - ${s.name} - P:${p} A:${a} L:${l}\n`;
});
let w=window.open('','','width=500,height=600');w.document.write(`<pre style="font-family:Hind Siliguri;padding:15px;white-space:pre-wrap">${rep}\n\nEngineered by Mohammad Abdul Malek</pre><button onclick="window.print()">প্রিন্ট</button>`);
}
</script>
</body>
</html>
