<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MALEK 50K</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
body{background:#0a2342;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
.logo{width:350px;max-width:92%;border-radius:22px;border:3px solid #ffd700;margin-top:10px}
.card{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:24px 18px;margin-top:14px}
select,input,textarea{width:100%;padding:13px;border-radius:12px;border:1.5px solid #ccc;margin:6px 0;font-size:15px;background:#fff}
.btn{width:100%;padding:13px;border-radius:12px;border:none;color:#fff;font-weight:700;margin:6px 0;cursor:pointer}
#page2,#page3{display:none;background:#eef2ff;width:100%;min-height:100vh;position:fixed;top:0;left:0;z-index:999;overflow-y:auto;padding:10px;padding-bottom:90px}
.top{background:#0a2342;color:#ffd700;padding:12px;border-radius:14px;text-align:center;font-weight:700;border:2px solid #ffd700;margin-bottom:10px}
.item{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px;border-radius:12px;margin:6px 0;border:1px solid #ddd}
</style>
</head>
<body>

<!-- ========== ১ম পাতা ========== -->
<img class="logo" src="logo.jpg" id="logoImg" onerror="this.style.display='none'">
<div id="page1" class="card">
<h2 style="text-align:center">🔐 শিক্ষক লগইন</h2>
<p style="text-align:center;color:#666;font-size:13px;margin:6px 0">MALEK ATTENDANCE</p>
<select id="loginClass">
<option value="">শ্রেণি সিলেক্ট করুন</option>
<option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option>
</select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button class="btn" style="background:#0f2d5a" onclick="doLogin()">🔐 লগইন করুন</button>
</div>

<!-- ========== ২য় পাতা ========== -->
<div id="page2">
<div class="top">🏫 মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ<br><small id="c2" style="color:#fff"></small> - ২য় পাতা নোটিশ</div>
<div style="background:#fff;padding:14px;border-radius:14px">
<b>📢 নোটিশ বোর্ড</b>
<textarea id="noticeText" rows="5" placeholder="নোটিশ লিখুন..."></textarea>
<div style="display:flex;gap:6px;margin-top:8px">
<button style="flex:1;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-weight:700" onclick="sendSMS('present')">Present SMS</button>
<button style="flex:1;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:10px;font-weight:700" onclick="sendSMS('absent')">Absent SMS</button>
<button style="flex:1;padding:12px;background:#eab308;border:none;border-radius:10px;font-weight:700" onclick="sendSMS('notice')">Notice SMS</button>
</div>
</div>
<button class="btn" style="background:#0a2342;margin-top:10px" onclick="go3()">📋 ৩য় পাতা - হাজিরা তালিকা ➡️</button>
<button class="btn" style="background:#555" onclick="location.reload()">🔙 লগআউট</button>
</div>

<!-- ========== ৩য় পাতা ========== -->
<div id="page3">
<div class="top">🏫 শিক্ষার্থী তালিকা - <span id="c3"></span> - ৩য় পাতা</div>
<div style="display:flex;gap:6px">
<input id="attDate" type="date" style="flex:1">
<input id="searchBox" placeholder="খুঁজুন নাম/রোল" style="flex:1" onkeyup="render()">
</div>
<div style="display:flex;gap:6px">
<input id="sname" placeholder="নাম" style="flex:2">
<input id="sroll" placeholder="রোল" style="flex:1">
<input id="smobile" placeholder="মোবাইল" style="flex:1.5">
</div>
<button class="btn" style="background:#0a2342;padding:10px" onclick="addOne()">+ শিক্ষার্থী যোগ করুন</button>
<div id="list"></div>
<button class="btn" style="background:#eab308;color:#000;margin-top:10px" onclick="go2()">⬅️ ২য় পাতায় ফিরুন</button>
<button class="btn" style="background:#555" onclick="location.reload()">🔙 লগআউট</button>
</div>

<script>
let students=JSON.parse(localStorage.getItem('malek_students')||'[]');
let attendance=JSON.parse(localStorage.getItem('malek_att')||'{}');
function doLogin(){
 let c=document.getElementById('loginClass').value;
 let p=document.getElementById('loginPass').value;
 if(!c){alert('শ্রেণি সিলেক্ট করুন');return}
 if(p!='1234'){alert('পাসওয়ার্ড 1234');return}
 document.getElementById('c2').innerText=c;
 document.getElementById('c3').innerText=c;
 document.getElementById('page1').style.display='none';
 let logo=document.getElementById('logoImg'); if(logo) logo.style.display='none';
 document.getElementById('page2').style.display='block';
 document.getElementById('page3').style.display='none';
 document.getElementById('attDate').value=new Date().toISOString().split('T')[0];
}
function go3(){document.getElementById('page2').style.display='none';document.getElementById('page3').style.display='block';render();}
function go2(){document.getElementById('page3').style.display='none';document.getElementById('page2').style.display='block';}
function addOne(){let cls=document.getElementById('loginClass').value;let n=document.getElementById('sname').value.trim();let r=document.getElementById('sroll').value.trim();let m=document.getElementById('smobile').value.trim();if(!n||!r){alert('নাম ও রোল দিন');return}students.push({class:cls,name:n,roll:r,mobile:m});localStorage.setItem('malek_students',JSON.stringify(students));document.getElementById('sname').value='';document.getElementById('sroll').value='';document.getElementById('smobile').value='';render();}
function getSt(i,d){return (attendance[d]&&attendance[d][i])||''}
function render(){let cls=document.getElementById('loginClass').value;let q=document.getElementById('searchBox').value.toLowerCase();let date=document.getElementById('attDate').value;let all=students.map((s,i)=>({...s,idx:i})).filter(s=>s.class==cls);let div=document.getElementById('list');div.innerHTML='';if(all.length==0){div.innerHTML='<p style="text-align:center;color:#888;padding:20px">কোনো ছাত্র নেই</p>';return}all.filter(s=>q==''||s.name.toLowerCase().includes(q)||s.roll.includes(q)).forEach(s=>{let st=getSt(s.idx,date);div.innerHTML+=`<div class="item"><div><b>${s.name}</b><br><small>রোল:${s.roll} | ${s.mobile||''}</small><br><small style="color:red;cursor:pointer" onclick="delS(${s.idx})">🗑️ ডিলিট</small></div><div style="display:flex;gap:4px"><button style="background:${st=='P'?'#16a34a':'#ddd'};color:#fff;border:none;padding:8px 12px;border-radius:8px" onclick="mark(${s.idx},'P')">P</button><button style="background:${st=='A'?'#ef4444':'#ddd'};color:#fff;border:none;padding:8px 12px;border-radius:8px" onclick="mark(${s.idx},'A')">A</button><button style="background:${st=='L'?'#f59e0b':'#ddd'};color:#fff;border:none;padding:8px 12px;border-radius:8px" onclick="mark(${s.idx},'L')">L</button></div></div>`});}
function mark(i,s){let d=document.getElementById('attDate').value;if(!attendance[d])attendance[d]={};attendance[d][i]=s;localStorage.setItem('malek_att',JSON.stringify(attendance));render();}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);localStorage.setItem('malek_students',JSON.stringify(students));render();}}
function sendSMS(t){let notice=document.getElementById('noticeText').value;let cls=document.getElementById('loginClass').value;let date=document.getElementById('attDate').value||new Date().toISOString().split('T')[0];let all=students.map((s,i)=>({...s,idx:i})).filter(s=>s.class==cls);let targets=t=='notice'?all:t=='present'?all.filter(s=>getSt(s.idx,date)=='P'):all.filter(s=>getSt(s.idx,date)=='A');if(targets.length==0)return alert('৩য় পাতায় গিয়ে হাজিরা নিন আগে');let nums=targets.map(s=>s.mobile).filter(m=>m&&m.length>=11);if(nums.length==0)return alert('মোবাইল নম্বর নেই');let ds=new Date(date).toLocaleDateString('bn-BD');let msg=t=='present'?`আজ ${ds} তারিখে উপস্থিত আছে।\n${notice}\n- মমতাজ উদ্দিন কলেজ`:t=='absent'?`আজ ${ds} তারিখে অনুপস্থিত।\n${notice}\n- মমতাজ উদ্দিন কলেজ`:`📢 নোটিশ: ${notice}\n- মমতাজ উদ্দিন কলেজ`;window.location.href=`sms:${nums.join(';')}?body=${encodeURIComponent(msg)}`;}
document.getElementById('attDate')?.addEventListener('change',render);
</script>
</body>
</html>
