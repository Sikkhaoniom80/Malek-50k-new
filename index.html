<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মালেক ৫০কে - হাজিরা</title>
<style>
*{box-sizing:border-box;font-family:sans-serif}body{background:#f0f8ff;padding:10px}
.container{max-width:900px;margin:auto;background:#fff;border-radius:16px;padding:14px}
h1{text-align:center;color:#0b5e2f}
.stat{display:flex;gap:8px;margin:10px 0}.stat div{flex:1;text-align:center;padding:10px;border-radius:10px;color:#fff;font-weight:bold}
.s1{background:#0b5e2f}.s2{background:#1a8cff}.s3{background:#ff3b30}
input{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
.btn{width:100%;padding:13px;background:#0b5e2f;color:#fff;border:none;border-radius:10px;font-weight:bold}
.row{display:flex;gap:6px;margin:8px 0}.row button{flex:1;padding:10px;border:none;border-radius:8px;color:#fff;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#0b5e2f;color:#fff;padding:6px}td{padding:6px;border-bottom:1px solid #eee;text-align:center}
.p-btn{padding:5px 9px;border-radius:15px;border:1px solid #ccc}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<div class="container">
<h1>📚 মালেক ৫০কে হাজিরা</h1>
<div class="no-print">
তারিখ: <input type="date" id="date">
<input id="name" placeholder="নাম বাংলায়"><input id="roll" placeholder="রোল" type="number"><input id="mobile" placeholder="মোবাইল" type="tel">
<button class="btn" onclick="addStudent()">+ যোগ করুন</button>
<input id="search" placeholder="🔍 খুঁজুন" oninput="render()">
</div>
<div class="stat"><div class="s1">মোট: <span id="total">0</span></div><div class="s2">উপস্থিত: <span id="presentCount">0</span></div><div class="s3">অনুপ: <span id="absentCount">0</span></div></div>
<div class="row no-print"><button style="background:#1a7d32" onclick="exportExcel()">📊 Excel</button><button style="background:#333" onclick="window.print()">🖨️ প্রিন্ট</button></div>
<div class="row no-print"><button style="background:#ff9500" onclick="sendBulkSMS()">📩 অনুপস্থিতদের SMS (ফ্রি)</button><button style="background:#25D366" onclick="sendBulkWA()">WhatsApp</button></div>
<table><thead><tr><th>রোল</th><th>নাম</th><th>মোবাইল</th><th class="no-print">হাজিরা</th><th class="no-print">X</th></tr></thead><tbody id="list"></tbody></table>
</div>
<script>
let students=JSON.parse(localStorage.getItem('malek50k_v2')||'[]');
let attendance=JSON.parse(localStorage.getItem('malek_att')||'{}');
document.getElementById('date').valueAsDate=new Date();
function save(){localStorage.setItem('malek50k_v2',JSON.stringify(students));localStorage.setItem('malek_att',JSON.stringify(attendance));}
function addStudent(){let n=name.value.trim(),r=roll.value.trim(),m=mobile.value.trim();if(!n||!r||!m){alert('সব লিখুন');return}students.push({name:n,roll:r,mobile:m});save();name.value='';roll.value='';mobile.value='';render();}
function getStatus(roll){let d=date.value;return(attendance[d]&&attendance[d][roll])||'';}
function setStatus(roll,s){let d=date.value;if(!attendance[d])attendance[d]={};attendance[d][roll]=s;save();render();}
function render(){let q=search.value.toLowerCase();let list=document.getElementById('list');list.innerHTML='';let p=0,a=0;students.filter(s=>s.name.toLowerCase().includes(q)||s.roll.includes(q)).forEach(s=>{let st=getStatus(s.roll);if(st=='P')p++;if(st=='A')a++;list.innerHTML+=`<tr><td>${s.roll}</td><td>${s.name}</td><td>${s.mobile}</td><td class="no-print"><button class="p-btn" style="background:${st=='P'?'#10b981':'#fff'}" onclick="setStatus('${s.roll}','P')">উপস্থিত</button> <button class="p-btn" style="background:${st=='A'?'#ef4444':'#fff'};color:${st=='A'?'white':'black'}" onclick="setStatus('${s.roll}','A')">অনুপ</button> <button onclick="location.href='sms:${s.mobile}?body='+encodeURIComponent('প্রিয় ${s.name}, আজ ${date.value} অনুপস্থিত। - মালেক স্যার')">SMS</button></td><td class="no-print"><button onclick="students=students.filter(x=>x.roll!='${s.roll}');save();render()">X</button></td></tr>`});total.innerText=students.length;presentCount.innerText=p;absentCount.innerText=a;}
function exportExcel(){let d=date.value;let csv="Roll,Name,Mobile,Date,Status\n";students.forEach(s=>{csv+=`${s.roll},"${s.name}",${s.mobile},${d},${getStatus(s.roll)||''}\n`});let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Hazira_${d}.csv`;a.click();}
function sendBulkSMS(){let d=date.value;let absent=students.filter(s=>getStatus(s.roll)=='A');if(!absent.length){alert('অনুপস্থিত নাই');return}let nums=absent.map(s=>s.mobile).join(',');let msg=`আজ ${d} অনুপস্থিত: ${absent.map(s=>s.name).join(', ')} - মালেক স্যার`;location.href=`sms:${nums}?body=${encodeURIComponent(msg)}`;}
function sendBulkWA(){let d=date.value;let absent=students.filter(s=>getStatus(s.roll)=='A');if(!absent.length){alert('অনুপস্থিত নাই');return}let msg=`*হাজিরা ${d}*%0Aঅনুপস্থিত ${absent.length} জন:%0A${absent.map(s=>`${s.name} (${s.roll})`).join('%0A')}`;window.open(`https://wa.me/?text=${msg}`);}
render();
</script>
</body>
</html>
