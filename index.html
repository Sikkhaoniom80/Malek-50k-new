<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malek - 50K Family ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#0a0a0a;color:white;text-align:center;overflow-x:hidden}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at center,#1f1f1f,#000);padding:20px}
h1{font-size:3.5rem;margin:0;background:linear-gradient(90deg,#ffcc00,#ff006a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.count{font-size:6rem;font-weight:800;margin:20px 0}
.btn{padding:15px 35px;background:#ff006a;border:none;border-radius:30px;color:white;font-size:1.2rem;font-weight:600;cursor:pointer;box-shadow:0 0 20px #ff006a}
.card{margin:20px;background:#141414;padding:20px;border-radius:15px}
</style>
</head>
<body>
<div class="hero">
<h1>Thank You For 50K!</h1>
<div class="count">50,000 ❤️</div>
<p>Malek Family - This is just the beginning!</p>
<button class="btn" onclick="celebrate()">Celebrate 🎉</button>
<div class="card">
<h2>Malek 50K Special</h2>
<p>আপনাদের ভালোবাসায় আজ আমরা 50K পরিবার! সবাইকে অনেক অনেক ভালোবাসা!</p>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
function celebrate(){
 confetti({particleCount:200,spread:90,origin:{y:0.6}});
}
setTimeout(()=>celebrate(),800);
</script>
</body>
</html>
