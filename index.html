<div id="p1" class="page active">
  <img class="logo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" style="width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;box-shadow:0 0 25px rgba(255,215,0,.5);margin-top:10px">
  <div class="card" style="background:#fff;width:100%;max-width:420px;border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 12px 35px rgba(0,0,0,.35);text-align:center">
    <h2 style="text-align:center;color:#0a2342">🔐 শিক্ষক লগইন</h2>
    <p style="text-align:center;color:gray;font-size:13px;margin:8px 0">
      Engineered by Mohammad Abdul Malek<br>
      <span style="color:#0a2342;font-weight:bold">01912427294</span><br>
      sikkhaoniom80.github.io
    </p>
    <!-- ১নং এ শ্রেণী নাই, শুধু পাসওয়ার্ড -->
    <input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234" style="width:100%;padding:12px;margin:10px 0;border:1.5px solid #ccc;border-radius:10px">
    <button onclick="goToP2()" style="width:100%;padding:14px;border:none;border-radius:12px;background:#0f2d5a;color:white;font-weight:bold;font-size:16px;cursor:pointer">
      লগইন করুন ➡️ ২নং পেজ
    </button>
  </div>
</div>

<script>
function goToP2(){
  let pass = document.getElementById('loginPass').value.trim();
  if(pass != '1234' && pass != '১২৩৪'){
    alert('পাসওয়ার্ড 1234 দিন');
    return;
  }
  // ১নং থেকে ২নং এ যাবে
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p2').classList.add('active');
}
</script>
