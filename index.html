<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MALEK 50K</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri'} .page{display:none} .page.active{display:block}</style>
</head>
<body class="bg-green-50 min-h-screen">

<div id="page1" class="page active">
<div class="min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md border-t-8 border-green-600">
<h1 class="text-3xl font-bold text-center text-green-700">মালেক ৫০কে হাজিরা</h1>
<p class="text-center text-gray-400 mb-6">লাইভ রোল ইন্সপেক্টর</p>
<select id="classSelect" class="w-full border-2 p-3 rounded-xl mt-2 mb-4">
<option value="">-- শ্রেণি --</option><option>৬ষ্ঠ</option><option>৭ম</option><option>৮ম</option><option>৯ম</option><option>১০ম</option>
</select>
<input id="pass" type="password" placeholder="পাসওয়ার্ড 1234" class="w-full border-2 p-3 rounded-xl mb-4">
<button onclick="doLogin()" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">লগইন</button>
<p id="err" class="hidden text-red-500 text-center mt-3">পাসওয়ার্ড 1234 দিন</p>
</div></div></div>

<div id="page2" class="page">
<div class="max-w-3xl mx-auto p-4 pt-8">
<div class="bg-white rounded-2xl shadow-xl p-6">
<h2 class="text-2xl font-bold text-green-700 mb-4">📢 নোটিশ বোর্ড - <span id="showClass"></span></h2>
<div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4 rounded">আজ সকল ছাত্রের হাজিরা নিতে হবে। অনুপস্থিতদের কল দিতে হবে।</div>
<div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6 rounded">৫০কে টার্গেট মিশন চলছে - মালেক স্যার</div>
<button onclick="goTo(3)" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">৩য় পাতায় যান →</button>
<button onclick="goTo(1)" class="w-full mt-3 bg-gray-100 py-2 rounded-xl">লগআউট</button>
</div></div></div>

<div id="page3" class="page">
<div class="max-w-4xl mx-auto p-4">
<div class="bg-white rounded-2xl shadow-xl p-4">
<div class="flex justify-between mb-4"><h2 class="font-bold text-green-700">হাজিরা - <span id="showClass2"></span></h2><button onclick="goTo(2)" class="bg-gray-100 px-3 rounded-full text-sm">← নোটিশ</button></div>
<div class="flex gap-2 mb-3"><input id="searchRoll" oninput="renderRoll()" placeholder="রোল খুঁজুন" class="border-2 p-2 rounded-xl flex-1"><button onclick="presentAll()" class="bg-green-600 text-white px-4 rounded-xl text-sm">সব উপস্থিত</button></div>
<table class="w-full text-sm"><thead><tr class="bg-green-600 text-white"><th class="p-3 text-left">রোল</th><th class="p-3 text-left">নাম</th><th class="p-3 text-center">হাজিরা</th></tr></thead><tbody id="rollBody"></tbody></table>
<div class="grid grid-cols-3 gap-2 mt-4 text-center"><div class="bg-green-50 p-3 rounded-xl"><div id="cPresent" class="font-bold text-xl text-green-600">0</div><div class="text-xs">উপস্থিত</div></div><div class="bg-red-50 p-3 rounded-xl"><div id="cAbsent" class="font-bold text-xl text-red-600">0</div><div class="text-xs">অনুপস্থিত</div></div><div class="bg-blue-50 p-3 rounded-xl"><div id="cTotal" class="font-bold text-xl">0</div><div class="text-xs">মোট</div></div></div>
<button onclick="alert('রিপোর্ট জমা হয়েছে!')" class="w-full mt-4 bg-green-600 text-white font-bold py-3 rounded-xl">রিপোর্ট জমা দিন</button>
</div></div></div>

<script>
let students=[];for(let i=1;i<=50;i++)students.push({roll:i,name:'শিক্ষার্থী '+i,present:true});
function doLogin(){const c=document.getElementById('classSelect').value,p=document.getElementById('pass').value;if(!c)return alert('শ্রেণি নির্বাচন করুন');if(p!=='1234'){document.getElementById('err').classList.remove('hidden');return;}document.getElementById('showClass').innerText=c;document.getElementById('showClass2').innerText=c;goTo(2);}
function goTo(n){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page'+n).classList.add('active');if(n===3)renderRoll();}
function renderRoll(){const tb=document.getElementById('rollBody');tb.innerHTML='';const f=document.getElementById('searchRoll').value;students.forEach(s=>{if(f&&!String(s.roll).includes(f))return;tb.innerHTML+=`<tr class="border-b"><td class="p-3 font-bold">${s.roll}</td><td class="p-3">${s.name}</td><td class="p-3 text-center"><input type="checkbox" ${s.present?'checked':''} onchange="toggle(${s.roll})" class="w-6 h-6 accent-green-600"></td></tr>`});const p=students.filter(s=>s.present).length;document.getElementById('cPresent').innerText=p;document.getElementById('cAbsent').innerText=students.length-p;document.getElementById('cTotal').innerText=students.length;}
function toggle(r){const s=students.find(x=>x.roll===r);s.present=!s.present;renderRoll();}
function presentAll(){students.forEach(s=>s.present=true);renderRoll();}
</script>
</body>
</html>
