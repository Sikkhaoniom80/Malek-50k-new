<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malek 50K - Final</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;margin-top:10px}
.card-dash{background:#fffbe6;width:100%;max-width:380px;border-radius:16px;padding:12px;margin-top:12px;border:1px solid #e6d8a0}
.btn-dash{background:#0f3d2e;color:#fff;width:100%;padding:11px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.boxes div{border-radius:10px;padding:12px 4px;text-align:center;font-weight:700;border:2px solid}
.card-login{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:16px}
#loginWrapper{width:100%;display:flex;flex-direction:column;align-items:center}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.filter-tabs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.pad-bn{font-size:11.5px!important;font-weight:700!important;color:#0f2d5a!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.pad-en{font-size:9px!important;font-weight:700!important;color:#cc0000!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#monthlyDivFirst{display:none}
#studentList{display:none!important} #studentList.show{display:block!important}
#resultDiv{display:none}
</style>
</head>
<body>
<div id="loginWrapper">
<img class="logo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" onerror="this.style.display='none'">
<div class="card-dash"><div style="text-align:center;font-weight:700;margin-bottom:8px">📊 ড্যাশবোর্ড</div>
<button class="btn-dash" onclick="toggleInst()">🏫 প্রতিষ্ঠানের তালিকা দেখুন</button>
<div id="instDiv" style="display:none;margin-top:8px;background:#fff;padding:8px;border-radius:8px;font-size:12px;line-height:1.8"></div>
<div class="boxes"><div style="background:#e8f5e9;border-color:#16a34a">🟢<br><small>লগইন</small><br><b id="cntLogin">1</b></div><div style="background:#fdecea;border-color:#ef4444">🔴<br><small>লগআউট</small><br><b>0</b></div><div style="background:#e3f2fd;border-color:#0284c7">🏫<br><small>মোট</small><br><b id="cntTotal">1</b></div></div></div>
<div class="card-login"><h2 style="text-align:center">🔐 শিক্ষক লগইন</h2>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>একাদশ শ্রেণি</option><option>দ্বাদশ শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button style="width:100%;padding:14px;border:none;border-radius:14px;background:#0f2d5a;color:white;font-weight:700" onclick="doLogin()">🔐 লগইন করুন</button></div>
</div>
<div id="firstPage" class="page"><div class="header" style="padding:10px 10px 35px">
<div class="college-pad"><div onclick="logoInput.click()" style="cursor:pointer;text-align:center;min-width:60px"><img id="boxLogo" src="https://via.placeholder.com/65"><div style="font-size:9px;color:blue">লোগো চেঞ্জ</div><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></div><div style="flex:1;overflow:hidden"><div id="boxNameBn" class="pad-bn" contenteditable="true" onblur="saveBox()">মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div><div id="boxNameEn" class="pad-en" contenteditable="true" onblur="saveBox()">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div><div style="display:flex;gap:10px;margin-top:2px;font-size:10px;color:#333"><span>EIIN: <b><span id="boxEIIN" contenteditable="true" onblur="saveBox()">132332</span></b></span><span>Code: <b><span id="boxIns" contenteditable="true" onblur="saveBox()">50017</span></b></span></div></div></div>
<p id="boxStatus" style="color:#ffcc00;font-size:12px;height:12px;margin:5px 0 0"></p><p style="margin:8px 0 0;font-weight:700">শ্রেণী: <span id="showClass"></span></p></div>
<div class="card"><button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="toggleMonthlyFirst()" style="width:100%;margin-top:12px;padding:14px;background:#fff;border:2px dashed #2563eb;border-radius:12px;font-weight:bold;color:#2563eb">📅 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDivFirst" style="overflow:auto;margin-top:10px;border:2px dashed #2563eb;border-radius:12px;padding:10px;background:#f8fafc"></div>
<h3>📢 নোটিশ বোর্ড</h3><input type="text" id="noticeText" placeholder="নোটিশ লিখুন...">
<h3>💬 SMS পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendSMS('present')">Present SMS</button><button class="orange" onclick="sendSMS('absent')">Absent SMS</button><button class="yellow" onclick="sendSMS('notice')">Notice SMS</button></div>
<button onclick="location.reload()" style="width:100%;margin-top:12px;padding:10px;background:#555;color:white;border:none;border-radius:10px">⬅️ লগআউট</button></div></div>
<div id="secondPage" class="page"><div class="header" style="padding-bottom:20px"><div class="college-pad"><img id="boxLogo3"><div style="flex:1;overflow:hidden"><div id="boxNameBn3" class="pad-bn"></div><div id="boxNameEn3" class="pad-en"></div><div style="font-size:10px;color:#333"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div></div></div><h2 style="margin:10px 0 0">শিক্ষার্থীর তালিকা</h2><div style="color:#ffcc00;font-size:13px;margin-top:6px;font-weight:700">শ্রেণী: <span id="showClass3"></span></div><button onclick="goFirst()" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
<div class="card"><button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a"><input type="text" id="sName" placeholder="নাম"><input type="text" id="sRoll" placeholder="রোল"><input type="text" id="sMobile" placeholder="মোবাইল"><div style="display:flex;gap:8px"><button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px">✅ যোগ</button><button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px">❌ বন্ধ</button></div></div>
<div class="filter-tabs"><button id="tabAll" style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><span id="cAll">0</span></button><button id="tabPresent" style="background:#16a34a;color:white" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent">0</span></button><button id="tabAbsent" style="background:#ef4444;color:white" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent">0</span></button><button id="tabResult" style="background:#7c3aed;color:white" onclick="filterList('result')">🏆 ফলাফল</button></div>
<div id="studentList"></div><div id="resultDiv" style="overflow:auto;margin-top:10px;border:2px solid #7c3aed;border-radius:12px;padding:10px;background:#f5f3ff"></div></div></div>
<script>
function getInstList(){return JSON.parse(localStorage.getItem('institutionList')||'[]');}
function updateDash(){let l=getInstList();if(!l.length){l=[{nameBn:'মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ',eiin:'132332'}];localStorage.setItem('institutionList',JSON.stringify(l));}cntTotal.innerText=l.length;cntLogin.innerText=l.length;instDiv.innerHTML=l.map(x=>`🏫 ${x.nameBn} - 🟢 লগইন`).join('<br>');}
function toggleInst(){updateDash();instDiv.style.display=instDiv.style.display=='block'?'none':'block';}
let students=JSON.parse(localStorage.getItem('students9')||'[]'),attendance=JSON.parse(localStorage.getItem('att9')||'{}'),attMonthly=JSON.parse(localStorage.getItem('attMonthly9')||'{}'),results=JSON.parse(localStorage.getItem('results9')||'{}'),showSubjects=false,subNames=JSON.parse(localStorage.getItem('subNames9')||'["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"]'),currentFilter='all';
function saveBox(){let info={nameBn:boxNameBn.innerText.trim(),nameEn:boxNameEn.innerText.trim(),eiin:boxEIIN.innerText.trim(),ins:boxIns.innerText.trim(),logo:boxLogo.src};localStorage.setItem('collegeInfo',JSON.stringify(info));let list=getInstList();let ix=list.findIndex(x=>x.nameBn==info.nameBn);if(ix>=0)list[ix]=info;else list.push(info);localStorage.setItem('institutionList',JSON.stringify(list));boxStatus.innerText="✅ সেভ হয়েছে";setTimeout(()=>boxStatus.innerText="",1200);boxNameBn3.innerText=info.nameBn;boxNameEn3.innerText=info.nameEn;boxEIIN3.innerText="EIIN: "+info.eiin;boxIns3.innerText="Code: "+info.ins;boxLogo3.src=info.logo;updateDash();}
function changeBoxLogo(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox();};r.readAsDataURL(f);}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(info.nameBn)boxNameBn.innerText=info.nameBn;if(info.nameEn)boxNameEn.innerText=info.nameEn;if(info.eiin)boxEIIN.innerText=info.eiin;if(info.ins)boxIns.innerText=info.ins;if(info.logo){boxLogo.src=info.logo;boxLogo3.src=info.logo;}boxNameBn3.innerText=info.nameBn||boxNameBn.innerText;boxNameEn3.innerText=info.nameEn||boxNameEn.innerText;boxEIIN3.innerText="EIIN: "+(info.eiin||boxEIIN.innerText);boxIns3.innerText="Code: "+(info.ins||boxIns.innerText);}
function doLogin(){if(!loginClass.value)return alert('শ্রেণি দিন');if(loginPass.value!='1234')return alert('1234 দিন');showClass.innerText=loginClass.value;showClass3.innerText=loginClass.value;loginWrapper.style.display='none';firstPage.classList.add('active');loadBox();}
function openStudentPage(){firstPage.classList.remove('active');secondPage.classList.add('active');loadBox();updateCounts();}
function goFirst(){secondPage.classList.remove('active');firstPage.classList.add('active');}
function toggleAdd(){addForm.style.display=addForm.style.display=='none'?'block':'none';}
function addStudent(){students.push({name:sName.value.trim(),roll:sRoll.value.trim(),mobile:sMobile.value.trim()});localStorage.setItem('students9',JSON.stringify(students));addForm.style.display='none';filterList('all');}
function toggleAtt(i,p){attendance[i]=p?'present':'absent';localStorage.setItem('att9',JSON.stringify(attendance));render();updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});cAll.innerText=students.length;cPresent.innerText=p;cAbsent.innerText=students.length-p;}
function filterList(t){currentFilter=t;studentList.style.display='none';resultDiv.style.display='none';studentList.classList.remove('show');if(t=='result'){resultDiv.style.display='block';renderResult();}else{studentList.style.display='block';studentList.classList.add('show');render();}}
function render(){studentList.innerHTML='';students.forEach((s,i)=>{studentList.innerHTML+=`<div class="student-row"><div><input type="checkbox" ${attendance[i]=='absent'?'':'checked'} onchange="toggleAtt(${i},this.checked)"> <b>${s.name}</b> (${s.roll})</div><button onclick="students.splice(${i},1);localStorage.setItem('students9',JSON.stringify(students));render()">🗑️</button></div>`;});updateCounts();}
function toggleMonthlyFirst(){monthlyDivFirst.style.display=monthlyDivFirst.style.display=='block'?'none':'block';if(monthlyDivFirst.style.display=='block'){let d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),h=`<table border="1" style="border-collapse:collapse;min-width:1200px;font-size:11px"><tr><th>নাম</th>`;for(let i=1;i<=days;i++)h+=`<th>${i}</th>`;h+=`</tr>`;students.forEach(s=>{h+=`<tr><td>${s.name}</td>`;for(let i=1;i<=days;i++)h+=`<td>-</td>`;h+=`</tr>`;});h+=`</table>`;monthlyDivFirst.innerHTML=h;}}
function renderResult(){let h=`<button onclick="showSubjects=!showSubjects;renderResult()" style="width:100%;padding:12px;background:#0f3d2e;color:#fff;border:none;border-radius:10px;margin-bottom:8px;font-weight:bold">${showSubjects?'🙈 লুকান':'✏️ বিষয়ের নাম লিখুন'}</button><div style="${showSubjects?'':'display:none'};background:#fffbe6;padding:12px;border-radius:10px;border:2px dashed #eab308;margin-bottom:10px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;for(let i=0;i<13;i++){let v=subNames[i].startsWith('বিষয়')?'':subNames[i];h+=`<input placeholder="বিষয় ${i+1}" value="${v}" oninput="subNames[${i}]=this.value;localStorage.setItem('subNames9',JSON.stringify(subNames))" style="padding:10px;border-radius:8px;border:1px solid #ccc">`;}h+=`</div><button onclick="renderResult()" style="width:100%;margin-top:10px;padding:10px;background:#16a34a;color:#fff;border:none;border-radius:8px">✅ সেভ</button></div><div style="overflow:auto"><table border="1" cellpadding="5" style="border-collapse:collapse;min-width:900px;font-size:12px;text-align:center"><tr style="background:#fde047"><th>নাম</th>`;for(let i=0;i<13;i++)h+=`<th>${subNames[i].startsWith('বিষয়')?'':subNames[i]||i+1}</th>`;h+=`<th>মোট</th></tr>`;students.forEach((s,idx)=>{let r=results[idx]||{};h+=`<tr><td>${s.name}</td>`;for(let i=0;i<13;i++)h+=`<td><input type="number" value="${r['s'+i]||''}" oninput="if(!results[${idx}])results[${idx}]={};results[${idx}]['s'+${i}]=this.value;localStorage.setItem('results9',JSON.stringify(results))" style="width:55px"></td>`;let t=0;for(let i=0;i<13;i++)t+=parseInt((results[idx]||{})['s'+i]||0);h+=`<td><b>${t}</b></td></tr>`;});h+=`</table></div>`;resultDiv.innerHTML=h;}
function sendSMS(t){window.location.href=`sms:?body=${t}`;}
window.onload=()=>{loadBox();updateDash();};
</script>
</body>
</html>
