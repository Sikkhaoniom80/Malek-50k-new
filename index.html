<script>
let currentClass = localStorage.getItem('currentClass') || '';
let students = [];
let attendance = {};

function loadData(){
  if(!currentClass) return;
  students = JSON.parse(localStorage.getItem('students_'+currentClass)||'[]');
  attendance = JSON.parse(localStorage.getItem('att_'+currentClass)||'{}');
}
function saveData(){
  localStorage.setItem('students_'+currentClass, JSON.stringify(students));
  localStorage.setItem('att_'+currentClass, JSON.stringify(attendance));
  localStorage.setItem('currentClass', currentClass);
}

function doLogin(){
  let cls=document.getElementById('loginClass').value;
  let pass=document.getElementById('loginPass').value.trim();
  if(!cls){ alert('শ্রেণী সিলেক্ট করুন'); return; }
  if(pass!='1234' && pass!='১২৩৪'){ alert('পাসওয়ার্ড 1234'); return; }
  currentClass = cls;
  loadData();
  document.getElementById('classNameShow').innerText='শ্রেণী: '+cls;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p2').classList.add('active');
  updateCounts();
}

function addStudent(){
  let n=document.getElementById('sName').value.trim(),
      r=document.getElementById('sRoll').value.trim(),
      m=document.getElementById('sMobile').value.trim();
  if(!n||!r) return alert('নাম ও রোল দিন');
  students.push({name:n,roll:r,mobile:m});
  saveData();
  document.getElementById('sName').value='';document.getElementById('sRoll').value='';document.getElementById('sMobile').value='';
  render();showTab('list');
}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent';saveData();updateCounts();}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);delete attendance[i];saveData();render();}}
function editS(i){let s=students[i];let n=prompt('নাম:',s.name);if(n===null)return;let r=prompt('রোল:',s.roll);let m=prompt('মোবাইল:',s.mobile||'');students[i]={...s,name:n,roll:r,mobile:m};saveData();render();}
// বাকি সব render(), updateCounts() আগের মতই থাকবে, শুধু saveData() কল করবে
</script>
