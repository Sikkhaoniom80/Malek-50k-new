<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek 50K</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
body{background:#0a2342;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;box-shadow:0 0 25px rgba(255,215,0,.5);margin-top:10px}
.card{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:16px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.card h2{text-align:center;font-size:28px;color:#111}
.sub{text-align:center;color:#6b7280;font-size:13px;font-weight:700;margin:4px 0 16px;letter-spacing:1px}
select,input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #d1d5db;font-size:16px;margin:7px 0;background:white;outline:none}
.btn-login{width:100%;padding:14px;border-radius:14px;border:none;background:#0f2d5a;color:white;font-size:16px;font-weight:700;margin-top:8px;cursor:pointer}
#page2,#page3{display:none;background:#eef2ff;width:100%;min-height:100vh;position:fixed;top:0;left:0;z-index:9999;overflow-y:auto;padding:10px;padding-bottom:100px}
.college{background:#0a2342;color:#ffd700;padding:12px;border-radius:14px;text-align:center;font-weight:700;border:2px solid #ffd700;margin-bottom:8px}
.m-input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #cbd5e1;margin:5px 0;background:white;font-size:15px}
#list{border:2px solid #0a2342;border-radius:14px;padding:6px;background:#f8fafc;min-height:40vh}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:10px 0}
.stat{background:white;padding:10px;border-radius:12px;text-align:center;border:2px solid #0a2342}.stat b{font-size:20px;display:block}
.student-card{display:flex;justify-content:space-between;align-items:center;background:white;padding:12px;border-radius:12px;margin:6px 0;border:1px solid #ddd}
.b{width:100%;padding:13px;border-radius:12px;border:none;color:white;font-weight:700;margin:5px 0;cursor:pointer}
.box{background:white;padding:14px;border-radius:14px;margin:12px 0;border:1px solid #ddd}
.btn-p,.btn-a,.btn-l{width:42px;height:38px;border-radius:8px;border:none;color:white;font-weight:700}.btn-p{background:#16a34a}.btn-a{background:#ef4444}.btn-l{background:#f59e0b}
.active{outline:3px solid #000}.inactive{opacity:.35}
.sms-area{display:flex;gap:6px;margin-top:8px}.sms-area button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:700}
</style>
</head>
<body>

<!-- ১ম পাতা - ফিক্সড তোমার ছবি -->
<img class="logo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" id="topLogo">
<div id="loginBox" class="card">
<h2>🔐 শিক্ষক লগইন</h2><div class="sub">MALEK ATTENDANCE</div>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button class="btn-login" onclick="doLogin()">🔐 লগইন করুন - MALEK ATTENDANCE</button>
<p style="text-align:center;margin-top:10px;font-size:12px;color:#888">পাসওয়ার্ড: 1234</p>
</div>

<!-- ২য় পাতা - নোটিশ বোর্ড -->
<div id="page2">
<div class="college">🏫 মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ<br><small style="color:#fff" id="showClass2"></small> - নোটিশ</div>
<div class="box">
<h3>📢 নোটিশ বোর্ড</h3>
<textarea id="noticeText" class="m-input" rows="5" placeholder="এখানে নোটিশ লিখুন... যেমন: আগামীকাল ক্লাস বন্ধ, পরীক্ষার রুটিন ইত্যাদি"></textarea>
<div style="display:flex;gap:6px;margin-top:10px">
<button class="b" style="background:#16a34a" onclick="saveNotice()">💾 নোটিশ সেভ করুন</button>
</div>
<div style="margin-top:15px;background:#fffbe6;padding:10px;border-radius:10px;border:1px dashed #eab308">
<b>সেভ করা নোটিশ:</b><br><span id="savedNotice" style="color:#333">কোনো নোটিশ নেই</span>
</div>
<div class="sms-area">
<button style="background:#16a34a;color:white" onclick="sendSMS('present')">Present SMS</button>
<button style="background:#ef4444;color:white" onclick="sendSMS('absent')">Absent SMS</button>
<button style="background:#eab308;color:black" onclick="sendSMS('notice')">Notice SMS</button>
</div>
</div>
<div style="display:flex;gap:8px">
<button class="b" style="background:#0a2342;flex:1" onclick="goPage3()">📋 হাজিরা নিন (৩য় পাতা) ➡️</button>
<button class="b" style="background:#555;flex:1" onclick="location.reload()">🔙 লগআউট</button>
</div>
</div>

<!-- ৩য় পাতা - হাজিরা -->
<div id="page3">
<div class="college">🏫 মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ<br><small style="color:#fff" id="showClass3"></small> - হাজিরা</div>
<div style="display:flex;gap:6px"><div style="flex:1"><small>📅 তারিখ:</small><input type="date" id="attDate" class="m-input"></div><div style="flex:1"><small>🔍 খুঁজুন:</small><input type="text" id="searchBox" class="m-input" placeholder="নাম/রোল" onkeyup="render()"></div></div>
<div class="stats"><div class="stat"><b id="tTotal">0</b><small>মোট</small></div><div class="stat"><b id="tPresent" style="color:#16a34a">0</b><small>P</small></div><div class="stat"><b id="tAbsent" style="color:#ef4444">0</b><small>A</small></div><div class="stat"><b id="tLate" style="color:#f59e0b">0</b><small>L</small></div></div>
<div class="box" style="padding:8px">
<div style="display:flex;gap:6px"><input id="sname" class="m-input" placeholder="নাম" style="flex:2"><input id="sroll" class="m-input" placeholder="রোল" style="flex:1"><input id="smobile" class="m-input" placeholder="মোবাইল" style="flex:1.5"></div>
<button class="b" style="background:#0a2342;padding:10px" onclick="addOne()">+ যোগ করুন</button>
</div>
<div id="list"></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="b" style="background:#eab308;color:black;flex:1" onclick="goPage2()">⬅️ নোটিশ (২য় পাতা)</button>
<button class="b" style="background:#555;flex:1" onclick="location.reload()">🔙 লগআউট</button>
</div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('malek_final_permanent')||'[]');
let attendance=JSON.parse(localStorage.getItem('malek_att_permanent')||'{}');
let noticeSaved=localStorage.getItem('malek_notice')||'';
document.getElementById('savedNotice').innerText=noticeSaved||'কোনো নোটিশ নেই';
document.getElementById('noticeText').value=noticeSaved;

function doLogin(){
 let c=document.getElementById('loginClass').value;
 let p=document.getElementById('loginPass').value;
 if(!c){alert('শ্রেণি সিলেক্ট করুন');return}
 if(p!='1234'){alert('পাসওয়ার্ড 1234');return}
 document.getElementById('showClass2').innerText=c;
 document.getElementById('showClass3').innerText=c;
 document.getElementById('loginBox').style.display='none';
 document.getElementById('topLogo').style.display='none';
 document.getElementById('page2').style.display='block';
 document.getElementById('page3').style.display='none';
}
function goPage3(){
 document.getElementById('page2').style.display='none';
 document.getElementById('page3').style.display='block';
 document.getElementById('attDate').value=new Date().toISOString().split('T')[0];
 render();
}
function goPage2(){
 document.getElementById('page3').style.display='none';
 document.getElementById('page2').style.display='block';
}
function saveNotice(){
 let n=document.getElementById('noticeText').value.trim();
 localStorage.setItem('malek_notice',n);
 document.getElementById('savedNotice').innerText=n||'কোনো নোটিশ নেই';
 alert('নোটিশ সেভ হয়েছে');
}
function save(){localStorage.setItem('malek_final_permanent',JSON.stringify(students));localStorage.setItem('malek_att_permanent',JSON.stringify(attendance));render();}
function addOne(){let cls=document.getElementById('loginClass').value,n=document.getElementById('sname').value.trim(),r=document.getElementById('sroll').value.trim(),m=document.getElementById('smobile').value.trim();if(!n||!r){alert('নাম রোল দিন');return}students.push({class:cls,roll:r,name:n,mobile:m});document.getElementById('sname').value='';document.getElementById('sroll').value='';document.getElementById('smobile').value='';save();}
function getStatus(i,d){return (attendance[d]&&attendance[d][i])||''}
function render(){
 let cls=document.getElementById('loginClass').value;
 let q=document.getElementById('searchBox').value.toLowerCase();
 let date=document.getElementById('attDate').value;
 let all=students.map((s,i)=>({...s,idx:i})).filter(s=>s.class==cls);
 document.getElementById('tTotal').innerText=all.length;
 document.getElementById('tPresent').innerText=all.filter(s=>getStatus(s.idx,date)=='P').length;
 document.getElementById('tAbsent').innerText=all.filter(s=>getStatus(s.idx,date)=='A').length;
 document.getElementById('tLate').innerText=all.filter(s=>getStatus(s.idx,date)=='L').length;
 let div=document.getElementById('list'); div.innerHTML='';
 if(all.length==0){div.innerHTML='<p style="text-align:center;color:#888;padding:20px">কোনো শিক্ষার্থী নেই, উপরে যোগ করুন</p>';return}
 all.filter(s=>q==''||s.name.toLowerCase().includes(q)||s.roll.includes(q)).forEach(s=>{
  let st=getStatus(s.idx,date);
  div.innerHTML+=`<div class="student-card"><div><b>${s.name}</b><br><small>রোল:${s.roll} | ${s.mobile||''}</small><br><button style="font-size:10px;color:red;border:none;background:none" onclick="delS(${s.idx})">ডিলিট</button></div><div style="display:flex;gap:4px"><button class="btn-p ${st=='P'?'active':'inactive'}" onclick="mark(${s.idx},'P')">P</button><button class="btn-a ${st=='A'?'active':'inactive'}" onclick="mark(${s.idx},'A')">A</button><button class="btn-l ${st=='L'?'active':'inactive'}" onclick="mark(${s.idx},'L')">L</button></div></div>`;
 });
}
function mark(i,s){let d=document.getElementById('attDate').value;if(!attendance[d])attendance[d]={};attendance[d][i]=s;save();}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);save();}}
function sendSMS(type){
 let notice=document.getElementById('noticeText').value.trim();
 let cls=document.getElementById('loginClass').value;
 let date=document.getElementById('attDate').value||new Date().toISOString().split('T')[0];
 let all=students.map((s,i)=>({...s,idx:i})).filter(s=>s.class==cls);
 let targets= type=='notice'? all : type=='present'? all.filter(s=>getStatus(s.idx,date)=='P') : all.filter(s=>getStatus(s.idx,date)=='A');
 if(targets.length==0) return alert('হাজিরা নিন আগে (৩য় পাতায়)');
 let numbers=targets.map(s=>(s.mobile||'').trim()).filter(m=>m.length>=11);
 if(numbers.length==0) return alert('মোবাইল নম্বর নেই');
 let dateStr=new Date(date).toLocaleDateString('bn-BD');
 let msg= type=='present'? `আজ ${dateStr} তারিখে কলেজে উপস্থিত আছে।\n${notice}\n- মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ` : type=='absent'? `আজ ${dateStr} তারিখে কলেজে অনুপস্থিত।\n${notice}\n- মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ` : `📢 নোটিশ: ${notice}\nতারিখ: ${dateStr}\n- মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ`;
 window.location.href=`sms:${numbers.join(';')}?body=${encodeURIComponent(msg)}`;
}
document.getElementById('attDate')?.addEventListener('change',render);
</script>
</body>
</html>
