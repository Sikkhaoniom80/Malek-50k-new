<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MALEK ATTENDANCE</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}body{background:#eef2ff}.login{position:fixed;inset:0;background:#0a2a5a;z-index:999;display:flex;align-items:center;justify-content:center}.loginBox{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:360px}.headerPro{background:linear-gradient(135deg,#0a2a5a,#0aa3e8);padding:16px 10px;color:#fff;text-align:center}.headerTop{display:flex;align-items:center;justify-content:center;gap:14px}.logoBox{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0a2a5a;font-size:28px}.appName{font-size:23px;font-weight:900;letter-spacing:1px;line-height:1.1}.appName span{color:#22e5ff}.collegeName{font-size:13px;font-weight:600;margin-top:8px;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:20px;display:inline-block}.teacherBadge{margin-top:8px;font-size:12px;background:#fff;color:#0a2a5a;padding:5px 14px;border-radius:20px;display:inline-block;font-weight:700}.stats{display:flex;justify-content:space-around;margin:10px 3%;background:#fff;padding:12px;border-radius:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08)}.filterBox{display:flex;gap:8px;margin:10px 3%}.filter{flex:1;padding:12px;border-radius:10px;border:1px solid #ccc;background:#fff}.search{width:94%;margin:0 3% 10px 3%;padding:12px;border-radius:10px;border:1px solid #ccc}.box{padding:14px}.inp,.select{width:100%;padding:12px;border-radius:10px;border:1px solid #c0c8d8;margin-bottom:8px;background:#fff}.btn{width:100%;padding:14px;border-radius:12px;border:none;color:#fff;font-weight:700;margin-bottom:8px}.add{background:#0a2a5a}.bulk{background:#6c5ce7}.noticeBox{background:#fff;padding:12px;border-radius:12px;border:2px solid #6c5ce7;margin-bottom:12px}.row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.sms{flex:1;padding:12px;border-radius:10px;border:none;color:#fff;font-weight:700}.present{background:#1aad5a}.absent{background:#e53935}.late{background:#ff9800}.excel{background:#0aa3e8}.print{background:#333}.list{background:#fff;border-radius:12px;padding:6px;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:center;font-size:13px}.pill{padding:6px 10px;border-radius:20px;border:none;font-weight:700;margin:2px;font-size:12px}.onP{background:#1aad5a;color:#fff;border:2px solid #000}.onA{background:#e53935;color:#fff;border:2px solid #000}.onL{background:#ff9800;color:#fff;border:2px solid #000}.off{background:#e5e7eb}.editBtn{background:#ffeb3b;padding:4px 8px;border-radius:6px;border:none}.delBtn{background:#ffcdd2;padding:4px 8px;border-radius:6px;border:none}.bulkBox{background:#fff3cd;padding:12px;border-radius:10px;margin-bottom:12px;border:2px dashed #ff9800;display:none}.textarea{width:100%;height:100px;padding:10px;border-radius:8px;border:1px solid #ccc}</style></head><body>
<div id="loginScreen" class="login"><div class="loginBox"><h2 style="text-align:center">🔐 শিক্ষক লগইন</h2><p style="text-align:center;font-size:12px;color:#666;margin-top:6px">MALEK ATTENDANCE</p><select id="teacherClass" class="select" style="margin-top:14px"><option value="">শ্রেণি সিলেক্ট করুন</option><option value="1">১ম শ্রেণি</option><option value="2">২য়</option><option value="3">৩য়</option><option value="4">৪র্থ</option><option value="5">৫ম</option><option value="6">৬ষ্ঠ</option><option value="7">৭ম</option><option value="8">৮ম</option><option value="9">৯ম (মালেক স্যার)</option><option value="10">১০ম</option><option value="11">১১শ</option><option value="12">১২শ</option><option value="all">🏫 প্রধান শিক্ষক (সব শ্রেণি)</option></select><input id="teacherPass" class="inp" type="password" placeholder="পাসওয়ার্ড: 1234"><button class="btn add" onclick="teacherLogin()">✅ লগইন - MALEK ATTENDANCE</button></div></div>
<div class="headerPro"><div class="headerTop"><div class="logoBox">M</div><div><div class="appName">MALEK<br><span>ATTENDANCE</span></div></div></div><div class="collegeName">মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div><br><div id="teacherName" class="teacherBadge">লগইন করুন</div><div id="cloudStatus" style="font-size:11px;margin-top:6px;opacity:.9">☁️ Auto Cloud Sync Ready</div></div>
<div class="stats"><div>মোট:<span id="tTotal">0</span></div><div>P:<span id="tP">0</span></div><div>A:<span id="tA">0</span></div><div>L:<span id="tL">0</span></div></div>
<div class="filterBox"><select id="classFilter" class="filter" onchange="showList()"></select><button class="filter" onclick="showMonthly()">📅 মাসিক</button></div><input id="searchInput" class="search" placeholder="Search নাম / রোল..." oninput="showList()"><div class="box">
<div class="noticeBox"><div style="font-weight:800;color:#6c5ce7;margin-bottom:8px">📢 নোটিশ বোর্ড</div><select id="noticeType" class="select" onchange="setNotice()"><option value="">নোটিশ সিলেক্ট করুন</option><option value="আগামীকাল শুক্রবার কলেজ বন্ধ থাকবে। শনিবার যথারীতি ক্লাস হবে - মমতাজ উদ্দিন কলেজ">🕌 শুক্রবার বন্ধ</option><option value="আগামীকাল শনিবার কলেজ বন্ধ থাকবে। রবিবার যথারীতি ক্লাস হবে">📅 শনিবার বন্ধ</option><option value="আগামীকাল শনিবার কলেজে পরিদর্শন/ইন্সপেকশন আসবে। সকল ছাত্র-ছাত্রীকে নির্ধারিত পোশাকে সকাল ৯টায় উপস্থিত থাকতে হবে - মমতাজ উদ্দিন কলেজ">🔍 শনিবার ইন্সপেকশন নোটিশ</option><option value="জরুরি নোটিশ: আগামীকাল সকলকে অভিভাবকসহ কলেজে উপস্থিত থাকতে হবে">⚠️ জরুরি নোটিশ</option><option value="custom">✏️ নিজে লিখবো</option></select><textarea id="noticeMsg" class="textarea" placeholder="এখানে নোটিশ লিখুন..."></textarea><button class="btn" style="background:#6c5ce7" onclick="sendNotice()">📢 এই নোটিশ সবাইকে পাঠান (আনলিমিটেড)</button></div>
<h3>নতুন শিক্ষার্থী যোগ</h3><select id="inputClass" class="select"><option value="9">৯ম</option><option value="1">১ম</option><option value="2">২য়</option><option value="3">৩য়</option><option value="4">৪র্থ</option><option value="5">৫ম</option><option value="6">৬ষ্ঠ</option><option value="7">৭ম</option><option value="8">৮ম</option><option value="10">১০ম</option><option value="11">১১শ</option><option value="12">১২শ</option></select><input id="inputName" class="inp" placeholder="ছাত্রের নাম"><input id="inputRoll" class="inp" placeholder="রোল" type="number"><input id="inputMobile" class="inp" placeholder="মোবাইল 01..." type="tel"><button class="btn add" onclick="addNow()">+ একজন যোগ</button><button class="btn bulk" onclick="toggleBulk()">📋 আনলিমিটেড বাল্ক যোগ (২০০ জন)</button><div id="bulkBox" class="bulkBox"><p style="font-size:12px;margin-bottom:6px">ফরমেট: রোল,নাম,মোবাইল</p><textarea id="bulkText" class="textarea" placeholder="1,তাহিয়া,01911&#10;2,মৌমিতা,01922&#10;3,কালাম,01933"></textarea><button class="btn add" style="margin-top:8px" onclick="addBulk()">✅ যোগ করুন</button></div>
<div class="row"><button class="sms present" onclick="sendPresent()">✉️ P SMS</button><button class="sms absent" onclick="sendAbsent()">✉️ A SMS</button><button class="sms late" onclick="sendLate()">✉️ L SMS</button></div><div class="row"><button class="btn excel" style="flex:1" onclick="downloadExcel()">📊 Excel Download</button><button class="btn print" style="flex:1" onclick="window.print()">🖨️ প্রিন্ট</button></div>
<div class="list"><table><thead><tr><th>শ্রেণি</th><th>রোল</th><th>নাম</th><th>P/A/L</th><th>Edit</th></tr></thead><tbody id="tableBody"></tbody></table><p id="emptyMsg" style="text-align:center;padding:18px;color:#888">ছাত্র নাই মামা</p><div id="monthlyBox" style="display:none;padding:10px;background:#f3f3ff;border-radius:10px;margin-top:10px"></div></div></div><script>
const firebaseConfig={apiKey:"PASTE_HERE",authDomain:"PASTE_HERE",databaseURL:"PASTE_HERE",projectId:"PASTE_HERE",storageBucket:"PASTE_HERE",messagingSenderId:"PASTE_HERE",appId:"PASTE_HERE"};var useCloud=false;try{if(firebaseConfig.apiKey!="PASTE_HERE"){firebase.initializeApp(firebaseConfig);useCloud=true;}}catch(e){}
var students=[];var attendance={};var todayDate=new Date().toISOString().split('T')[0];var currentTeacherClass=null;var isHeadTeacher=false;
function teacherLogin(){var c=document.getElementById("teacherClass").value;var p=document.getElementById("teacherPass").value;if(c==""||p!="1234"){alert("শ্রেণি সিলেক্ট + পাস 1234");return;}currentTeacherClass=c;isHeadTeacher=(c=="all");document.getElementById("loginScreen").style.display="none";document.getElementById("teacherName").innerText=isHeadTeacher?"প্রধান শিক্ষক (সব শ্রেণি)":c+"ম শ্রেণির শিক্ষক";var cf=document.getElementById("classFilter");cf.innerHTML="";if(isHeadTeacher){cf.innerHTML='<option value="all">সব শ্রেণি</option><option value="1">১ম</option><option value="2">২য়</option><option value="3">৩য়</option><option value="4">৪র্থ</option><option value="5">৫ম</option><option value="6">৬ষ্ঠ</option><option value="7">৭ম</option><option value="8">৮ম</option><option value="9">৯ম</option><option value="10">১০ম</option><option value="11">১১শ</option><option value="12">১২শ</option>';}else{cf.innerHTML='<option value="'+c+'">'+c+'ম শ্রেণি</option>';document.getElementById("inputClass").value=c;}load();}
function load(){if(useCloud){firebase.database().ref("malek_school/students").on("value",snap=>{var d=snap.val();if(d){students=Object.values(d);localStorage.setItem("malek_CLOUD_V1",JSON.stringify(students));showList();}});firebase.database().ref("malek_school/attendance").on("value",snap=>{var d=snap.val();if(d){attendance=d;localStorage.setItem("att_CLOUD_V1",JSON.stringify(attendance));showList();}});}else{try{students=JSON.parse(localStorage.getItem("malek_CLOUD_V1")||"[]");attendance=JSON.parse(localStorage.getItem("att_CLOUD_V1")||"{}");if(students.length==0){var olds=["malek_SUPER_V2","malek_NOTICE_V1","malek_FINAL_NO_DATE","malek_UNLIMITED"];for(var k=0;k<olds.length;k++){var o=JSON.parse(localStorage.getItem(olds[k])||"[]");if(o&&o.length){students=o.map(s=>{if(!s.class)s.class="9";return s;});break;}}}}catch(e){}showList();}setInterval(autoCloudSave,30000);}
function saveLocal(){localStorage.setItem("malek_CLOUD_V1",JSON.stringify(students));localStorage.setItem("att_CLOUD_V1",JSON.stringify(attendance));}
function autoCloudSave(){if(!useCloud){saveLocal();document.getElementById("cloudStatus").innerText="💾 Local Saved";return;}if(students.length==0)return;firebase.database().ref("malek_school/students").set(students.reduce((a,v,i)=>(a[i]=v,a),{}));firebase.database().ref("malek_school/attendance").set(attendance);document.getElementById("cloudStatus").innerText="☁️ Synced "+new Date().toLocaleTimeString();}
function save(){saveLocal();if(useCloud)autoCloudSave();}
function getS(key){return attendance[todayDate]&&attendance[todayDate][key]||"";}
function setS(key,s){if(!attendance[todayDate])attendance[todayDate]={};attendance[todayDate][key]=s;save();showList();}
function toggleBulk(){var b=document.getElementById("bulkBox");b.style.display=b.style.display=="none"?"block":"none";}
function setNotice(){var t=document.getElementById("noticeType").value;if(t!="custom"&&t!="")document.getElementById("noticeMsg").value=t;}
function addNow(){var c=document.getElementById("inputClass").value;if(!isHeadTeacher)c=currentTeacherClass;var n=document.getElementById("inputName").value.trim();var r=document.getElementById("inputRoll").value.trim();var m=document.getElementById("inputMobile").value.trim();if(n==""||r==""||m==""){alert("৪টাই লিখুন");return;}var key=c+"-"+r;if(students.find(x=>(x.class+"-"+x.roll)==key)){alert("এই রোল আছে");return;}students.push({class:c,name:n,roll:r,mobile:m});save();document.getElementById("inputName").value="";document.getElementById("inputRoll").value="";document.getElementById("inputMobile").value="";showList();}
function addBulk(){var c=document.getElementById("inputClass").value;if(!isHeadTeacher)c=currentTeacherClass;var txt=document.getElementById("bulkText").value.trim();if(txt==""){alert("লিস্ট পেস্ট করুন");return;}var lines=txt.split("\n");var added=0;for(var i=0;i<lines.length;i++){var p=lines[i].trim().split(",");if(p.length<3)continue;var r=p[0].trim(),n=p[1].trim(),m=p[2].trim();if(students.find(x=>(x.class+"-"+x.roll)==(c+"-"+r)))continue;students.push({class:c,name:n,roll:r,mobile:m});added++;}save();document.getElementById("bulkText").value="";toggleBulk();alert("✅ "+added+" জন যোগ! মোট: "+students.length);showList();}
function editStudent(i){var s=students[i];var nn=prompt("নাম:",s.name);if(nn==null)return;var rr=prompt("রোল:",s.roll);if(rr==null)return;var mm=prompt("মোবাইল:",s.mobile);if(mm==null)return;students[i].name=nn;students[i].roll=rr;students[i].mobile=mm;save();showList();}
function deleteStudent(i){if(confirm("মুছবেন? "+students[i].name)){students.splice(i,1);save();showList();}}
function showList(){var filter=document.getElementById("classFilter").value;if(!isHeadTeacher)filter=currentTeacherClass;var q=document.getElementById("searchInput").value.toLowerCase();var tb=document.getElementById("tableBody");tb.innerHTML="";var p=0,a=0,l=0,total=0,filtered=0;for(var i=0;i<students.length;i++){var s=students[i];if(filter!="all"&&s.class!=filter)continue;total++;if(s.name.toLowerCase().indexOf(q)==-1&&s.roll.indexOf(q)==-1)continue;filtered++;var key=s.class+"-"+s.roll;var st=getS(key);if(st=="P")p++;if(st=="A")a++;if(st=="L")l++;tb.innerHTML+='<tr><td>'+s.class+'ম</td><td>'+s.roll+'</td><td>'+s.name+'<br><small>'+s.mobile+'</small></td><td><button class="pill '+(st=="P"?"onP":"off")+'" onclick="setS(\''+key+'\',\'P\')">P</button><button class="pill '+(st=="A"?"onA":"off")+'" onclick="setS(\''+key+'\',\'A\')">A</button><button class="pill '+(st=="L"?"onL":"off")+'" onclick="setS(\''+key+'\',\'L\')">L</button></td><td><button class="editBtn" onclick="editStudent('+i+')">✏️</button><button class="delBtn" onclick="deleteStudent('+i+')">🗑️</button></td></tr>';}document.getElementById("tTotal").innerText=isHeadTeacher?students.length:total;document.getElementById("tP").innerText=p;document.getElementById("tA").innerText=a;document.getElementById("tL").innerText=l;document.getElementById("emptyMsg").style.display=filtered==0?"block":"none";}
function sendNotice(){var filter=document.getElementById("classFilter").value;if(!isHeadTeacher)filter=currentTeacherClass;var msg=document.getElementById("noticeMsg").value.trim();if(msg==""){alert("নোটিশ লিখুন");return;}var list=[];for(var i=0;i<students.length;i++){if(filter!="all"&&students[i].class!=filter)continue;list.push(students[i]);}if(!list.length){alert("ছাত্র নাই");return;}location.href="sms:"+list.map(s=>s.mobile).join(",")+"?body="+encodeURIComponent(msg);}
function sendPresent(){var f=document.getElementById("classFilter").value;if(!isHeadTeacher)f=currentTeacherClass;var list=[];for(var i=0;i<students.length;i++){var s=students[i];if(f!="all"&&s.class!=f)continue;if(getS(s.class+"-"+s.roll)=="P")list.push(s);}if(!list.length){alert("P দিন");return;}location.href="sms:"+list.map(s=>s.mobile).join(",")+"?body="+encodeURIComponent("আজ উপস্থিত - মমতাজ উদ্দিন কলেজ");}
function sendAbsent(){var f=document.getElementById("classFilter").value;if(!isHeadTeacher)f=currentTeacherClass;var list=[];for(var i=0;i<students.length;i++){var s=students[i];if(f!="all"&&s.class!=f)continue;if(getS(s.class+"-"+s.roll)=="A")list.push(s);}if(!list.length){alert("A দিন");return;}location.href="sms:"+list.map(s=>s.mobile).join(",")+"?body="+encodeURIComponent("আজ অনুপস্থিত - মমতাজ উদ্দিন কলেজ");}
function sendLate(){var f=document.getElementById("classFilter").value;if(!isHeadTeacher)f=currentTeacherClass;var list=[];for(var i=0;i<students.length;i++){var s=students[i];if(f!="all"&&s.class!=f)continue;if(getS(s.class+"-"+s.roll)=="L")list.push(s);}if(!list.length){alert("L দিন");return;}location.href="sms:"+list.map(s=>s.mobile).join(",")+"?body="+encodeURIComponent("আজ দেরিতে উপস্থিত");}
function downloadExcel(){var f=document.getElementById("classFilter").value;if(!isHeadTeacher)f=currentTeacherClass;var csv="Class,Roll,Name,Mobile,Date,Status\n";for(var i=0;i<students.length;i++){var s=students[i];if(f!="all"&&s.class!=f)continue;csv+=s.class+","+s.roll+","+s.name+","+s.mobile+","+todayDate+","+getS(s.class+"-"+s.roll)+"\n";}var b=new Blob([csv],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="MALEK_ATTENDANCE_"+f+"_"+todayDate+".csv";a.click();}
function showMonthly(){var box=document.getElementById("monthlyBox");box.style.display=box.style.display=="none"?"block":"none";var f=document.getElementById("classFilter").value;if(!isHeadTeacher)f=currentTeacherClass;var month=new Date().toISOString().slice(0,7);var html="<h3>📅 মাসিক রিপোর্ট: "+month+"</h3><table><tr><th>নাম</th><th>P</th><th>A</th><th>L</th></tr>";for(var i=0;i<students.length;i++){var s=students[i];if(f!="all"&&s.class!=f)continue;var p=0,a=0,l=0;for(var d in attendance){if(d.startsWith(month)){var key=s.class+"-"+s.roll;if(attendance[d][key]=="P")p++;if(attendance[d][key]=="A")a++;if(attendance[d][key]=="L")l++;}}html+="<tr><td>"+s.name+" ("+s.roll+")</td><td>"+p+"</td><td>"+a+"</td><td>"+l+"</td></tr>";}html+="</table>";box.innerHTML=html;}
</script></body></html>
