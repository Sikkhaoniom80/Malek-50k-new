<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek 50K - Final Fixed</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
body{background:#0a2342;min-height:100vh}
.page{display:none}.page.active{display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;box-shadow:0 0 25px rgba(255,215,0,.5);margin-top:10px}
.card{background:#fff;width:100%;max-width:420px;border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px 15px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:15px;cursor:pointer}
.attendance{display:flex;gap:8px;margin:10px 0}.att-box{flex:1;background:#fff;text-align:center;padding:12px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}.blue{background:#2563eb}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-bottom:1px solid #eee;gap:10px}
input,select{width:100%;padding:12px;margin:6px 0;border:1.5px solid #ccc;border-radius:10px;font-size:15px}
</style>
</head>
<body>

<div id="p1" class="page active">
<img class="logo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" alt="Logo">
<div class="card">
<h2 style="text-align:center">🔐 শিক্ষক লগইন</h2>
<select id="loginClass">
<option value="">শ্রেণি সিলেক্ট করুন</option>
<option>১ম শ্রেণি</option>
<option>২য় শ্রেণি</option>
<option>৩য় শ্রেণি</option>
<option>৪র্থ শ্রেণি</option>
<option>৫ম শ্রেণি</option>
<option>৬ষ্ঠ শ্রেণি</option>
<option>৭ম শ্রেণি</option>
<option>৮ম শ্রেণি</option>
<option>৯ম শ্রেণি</option>
<option>১০ম শ্রেণি</option>
<option>১১শ শ্রেণি</option>
<option>১২শ শ্রেণি</option>
</select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button onclick="doLogin()" style="width:100%;padding:14px;border:none;border-radius:12px;background:#0f2d5a;color:white;font-weight:bold;margin-top:8px">লগইন করুন</button>
</div>
</div>

<div id="p2" class="page" style="background:#f0f2f5">
<div class="header"><h1>মমতাজউদ্দিন বিজনেস<br>ম্যানেজমেন্ট কলেজ</h1><p id="classNameShow" style="color:#ffde59;font-weight:bold">শ্রেণী: নবম</p></div>
<div class="card">
<button class="yellow-btn" onclick="goP3()">👥 শিক্ষার্থীর তালিকা</button>
<div class="attendance"><div class="att-box"><small>মোট</small><br><b id="total" style="font-size:22px">0</b></div><div class="att-box"><small>উপস্থিত</small><br><b id="present" style="font-size:22px;color:green">0</b></div><div class="att-box"><small>অনুপস্থিত</small><br><b id="absent" style="font-size:22px;color:red">0</b></div></div>
<input id="noticeText" placeholder="নোটিশ লিখুন...">
<div class="sms-btns"><button class="green" onclick="sendSMS('present')">Present SMS</button><button class="orange" onclick="sendSMS('absent')">Absent SMS</button><button class="yellow" onclick="sendSMS('notice')">Notice SMS</button></div>
<div style="display:flex;gap:8px;margin-top:10px"><button class="green" style="flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold" onclick="exportExcel()">Excel</button><button class="blue" style="flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold" onclick="goP1()">Logout</button></div>
</div>
</div>

<div id="p3" class="page" style="background:#f0f2f5">
<div class="header" style="padding-bottom:20px"><h2>শিক্ষার্থীর তালিকা</h2><button onclick="goP2()" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
<div class="card"><button class="yellow-btn" onclick="showTab('list')">📋 সম্পূর্ণ তালিকা (রোল ক্রমানুসারে)</button><button class="yellow-btn" style="margin-top:8px;background:#dcfce7" onclick="showTab('add')">➕ শিক্ষার্থী যোগ করুন</button>
<div id="listTab" style="margin-top:12px"><div id="studentList"></div></div>
<div id="addTab" style="display:none;margin-top:12px"><input id="sName" placeholder="নাম"><input id="sRoll" placeholder="রোল"><input id="sMobile" placeholder="মোবাইল 01..."><button onclick="addStudent()" style="width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;margin-top:8px;font-weight:bold">যোগ করুন</button></div>
</div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('students9')||'[]');
let attendance=JSON.parse(localStorage.getItem('att9')||'{}');

function doLogin(){
  let clsEl=document.getElementById('loginClass');
  let passEl=document.getElementById('loginPass');
  let cls=clsEl.value;
  let pass=passEl.value.trim();
  if(!cls){ alert('মামা আগে শ্রেণী সিলেক্ট করুন'); return; }
  if(pass!='1234' && pass!='১২৩৪'){ alert('পাসওয়ার্ড ভুল! পাসওয়ার্ড 1234'); return; }
  document.getElementById('classNameShow').innerText='শ্রেণী: '+cls;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('p2').classList.add('active');
  updateCounts();
}
function goP1(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p1').classList.add('active');}
function goP2(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p2').classList.add('active');updateCounts();}
function goP3(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('p3').classList.add('active');render();}
function showTab(t){document.getElementById('listTab').style.display=t=='list'?'block':'none';document.getElementById('addTab').style.display=t=='add'?'block':'none';}
function addStudent(){let n=document.getElementById('sName').value.trim(),r=document.getElementById('sRoll').value.trim(),m=document.getElementById('sMobile').value.trim();if(!n||!r)return alert('নাম ও রোল দিন');students.push({name:n,roll:r,mobile:m});localStorage.setItem('students9',JSON.stringify(students));document.getElementById('sName').value='';document.getElementById('sRoll').value='';document.getElementById('sMobile').value='';render();showTab('list');}
function render(){
 students.sort((a,b)=> parseInt(a.roll) - parseInt(b.roll));
 let list=document.getElementById('studentList');list.innerHTML='';
 if(students.length==0)list.innerHTML='<p style="color:gray;text-align:center">কোনো শিক্ষার্থী নেই</p>';
 students.forEach((s,i)=>{
  let checked=attendance[i]=='absent'?'':'checked';
  list.innerHTML+=`<div class="student-row"><div><input type="checkbox" ${checked} onchange="toggleAtt(${i},this.checked)"> <b>${s.name}</b> (রোল:${s.roll})</div><div><button style="background:#2196F3;color:white;border:none;padding:6px 10px;border-radius:6px" onclick="editS(${i})">✏️</button><button style="background:#ef4444;color:white;border:none;padding:6px 10px;border-radius:6px;margin-left:4px" onclick="delS(${i})">🗑️</button></div></div>`;
 });
 updateCounts();
}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent';localStorage.setItem('att9',JSON.stringify(attendance));updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});document.getElementById('total').innerText=students.length;document.getElementById('present').innerText=p;document.getElementById('absent').innerText=students.length-p;}
function delS(i){if(confirm('ডিলিট করবে?')){students.splice(i,1);delete attendance[i];localStorage.setItem('students9',JSON.stringify(students));localStorage.setItem('att9',JSON.stringify(attendance));render();}}
function editS(i){let s=students[i];let n=prompt('নাম:',s.name);if(n===null)return;let r=prompt('রোল:',s.roll);let m=prompt('মোবাইল:',s.mobile||'');students[i]={...s,name:n,roll:r,mobile:m};localStorage.setItem('students9',JSON.stringify(students));render();}
function exportExcel(){if(students.length==0)return alert('খালি');let data=students.map((s,i)=>({নাম:s.name,রোল:s.roll,মোবাইল:s.mobile||'',উপস্থিতি:attendance[i]!=='absent'?'উপস্থিত':'অনুপস্থিত'}));let ws=XLSX.utils.json_to_sheet(data);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Sheet");XLSX.writeFile(wb,"Attendance.xlsx");}
function sendSMS(type){let notice=document.getElementById('noticeText').value.trim();let targets=type=='notice'?students:type=='present'?students.filter((_,i)=>attendance[i]!=='absent'):students.filter((_,i)=>attendance[i]=='absent');let nums=targets.map(s=>(s.mobile||'').trim()).filter(m=>m.length>=11);if(nums.length==0)return alert('মোবাইল নাই');let msg=type=='present'?`উপস্থিত: ${notice}`:type=='absent'?`অনুপস্থিত: ${notice}`:`নোটিশ: ${notice}`;window.location.href=`sms:${nums.join(';')}?body=${encodeURIComponent(msg)}`;}
render();
</script>
</body>
</html>
