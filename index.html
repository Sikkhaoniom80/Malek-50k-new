<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOMTAZ UDDIN COLLEGE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#0f2d5a}
.header{background:#0f2d5a;color:white;padding:15px 10px 30px;text-align:center;border-radius:0 0 20px 20px}
.page{display:none;background:#f0f2f5;min-height:100vh;padding:10px}
.page.active{display:block}
.card{background:white;border-radius:15px;padding:12px;margin:10px 0;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}
button{padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
.filter-tabs{display:flex;gap:5px;overflow:auto;padding:8px 0}
.filter-tabs button{flex:1;min-width:70px;font-size:11px;padding:8px 4px}
.btn-active{outline:3px solid #000}
.student-row{display:flex;justify-content:space-between;align-items:center;background:white;padding:10px;border-radius:10px;margin:6px 0}
</style>
</head>
<body>

<!-- ১ম পাতা - লগইন + ৫টা ঘর + লোগো -->
<div id="loginPage" style="padding:15px">
<h2 style="text-align:center;color:white">🔐 লগইন</h2>
<div style="background:white;border-radius:15px;padding:12px;color:black">
<h4 style="margin:5px 0">🏫 কলেজ তথ্য (লিখলেই অটো সেভ)</h4>
<div style="border:2px dashed #0f2d5a;border-radius:12px;padding:10px;text-align:center;background:#f0f6ff">
<label style="font-weight:bold">🔵 গোল লোগো আপলোড</label><br>
<input type="file" id="cLogo" accept="image/*" onchange="uploadLogo(this)">
<img id="previewLogo" style="width:80px;height:80px;border-radius:50%;border:3px solid #0f2d5a;display:none;object-fit:cover;margin-top:8px">
</div>
<input id="cNameBn" oninput="autoSaveCollege()" placeholder="১. কলেজ নাম বাংলা - মমতাজ উদ্দীন...">
<input id="cNameEn" oninput="autoSaveCollege()" placeholder="২. কলেজ নাম ইংরেজি - MOMTAZ UDDIN...">
<input id="cEIIN" oninput="autoSaveCollege()" placeholder="৩. EIIN - 132332">
<input id="cIns" oninput="autoSaveCollege()" placeholder="৪. Ins Code - 50017">
<input id="cSlogan" oninput="autoSaveCollege()" placeholder="৫. স্লোগান / ঠিকানা">
<p id="saveStatus" style="color:green;font-weight:bold;text-align:center;margin:4px 0;height:18px"></p>
<hr>
<select id="loginClass"><option value="">শ্রেণি নির্বাচন</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>একাদশ</option><option>দ্বাদশ</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড 1234">
<button onclick="doLogin()" style="width:100%;background:#ffcc00">প্রবেশ করুন</button>
</div>
</div>

<!-- ২য় পাতা - হোম -->
<div id="firstPage" class="page">
<div class="header">
<img id="headerLogo" style="width:80px;height:80px;border-radius:50%;background:white;border:3px solid gold;object-fit:cover;display:none;margin:0 auto 8px">
<h2 id="headerBn" style="margin:0;font-size:18px"></h2>
<h3 id="headerEn" style="margin:2px 0;font-size:12px;opacity:.9"></h3>
<div style="display:flex;justify-content:center;gap:15px;font-size:11px"><span id="headerEIIN"></span><span id="headerIns"></span></div>
<small id="headerSlogan"></small>
<p style="margin-top:8px">শ্রেণী: <span id="showClass"></span></p>
</div>
<div class="card"><h3>📊 আজকের হাজিরা</h3><p>মোট: <span id="cAll">0</span> | উপস্থিত: <span id="cPresent">0</span> | অনুপস্থিত: <span id="cAbsent">0</span></p>
<button onclick="goPage(3)" style="width:100%;background:#0f2d5a;color:white">📋 ৩য় পাতায় যান (হাজিরা+ফলাফল)</button>
<button onclick="location.reload()" style="width:100%;background:#eee;margin-top:8px">🚪 লগআউট</button>
</div>
<div class="card">
<button onclick="addForm.style.display=addForm.style.display=='none'?'block':'none'" style="width:100%;background:#16a34a;color:white">➕ ছাত্র যোগ করুন</button>
<div id="addForm" style="display:none;margin-top:10px">
<input id="sName" placeholder="নাম"><input id="sRoll" placeholder="রোল"><input id="sMobile" placeholder="মোবাইল">
<div style="display:flex;gap:8px"><button onclick="addStudent()" style="flex:1;background:#16a34a;color:white">সেভ</button><button onclick="addForm.style.display='none'" style="flex:1;background:#ccc">বন্ধ</button></div>
</div>
</div>
</div>

<!-- ৩য় পাতা - আসল কাজ (২য় পাতার হেডার অটো আসবে) -->
<div id="thirdPage" class="page">
<div class="header">
<button onclick="goPage(1)" style="background:white;color:#0f2d5a;padding:6px 12px;float:left">⬅️ হোম</button>
<div style="clear:both"></div>
<img id="headerLogo3" style="width:80px;height:80px;border-radius:50%;background:white;border:3px solid gold;object-fit:cover;display:none;margin:0 auto 8px">
<h2 id="headerBn3" style="margin:0;font-size:16px"></h2>
<h3 id="headerEn3" style="margin:2px 0;font-size:11px"></h3>
<div style="display:flex;justify-content:center;gap:15px;font-size:11px"><span id="headerEIIN3"></span><span id="headerIns3"></span></div>
<small id="headerSlogan3"></small>
</div>
<div class="card" style="padding:5px"><div class="filter-tabs">
<button id="tabAll" style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><span id="cAll2">0</span></button>
<button id="tabPresent" style="background:#16a34a;color:white" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent2">0</span></button>
<button id="tabAbsent" style="background:#ef4444;color:white" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent2">0</span></button>
<button id="tabMonthly" style="background:#2563eb;color:white" onclick="filterList('monthly')">📅 মাসিক ১-৩০</button>
<button id="tabResult" style="background:#7c3aed;color:white" onclick="filterList('result')">🏆 ফলাফল ১৩</button>
</div></div>
<div id="studentList"></div>
<div id="monthlyDiv" class="card" style="display:none"></div>
<div id="monthlyDiv2" class="card" style="display:none"></div>
<div id="resultDiv" class="card" style="display:none"></div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('students9')||'[]');
let attendance=JSON.parse(localStorage.getItem('att9')||'{}');
let attHistory=JSON.parse(localStorage.getItem('attHistory9')||'{}');
let results=JSON.parse(localStorage.getItem('results9')||'{}');
let subNames=JSON.parse(localStorage.getItem('subNames9')||'["বিষয় ১","বিষয় ২","বিষয় ৩","বিষয় ৪","বিষয় ৫","বিষয় ৬","বিষয় ৭","বিষয় ৮","বিষয় ৯","বিষয় ১০","বিষয় ১১","বিষয় ১২","বিষয় ১৩"]');
let currentFilter='all';
function getTodayKey(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');}
function autoSaveCollege(){
  let prevLogo=JSON.parse(localStorage.getItem('collegeInfo')||'{}').logo||"";
  let info={nameBn:cNameBn.value.trim(),nameEn:cNameEn.value.trim(),eiin:cEIIN.value.trim(),ins:cIns.value.trim(),slogan:cSlogan.value.trim(),logo:prevLogo};
  localStorage.setItem('collegeInfo',JSON.stringify(info)); applyCollegeHeader();
  saveStatus.innerText="✅ অটো সেভ হয়েছে"; setTimeout(()=>saveStatus.innerText="",1500);
}
function uploadLogo(input){
  let file=input.files[0]; if(!file) return;
  let reader=new FileReader();
  reader.onload=function(e){
    let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}'); info.logo=e.target.result;
    localStorage.setItem('collegeInfo',JSON.stringify(info));
    previewLogo.src=e.target.result; previewLogo.style.display='inline-block';
    autoSaveCollege();
  }; reader.readAsDataURL(file);
}
function applyCollegeHeader(){
  let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');
  document.querySelectorAll('#headerBn,#headerBn3').forEach(el=>el.innerText=info.nameBn||"কলেজ নাম লিখুন");
  document.querySelectorAll('#headerEn,#headerEn3').forEach(el=>el.innerText=info.nameEn||"COLLEGE NAME");
  document.querySelectorAll('#headerEIIN,#headerEIIN3').forEach(el=>el.innerText=info.eiin?"EIIN: "+info.eiin:"");
  document.querySelectorAll('#headerIns,#headerIns3').forEach(el=>el.innerText=info.ins?"Ins Code: "+info.ins:"");
  document.querySelectorAll('#headerSlogan,#headerSlogan3').forEach(el=>el.innerText=info.slogan||"");
  document.querySelectorAll('#headerLogo,#headerLogo3').forEach(el=>{if(info.logo){el.src=info.logo;el.style.display='block';}});
  if(info.nameBn) cNameBn.value=info.nameBn; if(info.nameEn) cNameEn.value=info.nameEn;
  if(info.eiin) cEIIN.value=info.eiin; if(info.ins) cIns.value=info.ins; if(info.slogan) cSlogan.value=info.slogan;
  let prev=document.getElementById('previewLogo'); if(prev && info.logo){prev.src=info.logo;prev.style.display='inline-block';}
}
window.onload=applyCollegeHeader;
function doLogin(){
  autoSaveCollege();
  let c=loginClass.value,p=loginPass.value; if(!c) return alert('শ্রেণি সিলেক্ট করুন'); if(p!='1234') return alert('পাসওয়ার্ড 1234');
  showClass.innerText=c; loginPage.style.display='none'; firstPage.classList.add('active'); updateCounts(); render();
}
function goPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); if(n==1) firstPage.classList.add('active'); if(n==3){thirdPage.classList.add('active'); render();}}
function addStudent(){let n=sName.value.trim(),r=sRoll.value.trim(),m=sMobile.value.trim(); if(!n||!r) return alert('নাম রোল দিন'); students.push({name:n,roll:r,mobile:m}); localStorage.setItem('students9',JSON.stringify(students)); sName.value='';sRoll.value='';sMobile.value=''; addForm.style.display='none'; updateCounts(); render();}
function deleteS(i){if(confirm('মুছবেন?')){students.splice(i,1); localStorage.setItem('students9',JSON.stringify(students)); updateCounts(); render();}}
function editS(i){let s=students[i]; let n=prompt('নাম:',s.name); if(n===null) return; let r=prompt('রোল:',s.roll); let m=prompt('মোবাইল:',s.mobile); students[i]={name:n,roll:r,mobile:m}; localStorage.setItem('students9',JSON.stringify(students)); render();}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent'; let today=getTodayKey(); if(!attHistory[today]) attHistory[today]={}; attHistory[today][i]=isP?'present':'absent'; localStorage.setItem('att9',JSON.stringify(attendance)); localStorage.setItem('attHistory9',JSON.stringify(attHistory)); render(); updateCounts();}
function updateCounts(){let t=students.length,p=Object.values(attendance).filter(v=>v=='present').length,a=Object.values(attendance).filter(v=>v=='absent').length; cAll.innerText=t; cPresent.innerText=p; cAbsent.innerText=a; if(cAll2){cAll2.innerText=t;cPresent2.innerText=p;cAbsent2.innerText=a;}}
function render(){let html='',list=students.map((s,i)=>({s,i})); if(currentFilter=='present') list=list.filter(x=>attendance[x.i]=='present'); if(currentFilter=='absent') list=list.filter(x=>attendance[x.i]=='absent'); list.forEach(({s,i})=>{html+=`<div class="student-row"><div><b>${i+1}. ${s.name}</b> (${s.roll})<br><small>${s.mobile||''}</small></div><div style="display:flex;gap:4px"><button onclick="toggleAtt(${i},true)" style="background:${attendance[i]=='present'?'#16a34a':'#ddd'};color:${attendance[i]=='present'?'white':'black'}">P</button><button onclick="toggleAtt(${i},false)" style="background:${attendance[i]=='absent'?'#ef4444':'#ddd'};color:${attendance[i]=='absent'?'white':'black'}">A</button><button onclick="editS(${i})" style="background:#eee">✏️</button><button onclick="deleteS(${i})" style="background:#fee">🗑️</button></div></div>`;}); studentList.innerHTML=html;}
function filterList(type){currentFilter=type; document.querySelectorAll('.filter-tabs button').forEach(b=>b.classList.remove('btn-active')); let el=document.getElementById('tab'+type.charAt(0).toUpperCase()+type.slice(1)); if(el) el.classList.add('btn-active'); studentList.style.display='none'; monthlyDiv.style.display='none'; monthlyDiv2.style.display='none'; resultDiv.style.display='none'; if(type=='monthly'){monthlyDiv.style.display='block';renderMonthly3();} else if(type=='result'){resultDiv.style.display='block';renderResult();} else{studentList.style.display='block';render();}}
function renderMonthly3(){let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'}),year=new Date().getFullYear(),month=new Date().getMonth(),days=new Date(year,month+1,0).getDate(); let html=`<h4>📅 মাসিক হাজিরা - ${monthName} (১-${days})</h4><div style="overflow:auto"><table border="1" cellpadding="4" style="border-collapse:collapse;font-size:10px;min-width:700px"><tr><th style="position:sticky;left:0;background:white">নাম (রোল)</th>`; for(let d=1;d<=days;d++) html+=`<th>${d}</th>`; html+=`<th>মোট P</th></tr>`; students.forEach((s,idx)=>{let totalP=0; html+=`<tr><td style="position:sticky;left:0;background:white"><b>${s.name}</b> (${s.roll})</td>`; for(let d=1;d<=days;d++){let key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; let st=attHistory[key]?attHistory[key][idx]:(key==getTodayKey()?attendance[idx]:null); let txt='-',col='#999'; if(st=='present'){txt='P';col='green';totalP++;} if(st=='absent'){txt='A';col='red';} html+=`<td style="color:${col};text-align:center;font-weight:bold">${txt}</td>`;} html+=`<td style="color:green;font-weight:bold">${totalP}</td></tr>`;}); html+=`</table></div><button onclick="monthlyReport2()" style="margin-top:10px;width:100%;background:#2563eb;color:white">📊 রিপোর্ট ও Excel</button>`; monthlyDiv.innerHTML=html;}
function monthlyReport2(){let div=monthlyDiv2; div.style.display='block'; let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'}),year=new Date().getFullYear(),month=new Date().getMonth(),days=new Date(year,month+1,0).getDate(); let html=`<h4>📊 রিপোর্ট - ${monthName}</h4><div style="overflow:auto"><table border="1" cellpadding="4" style="border-collapse:collapse;font-size:10px"><tr><th>রোল</th><th>নাম</th>`; for(let d=1;d<=days;d++) html+=`<th>${d}</th>`; html+=`</tr>`; students.forEach((s,idx)=>{html+=`<tr><td>${s.roll}</td><td>${s.name}</td>`; for(let d=1;d<=days;d++){let key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; let st=attHistory[key]?attHistory[key][idx]:(key==getTodayKey()?attendance[idx]:null); html+=`<td style="color:${st=='present'?'green':st=='absent'?'red':'#999'}">${st=='present'?'P':st=='absent'?'A':'-'}</td>`;} html+=`</tr>`;}); html+=`</table></div><br><button onclick="exportExcelMonthly()" style="width:100%;background:#16a34a;color:white">⬇️ মাসিক Excel</button>`; div.innerHTML=html; div.scrollIntoView({behavior:'smooth'});}
function exportExcelMonthly(){let monthName=new Date().toLocaleString('bn-BD',{month:'long',year:'numeric'}),year=new Date().getFullYear(),month=new Date().getMonth(),days=new Date(year,month+1,0).getDate(); let data=[]; students.forEach((s,idx)=>{let row={মাস:monthName,নাম:s.name,রোল:s.roll}; let totalP=0; for(let d=1;d<=days;d++){let key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; let st=attHistory[key]?attHistory[key][idx]:(key==getTodayKey()?attendance[idx]:null); row[d+" তারিখ"]=st=='present'?'P':st=='absent'?'A':'-'; if(st=='present') totalP++;} row["মোট"]=totalP; data.push(row);}); let ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,monthName); XLSX.writeFile(wb,`Monthly_${monthName}.xlsx`);}
function renderResult(){let html=`<h4>🏆 ফলাফল - ১৩ বিষয় (নাম নিজে লিখুন, লিখলেই অটো সেভ)</h4><div style="overflow:auto"><table border="1" cellpadding="3" style="border-collapse:collapse;font-size:10px;min-width:1100px"><tr style="background:yellow"><th>ক্রমিক</th><th>নাম</th><th>রোল</th>`; for(let i=0;i<13;i++) html+=`<th><input value="${subNames[i]}" onchange="saveSubName(${i},this.value)" style="width:60px;border:none;background:yellow;font-weight:bold;text-align:center"></th>`; html+=`<th style="background:#a7f3d0">মোট</th><th style="background:#a7f3d0">GPA</th></tr>`; students.forEach((s,idx)=>{let r=results[idx]||{}; html+=`<tr><td>${idx+1}</td><td>${s.name}</td><td>${s.roll}</td>`; for(let i=0;i<13;i++){let v=r['s'+i]||''; html+=`<td><input type="number" value="${v}" oninput="saveResult(${idx},${i},this.value)" style="width:50px;text-align:center"></td>`;} let total=0; for(let i=0;i<13;i++) total+=parseInt(r['s'+i]||0); let avg=total/13; let gpa=avg>=80?5:avg>=70?4:avg>=60?3.5:avg>=50?3:avg>=40?2:0; html+=`<td style="background:#ecfdf5;font-weight:bold;text-align:center">${total}</td><td style="background:#ecfdf5;font-weight:bold;text-align:center">${gpa.toFixed(2)}</td></tr>`;}); html+=`</table></div><button onclick="exportResultExcel()" style="margin-top:10px;width:100%;background:#7c3aed;color:white">⬇️ ফলাফল Excel</button>`; resultDiv.innerHTML=html;}
function saveSubName(i,val){subNames[i]=val; localStorage.setItem('subNames9',JSON.stringify(subNames));}
function saveResult(stuIdx,subIdx,val){if(!results[stuIdx]) results[stuIdx]={}; results[stuIdx]['s'+subIdx]=val; localStorage.setItem('results9',JSON.stringify(results)); renderResult();}
function exportResultExcel(){let data=[]; students.forEach((s,idx)=>{let r=results[idx]||{}; let row={ক্রমিক:idx+1,নাম:s.name,রোল:s.roll}; let total=0; for(let i=0;i<13;i++){let name=subNames[i]||`বিষয় ${i+1}`; let v=parseInt(r['s'+i]||0); row[name]=v; total+=v;} let avg=total/13; let gpa=avg>=80?5:avg>=70?4:avg>=60?3.5:avg>=50?3:avg>=40?2:0; row["মোট"]=total; row["GPA"]=gpa.toFixed(2); data.push(row);}); let ws=XLSX.utils.json_to_sheet(data),wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"ফলাফল"); XLSX.writeFile(wb,`Result_13_Subject.xlsx`);}
</script>
</body>
</html>
