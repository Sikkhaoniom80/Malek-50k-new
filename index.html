<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek 50K - Momotaj Uddin College</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
body{background:#0a2342;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;box-shadow:0 0 25px rgba(255,215,0,.5);margin-top:10px}
.card{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:16px;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.card h2{text-align:center;font-size:27px;color:#111}
.sub{text-align:center;color:#6b7280;font-size:13px;font-weight:700;letter-spacing:1px;margin:4px 0 16px}
select,input,textarea{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #d1d5db;font-size:16px;margin:7px 0;outline:none;background:white}
.btn-login{width:100%;padding:14px;border-radius:14px;border:none;background:#0f2d5a;color:white;font-size:16px;font-weight:700;margin-top:8px;cursor:pointer}
#main{display:none;background:#eef2ff;min-height:100vh;width:100%;position:fixed;top:0;left:0;z-index:9999;padding:12px;overflow:auto;color:#111}
.m-input{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #ccc;background:white;font-size:15px}
.b{width:100%;padding:12px;border-radius:10px;border:none;margin:5px 0;font-weight:bold;cursor:pointer}
.b-dark{background:#0a2342;color:white}.b-purple{background:#7c5cff;color:white}.b-blue{background:#0ea5e9;color:white}.b-black{background:#333;color:white}.b-green{background:#16a34a;color:white}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.row button{flex:1;min-width:90px;padding:11px;border-radius:8px;border:none;color:white;font-weight:bold;cursor:pointer}
.bp{background:#16a34a}.ba{background:#ef4444}.bl{background:#f59e0b}
table{width:100%;background:white;border-radius:12px;margin-top:12px;border-collapse:collapse;overflow:hidden}
th,td{padding:9px;text-align:center;border-bottom:1px solid #eee;font-size:13px}
.circle{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:bold;margin:2px;border:none;cursor:pointer}
.p{background:#16a34a;color:white;border:2px solid #000}.a{background:#ef4444;color:white;border:2px solid #000}.l{background:#f59e0b;color:white;border:2px solid #000}.inactive{background:#e5e7eb;color:#666;border:none}
.edit{width:38px;height:32px;border:none;border-radius:6px;margin:2px;cursor:pointer}.e-edit{background:#fde047}.e-del{background:#fecaca}
.broadcast{background:white;border-radius:14px;padding:12px;margin-top:14px;border:2px dashed #7c5cff}
.college{background:#0a2342;color:#ffd700;padding:12px;border-radius:12px;text-align:center;font-size:16px;font-weight:700;margin-bottom:10px;border:2px solid #ffd700;line-height:1.4}
.stat{display:flex;gap:6px;margin:8px 0}.stat div{background:white;padding:10px;border-radius:10px;flex:1;text-align:center;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.1)}
</style>
</head>
<body>

<!-- প্রথম পাতা - আপনার ওই লোগোটা মামা, একটুও চেঞ্জ করি নাই -->
<img class="logo" src="Messenger_creation_6639862D-BADD-430F-AF32-6A63408727C3.jpeg" id="topLogo">

<div id="loginBox" class="card">
<h2>🔐 শিক্ষক লগইন</h2>
<div class="sub">MALEK ATTENDANCE</div>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>একাদশ শ্রেণি</option><option>দ্বাদশ শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button class="btn-login" onclick="doLogin()">✅ লগইন - MALEK ATTENDANCE</button>
</div>

<!-- ভিতরের প্যানেল -->
<div id="main">
<div class="college">🏫 মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ<br><small style="font-size:12px;color:#fff">MALEK 50K Attendance System</small></div>
<h3 style="text-align:center;color:#0a2342">📋 <span id="showClass"></span> - হাজিরা প্যানেল</h3>

<div style="background:white;border-radius:12px;padding:10px;margin-top:8px">
<div style="display:flex;gap:6px"><div style="flex:1"><label style="font-weight:bold;font-size:12px">📅 তারিখ:</label><input type="date" id="attDate" class="m-input"></div><div style="flex:1"><label style="font-weight:bold;font-size:12px">🔍 খুঁজুন:</label><input type="text" id="searchBox" class="m-input" placeholder="নাম/রোল..." onkeyup="render()"></div></div>
<div style="display:flex;gap:6px"><button class="b b-dark" style="flex:1;font-size:12px;padding:8px" onclick="showAllList()">📋 সব দেখুন</button><button class="b b-purple" style="flex:1;font-size:12px;padding:8px" onclick="hideList()">🙈 লিস্ট লুকান</button></div>
</div>

<input id="sname" class="m-input" placeholder="ছাত্রের নাম">
<div style="display:flex;gap:6px"><input id="sroll" class="m-input" placeholder="রোল" style="flex:1"><input id="smobile" class="m-input" placeholder="মোবাইল 01..." style="flex:1"></div>
<button class="b b-dark" onclick="addOne()">+ একজন যোগ</button>
<button class="b b-purple" onclick="bulk()">📋 আনলিমিটেড বাল্ক যোগ (২০০ জন)</button>

<div class="stat"><div>মোট<br><span id="totalCount">0</span></div><div style="color:green">P<br><span id="pCount">0</span></div><div style="color:red">A<br><span id="aCount">0</span></div><div style="color:orange">L<br><span id="lCount">0</span></div></div>

<div class="row"><button class="bp" onclick="allPresent()">✅ সবাই P</button><button class="ba" onclick="smsAll('A')">✉️ A SMS</button><button class="bl" onclick="smsAll('L')">✉️ L SMS</button></div>
<div class="row"><button class="bp" onclick="smsAll('P')">✉️ P SMS</button><button class="b-blue" onclick="downloadExcel()">📊 Excel</button><button class="b-black" onclick="window.print()">🖨️ প্রিন্ট</button></div>

<div class="broadcast">
<h4 style="text-align:center;color:#7c5cff">📢 নোটিশ - মমতাজ উদ্দিন কলেজ</h4>
<textarea id="broadMsg" rows="2" placeholder="যেমন: আগামীকাল কলেজ বন্ধ..."></textarea>
<button class="b b-green" onclick="sendBroadcast()">📤 সবাইকে পাঠান</button>
<button class="b b-purple" onclick="sendBroadType('A')">শুধু অনুপস্থিতদের পাঠান</button>
</div>

<table><thead><tr><th>শ্রেণি</th><th>রোল</th><th>নাম</th><th>P/A/L</th><th>Edit</th></tr></thead><tbody id="list"></tbody></table>
<button class="b b-dark" style="margin-top:14px;background:#555" onclick="location.reload()">🔙 লগআউট</button>
<div style="text-align:center;margin-top:10px;color:#666;font-size:11px">মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ © MALEK 50K</div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('malek50k_full')||'[]');
let showList=false;
function doLogin(){let c=loginClass.value,p=loginPass.value;if(!c){alert('শ্রেণি সিলেক্ট করুন মামা');return}if(p!=='1234'){alert('পাসওয়ার্ড 1234 মামা');return}showClass.innerText=c;loginBox.style.display='none';topLogo.style.display='none';main.style.display='block';document.getElementById('attDate').value=new Date().toISOString().split('T')[0];showList=false;render();}
function save(){localStorage.setItem('malek50k_full',JSON.stringify(students));render();}
function addOne(){let cls=loginClass.value,n=sname.value.trim(),r=sroll.value.trim(),m=smobile.value.trim();if(!n||!r){alert('নাম ও রোল দিন মামা');return}students.push({id:Date.now(),class:cls,roll:r,name:n,mobile:m,status:'P'});sname.value='';sroll.value='';smobile.value='';showList=true;save();}
function showAllList(){showList=true;render();}
function hideList(){showList=false;render();}
function render(){let tbody=document.getElementById('list');tbody.innerHTML='';let cls=loginClass.value;let q=document.getElementById('searchBox').value.toLowerCase();let filtered=students.filter(s=>s.class==cls);let searchFiltered=filtered.filter(s=>s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q));let p=0,a=0,l=0;filtered.forEach(s=>{if(s.status=='P')p++;else if(s.status=='A')a++;else if(s.status=='L')l++;});document.getElementById('totalCount').innerText=filtered.length;document.getElementById('pCount').innerText=p;document.getElementById('aCount').innerText=a;document.getElementById('lCount').innerText=l;if(!showList && q==''){tbody.innerHTML='<tr><td colspan="5" style="padding:25px;color:#6b7280">🔍 মামা সার্চ করুন বা <b>📋 সব দেখুন</b> বাটনে ক্লিক করুন<br><small>সাথে সাথে লিস্ট দেখাবে না</small></td></tr>';return}let toShow=q!=''?searchFiltered:filtered;if(toShow.length==0){tbody.innerHTML='<tr><td colspan="5" style="padding:20px;color:#666">কোনো ছাত্র পাওয়া যায়নি মামা</td></tr>';return}toShow.forEach(s=>{let idx=students.indexOf(s);tbody.innerHTML+=`<tr><td>${s.class}</td><td>${s.roll}</td><td><b>${s.name}</b><br><small>${s.mobile}</small></td><td><button class="circle ${s.status=='P'?'p':'inactive'}" onclick="students[${idx}].status='P';save()">P</button><button class="circle ${s.status=='A'?'a':'inactive'}" onclick="students[${idx}].status='A';save()">A</button><button class="circle ${s.status=='L'?'l':'inactive'}" onclick="students[${idx}].status='L';save()">L</button></td><td><button class="edit e-edit" onclick="editS(${idx})">✏️</button><button class="edit e-del" onclick="if(confirm('ডিলিট করবেন মামা?')){students.splice(${idx},1);save()}">🗑️</button></td></tr>`});}
function editS(i){let n=prompt('নাম:',students[i].name);if(n)students[i].name=n;let r=prompt('রোল:',students[i].roll);if(r)students[i].roll=r;let m=prompt('মোবাইল:',students[i].mobile);if(m!==null)students[i].mobile=m;save();}
function bulk(){let d=prompt('মামা প্রতি লাইনে: রোল,নাম,মোবাইল\nযেমন:\n101,রহিম,017...\n102,করিম,018...');if(!d)return;d.split('\n').forEach(l=>{let a=l.split(',');if(a[0]&&a[1])students.push({id:Date.now()+Math.random(),class:loginClass.value,roll:a[0].trim(),name:a[1].trim(),mobile:(a[2]||'').trim(),status:'P'})});showList=true;save();}
function allPresent(){let cls=loginClass.value;students.forEach(s=>{if(s.class==cls)s.status='P'});save();}
function smsAll(t){let cls=loginClass.value;let list=students.filter(s=>s.class==cls&&s.status==t);if(!list.length){alert(t+' কেউ নেই মামা');return}let msg=prompt(t+' এর জন্য মেসেজ - মমতাজ উদ্দিন কলেজ:',t=='P'?'আপনার সন্তান আজ উপস্থিত। - মমতাজ উদ্দিন কলেজ':t=='A'?'আপনার সন্তান আজ অনুপস্থিত। - মমতাজ উদ্দিন কলেজ':'আপনার সন্তান আজ ছুটিতে।');if(!msg)return;alert(list.length+' জনকে SMS পাঠানো হলো মামা:\n'+msg);}
function downloadExcel(){let cls=loginClass.value;let date=document.getElementById('attDate').value;let list=students.filter(s=>s.class==cls);let csv='College,Class,Roll,Name,Mobile,Status,Date\n'+list.map(s=>`"Momotaj Uddin Business Management College","${s.class}","${s.roll}","${s.name}","${s.mobile}","${s.status}","${date}"`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=cls+'_Momotaj_College_'+date+'.csv';a.click();}
function sendBroadcast(){let msg=broadMsg.value.trim();if(!msg){alert('মেসেজ লিখুন মামা');return}let cls=loginClass.value;let list=students.filter(s=>s.class==cls);if(!list.length){alert('এই শ্রেণিতে ছাত্র নেই মামা');return}alert('মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ থেকে\n'+list.length+' জনকে নোটিশ পাঠানো হলো:\n'+msg);broadMsg.value='';}
function sendBroadType(type){let msg=broadMsg.value.trim();if(!msg){alert('মেসেজ লিখুন মামা');return}let cls=loginClass.value;let list=students.filter(s=>s.class==cls&&s.status==type);if(!list.length){alert(type+' কেউ নেই');return}alert(list.length+' জন '+type+' ছাত্রকে মমতাজ উদ্দিন কলেজ থেকে পাঠানো হলো:\n'+msg);}
</script>
</body>
</html>
