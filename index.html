<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malek 50K - 3 Page</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
#loginWrapper{width:100%;display:flex;flex-direction:column;align-items:center}
.edit-box{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:15px;margin-top:12px;text-align:center}
.card-login{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:12px}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.header{background:#0f3d2e;color:#fff;padding:15px 15px 45px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:#fff;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.college-pad{background:#fff;border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;width:100%}
.college-pad img{width:56px;height:56px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover}
.pad-bn{font-size:12px;font-weight:700;color:#0f2d5a}.pad-en{font-size:10px;font-weight:700;color:#c00}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:700}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:#fff;font-weight:700}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0}.filter-tabs button{flex:1;padding:10px;border:none;border-radius:10px;font-weight:700}
#studentList{display:none}#studentList.show{display:block}
</style>
</head>
<body>

<!-- পাতা ১ : এডিট + লগইন -->
<div id="loginWrapper">
<div class="edit-box">
<img id="boxLogo" style="width:80px;height:80px;border-radius:50%;border:3px solid #ffd700" src="https://via.placeholder.com/80"><br>
<label style="color:blue;font-size:13px">লোগো চেঞ্জ<input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></label>
<input id="boxNameBn" placeholder="প্রতিষ্ঠানের নাম" style="text-align:center;font-weight:700" oninput="saveBox()">
<input id="boxNameEn" placeholder="English Name" style="text-align:center" oninput="saveBox()">
<div style="display:flex;gap:6px"><input id="boxEIIN" placeholder="EIIN" oninput="saveBox()"><input id="boxIns" placeholder="Code" oninput="saveBox()"></div>
<div id="boxStatus" style="font-size:12px;color:green"></div>
</div>
<div class="card-login"><h2 style="text-align:center">🔐 শিক্ষক লগইন</h2>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button onclick="doLogin()" style="width:100%;padding:14px;background:#0f2d5a;color:#fff;border:none;border-radius:14px;font-weight:700">🔐 লগইন করুন</button></div>
</div>

<!-- পাতা ২ : ড্যাশবোর্ড -->
<div id="firstPage" class="page">
<div class="header"><div class="college-pad"><img id="boxLogo2"><div><div id="boxNameBn2" class="pad-bn"></div><div id="boxNameEn2" class="pad-en"></div><div style="font-size:10px;color:#333">EIIN:<span id="boxEIIN2"></span> | Code:<span id="boxIns2"></span></div></div></div><p>শ্রেণী: <span id="showClass"></span></p></div>
<div class="card">
<button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="toggleMonthlyFirst()" style="width:100%;margin-top:10px;padding:14px;background:#fff;border:2px dashed #2563eb;border-radius:12px;font-weight:700;color:#2563eb">📋 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDivFirst" style="display:none;overflow:auto;margin-top:10px"></div>
<h3>📢 নোটিশ</h3><input id="noticeText" placeholder="নোটিশ লিখুন...">
<h3>💬 SMS</h3><div class="sms-btns"><button class="green" onclick="sendDirectSMS('present')">✅ উপস্থিত</button><button class="orange" onclick="sendDirectSMS('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendDirectSMS('notice')">📢 নোটিশ</button></div>
<button onclick="shareReport()" style="width:100%;margin-top:10px;padding:14px;background:#25D366;color:#fff;border:none;border-radius:12px;font-weight:700">📊 WhatsApp রিপোর্ট</button>
<button onclick="location.reload()" style="width:100%;margin-top:10px;padding:10px;background:#555;color:#fff;border:none;border-radius:10px">⬅️ লগআউট</button>
</div></div>

<!-- পাতা ৩ : শিক্ষার্থী -->
<div id="secondPage" class="page">
<div class="header"><div class="college-pad"><img id="boxLogo3"><div><div id="boxNameBn3" class="pad-bn"></div><div id="boxNameEn3" class="pad-en"></div><div style="font-size:10px;color:#333"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div></div></div>
<h2>শিক্ষার্থীর তালিকা</h2><button onclick="goFirst()" style="background:#fff;border:none;padding:6px 15px;border-radius:20px;font-weight:700">⬅️ ড্যাশবোর্ড</button></div>
<div class="card">
<button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:700">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" style="display:none"><input id="sName" placeholder="নাম"><input id="sRoll" placeholder="রোল"><input id="sMobile" placeholder="মোবাইল"><button onclick="addStudent()" style="width:100%;padding:12px;background:#16a34a;color:#fff;border:none;border-radius:8px">✅ যোগ</button></div>
<div class="filter-tabs"><button style="background:#ffcc00" onclick="filterList('all')">সবাই<br><span id="cAll">0</span></button><button style="background:#16a34a;color:#fff" onclick="filterList('present')">উপস্থিত<br><span id="cPresent">0</span></button><button style="background:#ef4444;color:#fff" onclick="filterList('absent')">অনুপস্থিত<br><span id="cAbsent">0</span></button><button style="background:#7c3aed;color:#fff" onclick="filterList('result')">ফলাফল</button></div>
<div id="studentList"></div><div id="resultDiv" style="display:none;overflow:auto"></div>
</div></div>

<script>
let currentClass="",students=[],attendance={},attMonthly={},results={},subNames=Array(13).fill().map((_,i)=>"বিষয় "+(i+1)),currentFilter='none';
function key(n){return n+'_'+currentClass}
function loadClassData(){students=JSON.parse(localStorage.getItem(key('students'))||'[]');attendance=JSON.parse(localStorage.getItem(key('att'))||'{}');attMonthly=JSON.parse(localStorage.getItem(key('attMonthly'))||'{}');results=JSON.parse(localStorage.getItem(key('results'))||'{}')}
function saveAll(){localStorage.setItem(key('students'),JSON.stringify(students));localStorage.setItem(key('att'),JSON.stringify(attendance));localStorage.setItem(key('attMonthly'),JSON.stringify(attMonthly));localStorage.setItem(key('results'),JSON.stringify(results))}
function saveBox(){let i={nameBn:boxNameBn.value,nameEn:boxNameEn.value,eiin:boxEIIN.value,ins:boxIns.value,logo:boxLogo.src};localStorage.setItem('collegeInfo',JSON.stringify(i));boxStatus.innerText="✅ অটো সেভ";setTimeout(()=>boxStatus.innerText="",1000);loadBoxDisplay()}
function changeBoxLogo(i){let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox()};r.readAsDataURL(i.files[0])}
function loadBox(){let i=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(i.nameBn)boxNameBn.value=i.nameBn;if(i.nameEn)boxNameEn.value=i.nameEn;if(i.eiin)boxEIIN.value=i.eiin;if(i.ins)boxIns.value=i.ins;if(i.logo)boxLogo.src=i.logo;loadBoxDisplay()}
function loadBoxDisplay(){let i=JSON.parse(localStorage.getItem('collegeInfo')||'{}');boxNameBn2.innerText=i.nameBn||'';boxNameEn2.innerText=i.nameEn||'';boxEIIN2.innerText=i.eiin||'';boxIns2.innerText=i.ins||'';boxLogo2.src=i.logo||'';boxNameBn3.innerText=i.nameBn||'';boxNameEn3.innerText=i.nameEn||'';boxEIIN3.innerText="EIIN: "+(i.eiin||'');boxIns3.innerText="Code: "+(i.ins||'');boxLogo3.src=i.logo||''}
function doLogin(){if(!loginClass.value)return alert('শ্রেণি দিন');if(loginPass.value!='1234')return alert('1234 দিন');currentClass=loginClass.value;loadClassData();showClass.innerText=currentClass;loginWrapper.style.display='none';firstPage.classList.add('active');loadBoxDisplay()}
function openStudentPage(){firstPage.classList.remove('active');secondPage.classList.add('active');loadBoxDisplay();filterList('all')}
function goFirst(){secondPage.classList.remove('active');firstPage.classList.add('active')}
function toggleAdd(){addForm.style.display=addForm.style.display=='none'?'block':'none'}
function addStudent(){students.push({name:sName.value,roll:sRoll.value,mobile:sMobile.value});saveAll();addForm.style.display='none';filterList('all')}
function toggleAtt(i,v){attendance[i]=v?'present':'absent';saveAll();render()}
function updateCounts(){cAll.innerText=students.length;let p=students.filter((_,i)=>attendance[i]!='absent').length;cPresent.innerText=p;cAbsent.innerText=students.length-p}
function filterList(t){currentFilter=t;studentList.style.display='none';resultDiv.style.display='none';studentList.classList.remove('show');if(t=='result'){resultDiv.style.display='block';renderResult()}else{studentList.style.display='block';studentList.classList.add('show');render()}}
function render(){studentList.innerHTML='';students.forEach((s,i)=>{if(currentFilter=='present'&&attendance[i]=='absent')return;if(currentFilter=='absent'&&attendance[i]!='absent')return;studentList.innerHTML+=`<div class="student-row"><div><input type="checkbox" ${attendance[i]=='absent'?'':'checked'} onchange="toggleAtt(${i},this.checked)"> <b>${s.name}</b></div><button onclick="students.splice(${i},1);saveAll();render()">🗑️</button></div>`});updateCounts()}
function getMonthInfo(){let d=new Date();return{monthName:d.toLocaleString('bn-BD',{month:'long',year:'numeric'}),days:new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),key:d.getFullYear()+'-'+d.getMonth(),today:d.getDate()}}
function toggleMonthlyFirst(){let d=document.getElementById('monthlyDivFirst');d.style.display=d.style.display=='block'?'none':'block';if(d.style.display=='block'){let {days,key:mk,today,monthName}=getMonthInfo();let h=`<table border=1 cellpadding=4 style="border-collapse:collapse;font-size:11px"><tr><th>নাম</th>`;for(let x=1;x<=days;x++)h+=`<th>${x}</th>`;h+=`</tr>`;students.forEach((s,idx)=>{h+=`<tr><td>${s.name}</td>`;for(let x=1;x<=days;x++){let v=(attMonthly[mk]&&attMonthly[mk][idx]&&attMonthly[mk][idx][x])||'-';h+=`<td>${v}</td>`}h+=`</tr>`});h+=`</table>`;d.innerHTML=h}}
function renderResult(){resultDiv.innerHTML='ফলাফল এখানে - আগের কোডের মতো';}
function sendDirectSMS(t){alert('SMS: '+t)}
function shareReport(){let m=students.map(s=>s.name).join('\n');window.open('https://wa.me/?text='+encodeURIComponent(m))}
window.onload=loadBox;
</script>
</body>
</html>
