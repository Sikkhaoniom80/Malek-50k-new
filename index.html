<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>প্রাথমিক বিদ্যালয় হাজিরা - Index</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0;min-height:80px}
.main-banner img{width:100%;display:block}
.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:20px;text-align:center;border:3px solid #ffcc00}
.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}
.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;color:#0d5bff;margin-top:12px;cursor:pointer;text-align:center}
.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}
.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}
.fifty{display:flex;gap:6px}.fifty>*{flex:1}
#logoPreview{width:95px;height:95px;border-radius:50%;border:3px solid #ffcc00;object-fit:contain;background:#fff;display:none;margin:0 auto}
</style></head><body>
<div class="main-banner"><img src="IMG-20261005-WA0019(3).jpg" onerror="this.parentElement.innerHTML='<div style=color:#ffcc00;padding:25px;text-align:center>🏫 প্রাথমিক বিদ্যালয়</div>'"></div>
<div class="green-box"><span>প্রাথমিক বিদ্যালয় হাজিরা</span></div>
<button class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')">🏫 প্রতিষ্ঠান ফরম ▼</button>
<div id="formBox" class="card hidden" style="text-align:center">
<img id="logoPreview"><label for="logoInput" style="background:#ffcc00;padding:7px 18px;border-radius:20px;cursor:pointer;font-weight:700;display:inline-block;margin-top:8px">🖼️ লোগো চেঞ্জ ৯৫x৯৫ গোল</label><input type="file" id="logoInput" accept="image/*" style="position:absolute;left:-9999px">
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="enName" placeholder="English Name"><input id="address" placeholder="ঠিকানা"><div class="fifty"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div class="fifty"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>
<button class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')">🔐 লগইন ▼</button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div class="fifty"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option></select><select id="section"><option>ক</option><option>খ</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>
<button class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')">🔒 তালিকা ▼</button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
<script>
let raw=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let map=new Map();raw.forEach(x=>{let k=(x.bnName||'').trim();if(k&&!map.has(k))map.set(k,x);});let insts=[...map.values()];localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));
let tempLogo=localStorage.getItem('takrim_temp_logo')||'';function refreshInstSelect(){document.getElementById('loginInst').innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>'<option value="'+i+'">'+x.bnName+'</option>').join('');}refreshInstSelect();
document.getElementById('logoInput').addEventListener('change',function(){if(!this.files[0])return;let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=600;c.height=600;let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);let s=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,600,600);tempLogo=c.toDataURL('image/png');let p=document.getElementById('logoPreview');p.src=tempLogo;p.style.display='block';localStorage.setItem('takrim_temp_logo',tempLogo);};img.src=e.target.result;};r.readAsDataURL(this.files[0]);});
function savePrimary(){let bn=document.getElementById('bnName').value.trim(),pass=document.getElementById('pass1').value.trim();if(!bn)return alert('প্রতিষ্ঠানের নাম দিন');if(!pass)return alert('পাসওয়ার্ড দিন');if(insts.some(x=>x.bnName.trim()===bn))return alert('❌ আগেই আছে');let o={bnName:bn,enName:document.getElementById('enName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:pass,logo:tempLogo||''};insts.push(o);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.setItem('takrim_temp_logo','');alert('✅ সেভ');location.reload();}
function primaryLogin(){let idx=document.getElementById('loginInst').value;if(idx==='')return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন';let ins=insts[idx];if(document.getElementById('loginPass').value!==ins.pass)return document.getElementById('loginMsg').textContent='❌ ভুল পাস';localStorage.setItem('takrim_session',JSON.stringify({inst:ins,cls:document.getElementById('cls').value,shift:document.getElementById('shift').value,section:document.getElementById('section').value}));window.location.href='dashboard.html';}
function openListSecure(){let a=prompt('এডমিন নাম'),p=prompt('পাসওয়ার্ড');if(a!=='malek'||p!=='takrim2022')return alert('ভুল এডমিন');document.getElementById('instList').innerHTML=insts.map((s,i)=>'<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><b>'+s.bnName+'</b><span style=color:red>'+s.pass+'</span></div>').join('');}
</script></body></html>
