<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malek 50K - Fixed Login</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;min-height:100vh;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.logo{width:360px;max-width:92%;height:110px;object-fit:contain;background:#fff;border-radius:18px;border:3px solid #ffd700;margin-top:10px;display:block}
.card-login{background:#fff;width:100%;max-width:380px;border-radius:24px;padding:26px 20px;margin-top:20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.card-login select,.card-login input{width:100%!important;padding:14px;border-radius:12px;border:1.5px solid #ccc;font-size:16px;margin:8px 0;display:block}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.hideBox{display:none;margin-top:10px;border:2px dashed #0f3d2e;border-radius:12px;padding:10px;background:#f8fafc;max-height:400px;overflow:auto}
#monthlyDivFirst{display:none} #studentList{display:none!important} #studentList.show{display:block!important} #resultDiv{display:none}
</style>
</head>
<body>

<img class="logo" id="topLogo" src="logo.jpg" alt="College Logo" onerror="this.src='https://i.postimg.cc/8sYpZ0p0/college-logo.png'; this.onerror=null;">

<div id="loginPage" class="card-login">
<h2 style="text-align:center;margin:0 0 15px">🔐 শিক্ষক লগইন</h2>
<select id="loginClass"><option value="">শ্রেণি সিলেক্ট করুন</option><option>১ম শ্রেণি</option><option>২য় শ্রেণি</option><option>৩য় শ্রেণি</option><option>৪র্থ শ্রেণি</option><option>৫ম শ্রেণি</option><option>৬ষ্ঠ শ্রেণি</option><option>৭ম শ্রেণি</option><option>৮ম শ্রেণি</option><option>৯ম শ্রেণি</option><option>১০ম শ্রেণি</option><option>একাদশ শ্রেণি</option><option>দ্বাদশ শ্রেণি</option></select>
<input id="loginPass" type="password" placeholder="পাসওয়ার্ড: 1234">
<button style="width:100%;padding:14px;border:none;border-radius:14px;background:#0f2d5a;color:white;font-weight:700;margin-top:12px;font-size:16px" onclick="doLogin()">🔐 লগইন করুন</button>
</div>

<div id="firstPage" class="page">
  <div class="header" style="padding:10px 10px 35px">
    <div class="college-pad"><div onclick="logoInput.click()" style="cursor:pointer;text-align:center;min-width:60px"><img id="boxLogo" src="https://via.placeholder.com/65"><div style="font-size:9px;color:blue">লোগো চেঞ্জ</div><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></div><div style="flex:1;overflow:hidden"><div id="boxNameBn" style="font-size:11.5px;font-weight:700;color:#0f2d5a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" contenteditable="true" onblur="saveBox()">মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div><div id="boxNameEn" style="font-size:9px;font-weight:700;color:#cc0000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" contenteditable="true" onblur="saveBox()">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div><div style="display:flex;gap:10px;margin-top:2px;font-size:10px;color:#333"><span>EIIN: <b><span id="boxEIIN" contenteditable="true" onblur="saveBox()">132332</span></b></span><span>Code: <b><span id="boxIns" contenteditable="true" onblur="saveBox()">50017</span></b></span></div></div></div>
    <p style="margin:8px 0 0;font-weight:700">শ্রেণী: <span id="showClass"></span></p>
  </div>
  <div class="card">
    <div style="border:2px solid #0a2342;border-radius:16px;padding:12px;margin-bottom:14px;background:#fffbe6">
      <h3 style="text-align:center;margin:0 0 10px">📊 ড্যাশবোর্ড</h3>
      <button onclick="toggleInstitute()" style="width:100%;padding:13px;background:#0f3d2e;color:white;border:none;border-radius:12px;font-weight:bold">🏫 ১। প্রতিষ্ঠানের তালিকা (হাইড)</button>
      <div id="instituteDiv" class="hideBox"></div>
      <div style="margin-top:12px;border:2px solid #0284c7;border-radius:14px;padding:10px">
        <p style="text-align:center;margin:0 0 8px;font-weight:700">২। লগইন / লগআউট স্ট্যাটাস</p>
        <div style="display:flex;gap:8px">
          <div style="flex:1;text-align:center;background:#dcfce7;border:2px solid #16a34a;border-radius:12px;padding:10px"><small>🟢 লগইন</small><br><b id="loginCount" style="font-size:22px">0</b></div>
          <div style="flex:1;text-align:center;background:#fee2e2;border:2px solid #dc2626;border-radius:12px;padding:10px"><small>🔴 লগআউট</small><br><b id="logoutCount" style="font-size:22px">0</b></div>
          <div style="flex:1;text-align:center;background:#e0f2fe;border:2px solid #0284c7;border-radius:12px;padding:10px"><small>🏫 মোট</small><br><b id="totalInst" style="font-size:22px">0</b></div>
        </div>
      </div>
    </div>
    <button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা দেখুন</button>
    <button onclick="toggleMonthlyFirst()" style="width:100%;margin-top:12px;padding:14px;background:#fff;border:2px dashed #2563eb;border-radius:12px;font-weight:bold;color:#2563eb">📅 মাসিক হাজিরা দেখুন</button>
    <div id="monthlyDivFirst" style="overflow:auto;margin-top:10px;border:2px dashed #2563eb;border-radius:12px;padding:10px;background:#f8fafc"></div>
    <button onclick="doLogout()" style="width:100%;margin-top:12px;padding:10px;background:#555;color:white;border:none;border-radius:10px">⬅️ লগআউট</button>
  </div>
</div>

<div id="secondPage" class="page">
  <div class="header" style="padding-bottom:20px"><div class="college-pad"><img id="boxLogo3"><div style="flex:1;overflow:hidden"><div id="boxNameBn3" style="font-size:11.5px;font-weight:700;color:#0f2d5a"></div><div id="boxNameEn3" style="font-size:9px;font-weight:700;color:#cc0000"></div><div style="font-size:10px;color:#333"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div></div></div><h2 style="margin:10px 0 0">শিক্ষার্থীর তালিকা</h2><div style="color:#ffcc00;font-size:13px;margin-top:6px;font-weight:700">শ্রেণী: <span id="showClass3"></span></div><button onclick="goFirst()" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
  <div class="card">
    <button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন</button>
    <div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a"><input type="text" id="sName" placeholder="নাম" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:5px 0"><input type="text" id="sRoll" placeholder="রোল" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:5px 0"><input type="text" id="sMobile" placeholder="মোবাইল" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:5px 0"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold">✅ যোগ</button><button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px">❌ বন্ধ</button></div></div>
    <div style="display:flex;gap:6px;margin:12px 0;flex-wrap:wrap"><button style="background:#ffcc00;flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold" onclick="filterList('all')">📋 সবাই<br><span id="cAll">0</span></button><button style="background:#16a34a;color:white;flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent">0</span></button><button style="background:#ef4444;color:white;flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent">0</span></button><button style="background:#7c3aed;color:white;flex:1;padding:10px;border:none;border-radius:10px;font-weight:bold" onclick="filterList('result')">🏆 ফলাফল</button></div>
    <div id="studentList"></div><div id="resultDiv"></div>
  </div>
</div>

<script>
let students=JSON.parse(localStorage.getItem('students9')||'[]');
let attendance=JSON.parse(localStorage.getItem('att9')||'{}');
let attMonthly=JSON.parse(localStorage.getItem('attMonthly9')||'{}');
let results=JSON.parse(localStorage.getItem('results9')||'{}');
let instituteList=JSON.parse(localStorage.getItem('instituteList')||'[]');
let currentFilter='all';
function getMonthInfo(){let d=new Date();return{monthName:d.toLocaleString('bn-BD',{month:'long',year:'numeric'}),days:new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),key:d.getFullYear()+'-'+d.getMonth(),today:d.getDate()}}
function saveBox(){let info={nameBn:boxNameBn.innerText.trim(),nameEn:boxNameEn.innerText.trim(),eiin:boxEIIN.innerText.trim(),ins:boxIns.innerText.trim(),logo:boxLogo.src};localStorage.setItem('collegeInfo',JSON.stringify(info));boxNameBn3.innerText=info.nameBn;boxNameEn3.innerText=info.nameEn;boxEIIN3.innerText="EIIN: "+info.eiin;boxIns3.innerText="Code: "+info.ins;boxLogo3.src=info.logo;}
function changeBoxLogo(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox();};r.readAsDataURL(f);}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(info.nameBn)boxNameBn.innerText=info.nameBn;if(info.nameEn)boxNameEn.innerText=info.nameEn;if(info.eiin)boxEIIN.innerText=info.eiin;if(info.ins)boxIns.innerText=info.ins;if(info.logo){boxLogo.src=info.logo;boxLogo3.src=info.logo;}boxNameBn3.innerText=info.nameBn||boxNameBn.innerText;boxNameEn3.innerText=info.nameEn||boxNameEn.innerText;boxEIIN3.innerText="EIIN: "+(info.eiin||boxEIIN.innerText);boxIns3.innerText="Code: "+(info.ins||boxIns.innerText);if(info.logo)boxLogo3.src=info.logo;}
function doLogin(){let c=loginClass.value,p=loginPass.value;if(!c)return alert('শ্রেণি সিলেক্ট করুন');if(p!='1234')return alert('পাসওয়ার্ড 1234');localStorage.setItem('savedClass',c);showClass.innerText=c;showClass3.innerText=c;loginPage.style.display='none';topLogo.style.display='none';firstPage.classList.add('active');document.body.style.background='#f0f2f5';loadBox();let colName=boxNameBn.innerText.trim();if(!instituteList.find(x=>x.name.trim()===colName)){instituteList.push({name:colName,status:'login'});localStorage.setItem('instituteList',JSON.stringify(instituteList));}updateDashboard();}
function doLogout(){if(instituteList.length>0){instituteList[instituteList.length-1].status='logout';localStorage.setItem('instituteList',JSON.stringify(instituteList));}location.reload();}
function updateDashboard(){let total=instituteList.length,login=instituteList.filter(x=>x.status==='login').length;document.getElementById('totalInst').innerText=total;document.getElementById('loginCount').innerText=login;document.getElementById('logoutCount').innerText=total-login;}
function toggleInstitute(){let d=document.getElementById('instituteDiv');d.style.display=d.style.display=='block'?'none':'block';if(d.style.display=='block'){if(instituteList.length==0){d.innerHTML='<p style="text-align:center">খালি</p>';return;}let h='<table border=1 cellpadding=8 style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#0f3d2e;color:#fff"><th>প্রতিষ্ঠান</th><th>স্ট্যাটাস</th></tr>';instituteList.forEach(x=>{let st=x.status==='login'?'<span style="color:green">🟢 লগইন</span>':'<span style="color:red">🔴 লগআউট</span>';h+='<tr><td>'+x.name+'</td><td style="text-align:center">'+st+'</td></tr>';});h+='</table>';d.innerHTML=h;}}
function openStudentPage(){firstPage.classList.remove('active');secondPage.classList.add('active');loadBox();updateCounts();}
function goFirst(){secondPage.classList.remove('active');firstPage.classList.add('active');updateDashboard();}
function toggleAdd(){let f=document.getElementById('addForm');f.style.display=f.style.display=='none'?'block':'none';}
function addStudent(){let n=sName.value.trim(),r=sRoll.value.trim(),m=sMobile.value.trim();if(!n||!r)return alert('নাম ও রোল দিন');students.push({name:n,roll:r,mobile:m});localStorage.setItem('students9',JSON.stringify(students));sName.value='';sRoll.value='';sMobile.value='';addForm.style.display='none';filterList('all');}
function filterList(type){currentFilter=type;let list=document.getElementById('studentList');list.style.display='block';list.classList.add('show');document.getElementById('resultDiv').style.display='none';render();}
function render(){let list=document.getElementById('studentList');list.innerHTML='';students.forEach((s,i)=>{let checked=attendance[i]=='absent'?'':'checked';list.innerHTML+=`<div style="display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee"><div><input type="checkbox" ${checked} onchange="attendance[${i}]=this.checked?'present':'absent';localStorage.setItem('att9',JSON.stringify(attendance));updateCounts();"> <b>${s.name}</b> (${s.roll})</div><div><button onclick="students.splice(${i},1);localStorage.setItem('students9',JSON.stringify(students));render();">🗑️</button></div></div>`;});updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});document.getElementById('cAll').innerText=students.length;document.getElementById('cPresent').innerText=p;document.getElementById('cAbsent').innerText=students.length-p;}
function toggleMonthlyFirst(){let d=document.getElementById('monthlyDivFirst');d.style.display=d.style.display=='block'?'none':'block';if(d.style.display=='block'){d.innerHTML='<p style="text-align:center">মাসিক হাজিরা লোড হচ্ছে...</p>';}}
window.onload=()=>{loadBox();updateDashboard();let saved=localStorage.getItem('savedClass');if(saved){showClass.innerText=saved;showClass3.innerText=saved;}};
</script>
</body>
</html>
