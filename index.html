<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>২য় পাতা - হাজিরা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
body{background:#eef2ff;min-height:100vh;padding:10px;padding-bottom:80px}
.college{background:#0a2342;color:#ffd700;padding:12px;border-radius:14px;text-align:center;font-weight:700;border:2px solid #ffd700;margin-bottom:8px}
.m-input{width:100%;padding:12px;border-radius:12px;border:1.5px solid #cbd5e1;margin:5px 0;background:white;font-size:15px}
#list{max-height:55vh;overflow-y:auto;border:2px solid #0a2342;border-radius:14px;padding:6px;background:#f8fafc}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin:10px 0}
.stat{background:white;padding:10px;border-radius:12px;text-align:center;border:2px solid #0a2342}.stat b{font-size:20px;display:block}
.student-card{display:flex;justify-content:space-between;align-items:center;background:white;padding:12px;border-radius:12px;margin:6px 0;border:1px solid #ddd}
.b{width:100%;padding:13px;border-radius:12px;border:none;color:white;font-weight:700;margin:5px 0;cursor:pointer}
.btn-p,.btn-a,.btn-l{width:42px;height:38px;border-radius:8px;border:none;color:white;font-weight:700}.btn-p{background:#16a34a}.btn-a{background:#ef4444}.btn-l{background:#f59e0b}
.active{outline:3px solid #000}.inactive{opacity:.35}
.sms-area{display:flex;gap:6px;margin-top:8px}.sms-area button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<div class="college">🏫 মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ<br><small style="color:#fff;font-size:11px" id="showClass">Digital Attendance</small></div>
<div style="display:flex;gap:6px"><div style="flex:1"><small>📅 তারিখ:</small><input type="date" id="attDate" class="m-input"></div><div style="flex:1"><small>🔍 খুঁজুন:</small><input type="text" id="searchBox" class="m-input" placeholder="নাম/রোল" onkeyup="render()"></div></div>
<div class="stats"><div class="stat"><b id="tTotal">0</b><small>মোট</small></div><div class="stat"><b id="tPresent" style="color:#16a34a">0</b><small>P</small></div><div class="stat"><b id="tAbsent" style="color:#ef4444">0</b><small>A</small></div><div class="stat"><b id="tLate" style="color:#f59e0b">0</b><small>L</small></div></div>

<div style="background:white;padding:14px;border-radius:14px;border:1px solid #ddd;margin:10px 0">
<b>📢 নোটিশ বোর্ড</b>
<input id="noticeText" class="m-input" placeholder="এখানে নোটিশ লিখুন...">
<div class="sms-area">
<button style="background:#16a34a;color:white" onclick="sendSMS('present')">Present SMS</button>
<button style="background:#ef4444;color:white" onclick="sendSMS('absent')">Absent SMS</button>
<button style="background:#eab308;color:black" onclick="sendSMS('notice')">Notice SMS</button>
</div>
</div>

<div id="list"></div>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="b" style="background:#0a2342;flex:1" onclick="location.href='third.html'">👥 তালিকা পরিচালনা (৩য় পাতা)</button>
<button class="b" style="background:#555;flex:1" onclick="location.href='index.html'">🔙 ১ম পাতা</button>
</div>

<script>
let students=JSON.parse(localStorage.getItem('malek_final_permanent')||'[]');
let attendance=JSON.parse(localStorage.getItem('malek_att_permanent')||'{}');
let cls=localStorage.getItem('selected_class')||'শ্রেণি';
document.getElementById('showClass').innerText=cls;
document.getElementById('attDate').value=new Date().toISOString().split('T')[0];
function getStatus(i,d){return (attendance[d]&&attendance[d][i])||''}
function render(){
 let q=document.getElementById('searchBox').value.toLowerCase();
 let date=document.getElementById('attDate').value;
 let all=students.map((s,i)=>({...s,idx:i})).filter(s=>s.class==cls);
 document.getElementById('tTotal').innerText=all.length;
 document.getElementById('tPresent').innerText=all.filter(s=>getStatus(s.idx,date)=='P').length;
 document.getElementById('tAbsent').innerText=all.filter(s=>getStatus(s.idx,date)=='A').length;
 document.getElementById('tLate').innerText=all.filter(s=>getStatus(s.idx,date)=='L').length;
 let div=document.getElementById('list'); div.innerHTML='';
 all.filter(s=>q==''||s.name.toLowerCase().includes(q)||s.roll.includes(q)).forEach(s=>{
  let st=getStatus(s.idx,date);
  div.innerHTML+=`<div class="student-card"><div><b>${s.name}</b><br><small>রোল:${s.roll} | ${s.mobile||''}</small></div><div style="display:flex;gap:4px"><button class="btn-p ${st=='P'?'active':'inactive'}" onclick="mark(${s.idx},'P')">P</button><button class="btn-a ${st=='A'?'active':'inactive'}" onclick="mark(${s.idx},'A')">A</button><button class="btn-l ${st=='L'?'active':'inactive'}" onclick="mark(${s.idx},'L')">L</button></div></div>`;
 });
}
function mark(i,s){let d=document.getElementById('attDate').value;if(!attendance[d])attendance[d]={};attendance[d][i]=s;localStorage.setItem('malek_att_permanent',JSON.stringify(attendance));render();}
function sendSMS(type){
 let notice=document.getElementById('noticeText').value.trim();
 let date=document.getElementById('attDate').value;
 let all=students.map((s,i)=>({...s,idx:i})).filter(s=>s.class==cls);
 let targets= type=='notice'? all : type=='present'? all.filter(s=>getStatus(s.idx,date)=='P') : all.filter(s=>getStatus(s.idx,date)=='A');
 if(targets.length==0) return alert('কেউ নেই');
 let numbers=targets.map(s=>(s.mobile||'').trim()).filter(m=>m.length>=11);
 if(numbers.length==0) return alert('মোবাইল নেই');
 let dateStr=new Date(date).toLocaleDateString('bn-BD');
 let msg= type=='present'? `আজ ${dateStr} তারিখে কলেজে উপস্থিত আছে।\n${notice}\n- মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ` : type=='absent'? `আজ ${dateStr} তারিখে কলেজে অনুপস্থিত।\n${notice}\n- মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ` : `📢 নোটিশ: ${notice}\nতারিখ: ${dateStr}\n- মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ`;
 window.location.href=`sms:${numbers.join(';')}?body=${encodeURIComponent(msg)}`;
}
document.getElementById('attDate').addEventListener('change',render);
render();
</script>
</body>
</html>
