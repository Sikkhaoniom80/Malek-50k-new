<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Form</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a2a5e;display:flex;justify-content:center;padding:12px;font-family:sans-serif}
.phone{width:100%;max-width:400px}
.top{background:#fff;border:3px solid #ffcc00;border-radius:16px;padding:8px;text-align:center;margin-bottom:12px}
.top img{width:100%;max-height:140px;object-fit:contain;border-radius:8px}
.card{background:#fff;border-radius:16px;padding:14px}
.title{font-weight:900;color:#0a2a5e;margin:12px 0 6px 0}
input,select,textarea{width:100%;padding:11px;border:2px solid #0a2a5e;border-radius:10px;font-size:14px;margin-top:4px}
textarea{resize:none}
.photoBox{border:2px dashed #0a2a5e;border-radius:12px;padding:10px;text-align:center}
.photoBox img{width:100px;height:100px;border-radius:50%;object-fit:cover;display:none;margin:0 auto 8px}
.upBtns{display:flex;gap:8px}.upBtn{flex:1;padding:8px;background:#0a2a5e;color:#ffcc00;border-radius:8px;font-weight:700;border:none}
.save{width:100%;padding:14px;background:#0a2a5e;color:#ffcc00;border-radius:12px;font-weight:900;font-size:17px;border:none;margin-top:14px}
.row{display:flex;gap:8px}.row>div{flex:1}
</style></head><body>
<div class="phone">

<div class="top">
<img id="padImg"><p id="classShow" style="font-weight:900;color:#0a2a5e;margin-top:4px"></p>
</div>

<div class="card">
<div class="photoBox">
<img id="stuImg">
<p style="font-weight:700;font-size:13px">ছাত্র/ছাত্রীর ছবি</p>
<div class="upBtns" style="margin-top:8px">
<button class="upBtn" onclick="document.getElementById('cam').click()">📷 ক্যামেরা</button>
<button class="upBtn" onclick="document.getElementById('file').click()">🖼️ গ্যালারি</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
</div>

<div class="title">ছাত্রের নাম *</div><input id="name" placeholder="নাম লিখুন">
<div class="row"><div><div class="title">রোল *</div><input id="roll" type="number" placeholder="রোল"></div><div><div class="title">শ্রেণী</div><input id="classInput" readonly></div></div>
<div class="title">পিতার নাম</div><input id="fname" placeholder="পিতার নাম">
<div class="title">মাতার নাম</div><input id="mname" placeholder="মাতার নাম">
<div class="title">জন্ম তারিখ</div><input id="dob" type="date">
<div class="title">মোবাইল</div><input id="mobile" type="number" placeholder="01XXXXXXXXX">
<div class="title">ঠিকানা</div><textarea id="address" rows="2" placeholder="গ্রাম, থানা, জেলা"></textarea>

<button class="save" onclick="saveData()">✅ সেভ করুন - ৪ নং পেজে যান</button>
</div>
</div>

<script>
const padImg=document.getElementById('padImg'); const oldPad=localStorage.getItem('padImage'); if(oldPad) padImg.src=oldPad; else location.href='class.html';
const sel=localStorage.getItem('selectedClass'); document.getElementById('classShow').innerText=sel?sel+' শ্রেণী - ভর্তি ফরম':''; document.getElementById('classInput').value=sel?sel+' শ্রেণী':'';

const file=document.getElementById('file'), cam=document.getElementById('cam'), stuImg=document.getElementById('stuImg');
function loadImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{stuImg.src=e.target.result;stuImg.style.display='block';localStorage.setItem('studentImage',e.target.result);};r.readAsDataURL(f);}
file.onchange=()=>loadImg(file); cam.onchange=()=>loadImg(cam);
const oldStu=localStorage.getItem('studentImage'); if(oldStu){stuImg.src=oldStu;stuImg.style.display='block';}

function saveData(){
 const n=document.getElementById('name').value.trim(); const r=document.getElementById('roll').value.trim();
 if(!n){alert('নাম দিন');return;} if(!r){alert('রোল দিন');return;}
 const data={
  name:n, roll:r, class:sel, fname:document.getElementById('fname').value, mname:document.getElementById('mname').value,
  dob:document.getElementById('dob').value, mobile:document.getElementById('mobile').value, address:document.getElementById('address').value
 };
 localStorage.setItem('studentData',JSON.stringify(data));
 location.href='preview.html'; // ৪ নং পেজ
}
</script>
</body></html>
