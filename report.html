<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>৪র্থ পেজ - শিক্ষার্থী ও মাসিক রিপোর্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#fdf6e3;font-family:'Hind Siliguri';display:flex;justify-content:center}
.w{max-width:520px;width:100%;min-height:100vh;background:#fdf6e3;padding-bottom:20px}
.banner{background:#eef0ff;border:2px solid #c5ccff;border-radius:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;margin:10px}
.logo{width:64px;height:64px;object-fit:contain;border-radius:50%;border:1.5px solid #0a3a6b}
.bn{color:#0a2e7a;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en{color:#cc0000;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:16px;margin-top:5px;font-weight:700;color:#0a2e7a;font-size:12px}
.dot{width:9px;height:9px;background:#0a2e7a;display:inline-block;margin-right:4px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.btn-big{width:100%;padding:18px;border:none;border-radius:16px;font-weight:800;font-size:19px;cursor:pointer;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Hind Siliguri';box-shadow:0 3px 8px rgba(0,0,0,.15)}
.btn-add{background:linear-gradient(135deg,#0e8a3c,#1fb85a);color:#fff}
.btn-month{background:linear-gradient(135deg,#0d47a1,#1976d2);color:#fff}
.title{font-size:22px;font-weight:800;text-align:center;margin:15px 0 5px;color:#0a2342}
.sub{font-size:14px;text-align:center;color:#666;margin-bottom:10px}
.back{width:calc(100% - 20px);padding:14px;background:#0a2342;color:#fff;border:none;border-radius:14px;font-weight:800;margin:15px 10px;font-family:'Hind Siliguri';cursor:pointer}
</style></head><body><div class="w">

<!-- উপরে ২নং পেজের প্যাড -->
<div class="banner">
<img id="logo" class="logo" src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
<div style="flex:1;min-width:0">
<div id="bn" class="bn">মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div>
<div id="en" class="en">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div>
<div class="meta"><div><span class="dot"></span>EIIN: <span id="eiin">132331</span></div><div><span class="dot"></span>Ins. Code: <span id="code">50017</span></div></div>
</div>
</div>

<div class="title">🎓 চতুর্থ পেজ</div>
<div class="sub">শিক্ষার্থী ব্যবস্থাপনা ও মাসিক রিপোর্ট</div>

<div class="card">
<button class="btn-big btn-add" onclick="location.href='student.html'">
<span style="font-size:28px">👨‍🎓</span> শিক্ষার্থী যোগ করুন
</button>
<button class="btn-big btn-month" onclick="location.href='monthly.html'">
<span style="font-size:28px">📅</span> মাসিক হাজিরা রিপোর্ট
</button>
</div>

<div class="card" style="background:#fff8d6">
<div style="font-weight:800;text-align:center">📊 আজকের সারাংশ</div>
<div id="summary" style="text-align:center;margin-top:8px;font-weight:700">মোট শিক্ষার্থী: 0 জন</div>
</div>

<button class="back" onclick="location.href='report.html'">← ৩য় পেজে ফিরে যান</button>

</div>
<script>
function load(){
let all=JSON.parse(localStorage.getItem('allColleges')||'{}');let cur=localStorage.getItem('loggedCollege')||'50017';let c=all[cur];
if(c){document.getElementById('bn').innerText=c.bn||c.nameBN||'মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ';document.getElementById('en').innerText=c.en||c.nameEN||'MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE';document.getElementById('eiin').innerText=c.eiin||'132331';document.getElementById('code').innerText=c.code||'50017';if(c.logo)document.getElementById('logo').src=c.logo;}
let allS=JSON.parse(localStorage.getItem('allStudents')||'{}');let list=allS[cur]||JSON.parse(localStorage.getItem('studentsList')||'[]');
document.getElementById('summary').innerText=`মোট শিক্ষার্থী: ${list.length} জন`;
}
load();
</script></body></html>
