<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>৩য় পেজ - রিপোর্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#efe8d9;font-family:'Hind Siliguri';display:flex;justify-content:center}.wrap{max-width:440px;width:100%;background:#fdfaf3;min-height:100vh;padding-bottom:20px}.top{background:#0f2f1f;color:#fff;padding:12px;text-align:center}.pad{background:#fff8dc;border:1px solid #d6c28f;margin:10px;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}.pad img{width:50px;height:50px;border-radius:50%}.box{background:#fff;margin:10px;border-radius:12px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}.row{display:flex;gap:8px;margin-top:8px}.btn{flex:1;padding:11px;border:none;border-radius:10px;font-weight:800;font-family:'Hind Siliguri';cursor:pointer}.btn-g{background:#0e8a3c;color:#fff}.btn-y{background:#ffcc00}.btn-d{background:#0a2342;color:#fff}</style>
</head><body><div class="wrap">
<div class="top"><h3 id="cN">মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</h3><small>কোড: <span id="cC">50017</span></small></div>
<div class="pad"><img id="cL" src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png"><div><b id="bN">মমতাজউদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</b><br><small>স্থাপিত: ২০০৫ • EIIN: 132332 • সীতাকুণ্ড, চট্টগ্রাম</small></div></div>
<div class="box"><h4>📊 উপস্থিতি রিপোর্ট</h4><p>মোট: <b id="tS">55</b> • উপস্থিত: <b id="pS">48</b> • অনুপস্থিত: <b id="aS">7</b></p>
<div class="row"><button class="btn btn-g" onclick="wa()">🟢 WhatsApp</button><button class="btn btn-y" onclick="window.print()">🖨️ প্রিন্ট</button></div>
</div>
<!-- নিচে নেভিগেশন - লগআউট বাদ -->
<div class="row" style="padding:10px">
<button class="btn btn-d" onclick="location.href='class.html'">← ২য় পেজ</button>
<button class="btn btn-y" onclick="location.href='students.html'">৪র্থ পেজ →</button>
</div>
</div>
<script>
let CODE=localStorage.getItem('loggedCollege')||'50017';let all=JSON.parse(localStorage.getItem('allColleges')||'{}');if(all[CODE]){document.getElementById('bN').innerText=all[CODE].nameBN;document.getElementById('cN').innerText=all[CODE].nameBN;document.getElementById('cL').src=all[CODE].logo;document.getElementById('cC').innerText=CODE;let s=JSON.parse(localStorage.getItem('students_'+CODE)||'[]');if(s.length>0)document.getElementById('tS').innerText=s.length;}
function wa(){let txt=`*${document.getElementById('bN').innerText}*%0Aমোট: ${document.getElementById('tS').innerText} জন%0A`;window.open('https://wa.me/?text='+txt,'_blank');}
</script></body></html>
