<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - হাজিরা</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#f0f4f8;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}
.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;border-radius:12px 12px 0 0}
.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.fifty{display:flex;gap:6px}.fifty>*{flex:1}
.header3{display:flex;gap:6px;width:100%}.hbox{flex:1;padding:14px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:13px;cursor:pointer;border:3px solid transparent}.hbox.active{border-color:yellow}
.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}
.subName{width:90px;padding:8px 6px;border-radius:6px;border:1.5px solid #0f5d1a;background:#e8f5e9;text-align:center;font-weight:700}
.subFull{width:70px;padding:7px;border-radius:6px;border:1.5px solid #b7791f;background:#fffbeb;text-align:center;font-weight:700}
.markGol{width:70px;height:38px;border-radius:6px;border:1.5px solid #94a3b8;background:#fff;text-align:center;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:12px;text-align:center;background:#fff}.tbl th{background:#0f5d1a;color:#fff;padding:10px 4px}.tbl td{padding:4px;border:1px solid #e2e8f0}
#institutePadFull{width:100%;max-width:800px;background:#fff;border:1px solid #ccc;overflow:hidden}
.padTop{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff}
#padLogo{width:95px;height:95px;border-radius:50%;border:3px solid #0a2a7a;object-fit:contain;flex-shrink:0;background:#fff}
.padText{flex:1;text-align:center;line-height:1.2;overflow:hidden;min-width:0}
.bnName{font-weight:700;color:#1a237e;font-size:17px;white-space:nowrap;display:block;width:100%;overflow:hidden}
.enName{font-weight:700;color:#b71c1c;font-size:13.5px;white-space:nowrap;display:block;width:100%;overflow:hidden;text-transform:uppercase}
.bnAddr{font-size:13px;color:#000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line4,.line5{font-size:11px;color:#000;white-space:nowrap}.blueLine{width:100%;height:2px;background:#0d2a7a}
.classPillWrap{width:100%;display:flex;justify-content:center;padding:5px 0 8px 0;background:#fff}
.classPill{background:#0d2a7a;color:#fff;padding:5px 18px;border-radius:0 0 12px 12px;font-size:12px;font-weight:700}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}
</style></head><body>
<div id="institutePadFull"><div class="padTop"><img id="padLogo"><div class="padText"><div id="instName" class="bnName"></div><div id="instEng" class="enName"></div><div id="instAddr" class="bnAddr"></div><div class="line4">EIIN: <span id="padEiin"></span> | Code: <span id="padCode"></span></div><div class="line5">Mobile: <span id="padMobile"></span> | Email: <span id="padEmail"></span></div></div></div><div class="blueLine"></div><div class="classPillWrap"><div class="classPill">শ্রেণী: <span id="pillCls"></span> | শাখা: <span id="pillSec"></span> | শিফট: <span id="pillShift"></span></div></div></div>
<div style="text-align:center;margin-top:8px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px">🚪 লগআউট</button></div>
<div id="acc" style="width:100%;max-width:430px;margin-top:10px"></div>
<script>
let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!sess){window.location.href='index.html';}
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');let monthlyAtt=JSON.parse(localStorage.getItem('monthly_att')||'{}');let activeTab='';
function getMonthlyKey(){return `${sess.inst.eiin||sess.inst.schoolCode}_${sess.cls}_${sess.shift}_${sess.section}`;}
function getResultKey(){return 'result_'+getMonthlyKey();}
function autoFit(id,max,min){let el=document.getElementById(id);if(!el)return;let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>el.parentElement.clientWidth&&s>min){s-=0.5;el.style.fontSize=s+'px';}}
function showSecondPage(){document.getElementById('instName').innerText=sess.inst.bnName||'';document.getElementById('instEng').innerText=sess.inst.enName||'';document.getElementById('instAddr').innerText=sess.inst.addr||'';let lg=document.getElementById('padLogo');if(sess.inst.logo)lg.src=sess.inst.logo;document.getElementById('padEiin').innerText=sess.inst.eiin||'';document.getElementById('padCode').innerText=sess.inst.schoolCode||'';document.getElementById('padMobile').innerText=sess.inst.mobile||'';document.getElementById('padEmail').innerText=sess.inst.email||'';document.getElementById('pillCls').innerText=sess.cls;document.getElementById('pillSec').innerText=sess.section;document.getElementById('pillShift').innerText=sess.shift;buildAcc();showStu();renderHeaderCounts();setTimeout(()=>{autoFit('instName',17,8);autoFit('instEng',13.5,7);},120);}
function buildAcc(){document.getElementById('acc').innerHTML=`<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span>▼</span></div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn" style="background:#2e7d32;color:#fff" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা (টিক = আজ হাজির)</span><span>▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h-normal" style="background:#0d47a1" onclick="togN(3)"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="event.stopPropagation();setTab('present')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div><div id="hb_absent" class="hbox boxAbsent" onclick="event.stopPropagation();setTab('absent')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div><div id="hb_notice" class="hbox boxNotice" onclick="event.stopPropagation();setTab('notice')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১) - ৩১ এর পরে মোট</span><span>▼</span></div><div class="acc-b-normal" id="ab4"><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()"><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - SET / সেভ লক / এডিট</span><span>▼</span></div><div class="acc-b-normal" id="ab5"><div class="fifty"><b>বিষয়:</b><button onclick="chSub(-1)">-</button><input id="sc" type="number" value="3" style="text-align:center"><button onclick="chSub(1)">+</button><button onclick="makeSheet(true)" style="background:#7c4dff;color:#fff;border:none;padding:6px 14px;border-radius:8px">SET</button></div><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:8px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div class="fifty" style="margin-top:8px"><button style="background:#2e7d32;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button></div><div class="fifty" style="margin-top:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="expExcel()">⬇️ Excel A4</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="downPDF()">⬇️ PDF A4 প্যাড সহ</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div></div></div>`;}
function togN(i){let b=document.getElementById('ab'+i);b.classList.toggle(i==3?'show':'on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet(false);}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;document.getElementById('hc_present').innerText=p;document.getElementById('hc_absent').innerText=students.length-p;}
function renderTab(){let p=students.filter(s=>s.present),a=students.filter(s=>!s.present),el=document.getElementById('tabContent');if(activeTab=='present'){el.innerHTML=`<div style="padding:10px;background:#e8f5e9;border-radius:12px">${p.map(s=>`✅ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই'}</div>`;}else if(activeTab=='absent'){el.innerHTML=`<div style="padding:10px;background:#ffebee;border-radius:12px">${a.map(s=>`❌ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই'}</div>`;}else{el.innerHTML=`<textarea id="notice" rows="3" style="width:100%;padding:10px;border-radius:12px;border:1px solid #ccc">${localStorage.getItem('notice')||''}</textarea><button onclick="localStorage.setItem('notice',document.getElementById('notice').value);alert('✅ সেভ')" style="width:100%;background:#ef6c00;color:#fff;padding:10px;border:none;border-radius:12px;margin-top:8px">💾 নোটিশ সেভ</button>`;}}
function showStu(){document.getElementById('sList').innerHTML=students.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #eee"><span>${i+1}. ${s.name} (${s.roll})</span><div><input type="checkbox" ${s.present?'checked':''} onchange="toggleDaily(${i},this.checked)"><button onclick="students.splice(${i},1);localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHeaderCounts();renderMonth()" style="background:#fee2e2;border:none;padding:4px 8px;border-radius:8px">🗑️</button></div></div>`).join('')||'কোন শিক্ষার্থী নেই';}
function toggleDaily(idx,checked){students[idx].present=checked;localStorage.setItem('students_v2',JSON.stringify(students));renderHeaderCounts();let monthVal=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let day=new Date().getDate();let key=getMonthlyKey();if(!monthlyAtt[key])monthlyAtt[key]={};if(!monthlyAtt[key][monthVal])monthlyAtt[key][monthVal]={};if(!monthlyAtt[key][monthVal][students[idx].roll])monthlyAtt[key][monthVal][students[idx].roll]={};monthlyAtt[key][monthVal][students[idx].roll][day]=checked;localStorage.setItem('monthly_att',JSON.stringify(monthlyAtt));renderMonth();}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n)return alert('নাম দিন');students.push({name:n,roll:r,mobile:m,present:false});localStorage.setItem('students_v2',JSON.stringify(students));document.getElementById('sn').value='';document.getElementById('sr').value='';document.getElementById('sm').value='';showStu();renderHeaderCounts();renderMonth();}
function renderMonth(){let tbl=document.getElementById('monthTbl');if(!tbl)return;let monthVal=document.getElementById('mp').value||new Date().toISOString().slice(0,7);let key=getMonthlyKey();let dataForMonth=monthlyAtt[key]?.[monthVal]||{};let [y,m]=monthVal.split('-').map(Number);let days=new Date(y,m,0).getDate();let html='<div style="overflow:auto"><table class="tbl"><tr><th style="position:sticky;left:0;background:#0f5d1a;z-index:2">নাম/রোল</th>';for(let d=1;d<=days;d++)html+=`<th>${d}</th>`;html+=`<th style="background:#2e7d32">মোট<br>উপস্থিত</th><th style="background:#c62828">মোট<br>অনুপস্থিত</th></tr>`;students.forEach(s=>{let p=0;for(let d=1;d<=days;d++)if(dataForMonth[s.roll]?.[d])p++;html+=`<tr><td style="position:sticky;left:0;background:#fff;text-align:left;white-space:nowrap;font-weight:600">${s.name} (${s.roll})</td>`;for(let d=1;d<=days;d++){let chk=dataForMonth[s.roll]?.[d]?'checked':'';html+=`<td><input type="checkbox" ${chk} onchange="saveMonthly('${s.roll}',${d},this.checked)"></td>`;}html+=`<td style="background:#e8f5e9;font-weight:800;color:#166534">${p}</td><td style="background:#ffebee;font-weight:800;color:#b91c1c">${days-p}</td></tr>`;});html+='</table></div>';tbl.innerHTML=html;}
function saveMonthly(roll,day,checked){let monthVal=document.getElementById('mp').value||new Date().toISOString().slice(0,7);let key=getMonthlyKey();if(!monthlyAtt[key])monthlyAtt[key]={};if(!monthlyAtt[key][monthVal])monthlyAtt[key][monthVal]={};if(!monthlyAtt[key][monthVal][roll])monthlyAtt[key][monthVal][roll]={};monthlyAtt[key][monthVal][roll][day]=checked;localStorage.setItem('monthly_att',JSON.stringify(monthlyAtt));let today=new Date().getDate();let curM=new Date().toISOString().slice(0,7);if(monthVal==curM&&day==today){let idx=students.findIndex(x=>x.roll==roll);if(idx!=-1){students[idx].present=checked;localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHeaderCounts();}}renderMonth();}
function chSub(d){let el=document.getElementById('sc'),v=parseInt(el.value)||3;v+=d;if(v<1)v=1;if(v>10)v=10;el.value=v;}
function makeSheet(forceNew){let key=getResultKey();let saved=JSON.parse(localStorage.getItem(key)||'null');let n=parseInt(document.getElementById('sc')?.value)||3;if(n<1)n=1;if(n>10)n=10;if(document.getElementById('sc'))document.getElementById('sc').value=n;let useSaved=!forceNew&&saved&&parseInt(saved.sc)==n;let rh=document.getElementById('rh'),rb=document.getElementById('rb');if(!rh||!rb)return;let head='<tr><th>রোল</th><th>নাম</th>';for(let i=1;i<=n;i++)head+=`<th><input class="subName" id="subN${i}" placeholder="বিষয়${i}"><br><input class="subFull" id="subF${i}" placeholder="Full 100"></th>`;head+='<th>মোট</th><th>%</th><th>GPA</th></tr>';rh.innerHTML=head;let body='';students.forEach((s,i)=>{body+=`<tr><td>${s.roll}</td><td>${s.name}</td>`;for(let j=1;j<=n;j++)body+=`<td><input class="markGol" id="m_${i}_${j}" type="number"></td>`;body+=`<td id="tot_${i}">0</td><td id="per_${i}">0%</td><td id="gpa_${i}">0</td></tr>`;});rb.innerHTML=body;if(useSaved){saved.subs.forEach((sb,i)=>{if(document.getElementById(`subN${i+1}`)){document.getElementById(`subN${i+1}`).value=sb.name;document.getElementById(`subF${i+1}`).value=sb.full;}});saved.marks.forEach((row,i)=>{row.forEach((v,j)=>{if(document.getElementById(`m_${i}_${j+1}`))document.getElementById(`m_${i}_${j+1}`).value=v;});});}rb.querySelectorAll('.markGol').forEach(inp=>inp.addEventListener('input',calcRes));calcRes();document.getElementById('st').innerText=forceNew?`✅ ${n}টা বিষয় SET`:(useSaved?'🔒 সেভ লোড':'');}
function calcRes(){let n=parseInt(document.getElementById('sc').value)||3;students.forEach((s,i)=>{let sum=0;for(let j=1;j<=n;j++)sum+=parseFloat(document.getElementById(`m_${i}_${j}`)?.value)||0;let tot=document.getElementById(`tot_${i}`);if(tot)tot.innerText=sum;let full=0;for(let j=1;j<=n;j++)full+=parseFloat(document.getElementById(`subF${j}`)?.value)||100;let per=full?(sum/full*100):0;let pe=document.getElementById(`per_${i}`);if(pe)pe.innerText=per.toFixed(1)+'%';let gp=document.getElementById(`gpa_${i}`);if(gp)gp.innerText=per>=80?5:per>=70?4:per>=60?3.5:per>=50?3:per>=40?2:0;});}
function saveRes(){let key=getResultKey();let data={sc:document.getElementById('sc').value,subs:[],marks:[]},n=parseInt(data.sc)||3;for(let i=1;i<=n;i++)data.subs.push({name:document.getElementById(`subN${i}`)?.value||'',full:document.getElementById(`subF${i}`)?.value||''});students.forEach((s,i)=>{let row=[];for(let j=1;j<=n;j++)row.push(document.getElementById(`m_${i}_${j}`)?.value||'');data.marks.push(row);});localStorage.setItem(key,JSON.stringify(data));document.getElementById('st').innerText='✅ সেভ লক হয়েছে';}
function unlockRes(){let key=getResultKey();let d=JSON.parse(localStorage.getItem(key)||'null');if(!d)return alert('কোন সেভ নাই');document.getElementById('sc').value=d.sc;makeSheet(false);}
function expExcel(){let tbl=document.getElementById('rt');let wb=XLSX.utils.table_to_book(tbl);XLSX.writeFile(wb,'Result_A4.xlsx');}
function downPDF(){let pad=document.getElementById('institutePadFull'),area=document.getElementById('pdfArea');html2canvas(pad).then(c1=>{html2canvas(area).then(c2=>{let {jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4');pdf.addImage(c1.toDataURL('image/png'),'PNG',10,10,190,30);pdf.addImage(c2.toDataURL('image/png'),'PNG',10,45,190,200);pdf.save('Result_A4_Pad.pdf');});});}
function logout(){if(confirm('লগআউট?')){localStorage.removeItem('takrim_session');window.location.href='index.html';}}
showSecondPage();
</script></body></html>
