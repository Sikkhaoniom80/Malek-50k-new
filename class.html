<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>সরাসরি উপরে লিখুন - 12345 বাদ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#efe8d9;font-family:'Hind Siliguri';display:flex;justify-content:center}.w{max-width:460px;width:100%;background:#fdfaf3;min-height:100vh;padding:10px}
.top{border:3px dashed #0a3a6b;border-radius:16px;padding:14px;background:#fff;display:flex;gap:12px;align-items:flex-start}
.top img{width:64px;height:64px;border-radius:50%;border:2px solid #0a3a6b;cursor:pointer}
.edit{border:1.5px dashed #ffb703;background:#fffef0;border-radius:8px;padding:8px 10px;margin:5px 0;min-height:42px;outline:none;font-weight:700}
.edit:empty:before{content:attr(data-ph);color:#888;font-weight:400}
.edit:focus{background:#ffffcc;border-color:#0e8a3c}
.box{background:#fff;margin:12px 0;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;font-family:'Hind Siliguri';cursor:pointer;margin-top:10px;font-size:15px}.y{background:#ffcc00}.g{background:#0e8a3c;color:#fff}.d{background:#0a2342;color:#fff}
</style></head><body><div class="w">

<!-- উপরে সরাসরি এড করার জায়গা - 12345 বাদ -->
<div class="top">
<img id="L" src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" onclick="document.getElementById('file').click()">
<div style="flex:1">
<div id="bn" class="edit" contenteditable="true" data-ph="১। বাংলা নাম এখানে লিখুন (মমতাজ উদ্দীন...)" oninput="saveAuto()"></div>
<div id="en" class="edit" contenteditable="true" data-ph="২। English নাম এখানে লিখুন" oninput="saveAuto()"></div>
<div style="display:flex;gap:6px"><div id="eiin" class="edit" style="flex:1" contenteditable="true" data-ph="৩। EIIN No" oninput="saveAuto()"></div><div id="code" class="edit" style="flex:1" contenteditable="true" data-ph="৪। Code: 50017" oninput="saveAuto()"></div></div>
<small style="color:#0e8a3c;font-weight:700">👆 এখানে ক্লিক করে সরাসরি লিখুন - অটো সেভ</small>
</div>
</div>

<input type="file" id="file" accept="image/*" style="display:none">

<div class="box">
<h3 style="text-align:center;margin-bottom:8px">📝 প্রতিষ্ঠানের তথ্য</h3>
<p style="text-align:center;color:#666;font-size:13px">উপরে সরাসরি লিখুন, নিচে শুধু সেভ বাটন</p>
<button class="btn y" onclick="saveFinal()">💾 সেভ করুন</button>
<button class="btn g" onclick="go()">➡️ ৩য় পেজে যান - রিপোর্ট</button>
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn d" onclick="location.href='index.html'">← ১ম পেজ</button><button class="btn" style="border:2px solid #0a2342;background:#fff" onclick="location.href='report.html'">রিপোর্ট →</button></div>
</div>

<div id="msg" style="text-align:center;padding:10px;color:#0e8a3c;font-weight:800"></div>

</div>
<script>
let all=JSON.parse(localStorage.getItem('allColleges')||'{}');
function load(){
let c=localStorage.getItem('loggedCollege')||Object.keys(all)[0];
if(c && all[c]){
document.getElementById('bn').innerText=all[c].bn||all[c].nameBN||'';
document.getElementById('en').innerText=all[c].en||all[c].nameEN||'';
document.getElementById('eiin').innerText=all[c].eiin||'';
document.getElementById('code').innerText=all[c].code||'';
document.getElementById('L').src=all[c].logo||'https://cdn-icons-png.flaticon.com/512/2232/2232688.png';
}
}
function saveAuto(){
let bn=document.getElementById('bn').innerText.trim();
let en=document.getElementById('en').innerText.trim();
let eiin=document.getElementById('eiin').innerText.trim();
let code=document.getElementById('code').innerText.trim()||'50017';
let logo=document.getElementById('L').src;
let obj={bn:bn,en:en,nameBN:bn,nameEN:en,eiin:eiin,code:code,logo:logo,pass:'1234'};
let a=JSON.parse(localStorage.getItem('allColleges')||'{}');
a[code]=obj;
localStorage.setItem('allColleges',JSON.stringify(a));
localStorage.setItem('loggedCollege',code);
document.getElementById('msg').innerText='✅ অটো সেভ হয়েছে: '+bn;
}
function saveFinal(){saveAuto();alert('✅ সেভ হয়েছে! এখন রিপোর্টে যান');}
function go(){saveAuto();location.href='report.html';}
document.getElementById('file').addEventListener('change',e=>{
let r=new FileReader();r.onload=()=>{document.getElementById('L').src=r.result;saveAuto();};r.readAsDataURL(e.target.files[0]);
});
load();
</script></body></html>
