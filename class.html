<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class</title><style>body{background:#0a2a5e;display:flex;flex-direction:column;align-items:center;padding:12px;margin:0}.top{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:10px;text-align:center;border:3px solid #ffcc00}.top img{width:100%;max-height:130px;object-fit:contain}.card{background:#fff;width:100%;max-width:420px;border-radius:22px;padding:16px;margin-top:12px;text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.c{background:#ffcc00;border-radius:12px;padding:18px;font-weight:900;cursor:pointer}</style></head><body>
<div class="top"><img id="pad"><p id="cn" style="font-weight:900;color:#0a2a5e"></p></div>
<div class="card"><h3>শ্রেণী নির্বাচন করুন</h3><div class="grid"><div class="c">১ম</div><div class="c">২য়</div><div class="c">৩য়</div><div class="c">৪র্থ</div><div class="c">৫ম</div><div class="c">৬ষ্ঠ</div><div class="c">৭ম</div><div class="c">৮ম</div><div class="c">৯ম</div><div class="c">১০ম</div><div class="c">১১শ</div><div class="c">১২শ</div></div></div>
<script>document.getElementById('pad').src=localStorage.getItem('padImage')||'';document.getElementById('cn').innerText=localStorage.getItem('college')||'কলেজ';</script>
</body></html>
