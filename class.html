<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>প্যাড তৈরি - ২য় পেজ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a2342;font-family:'Hind Siliguri',sans-serif;display:flex;justify-content:center;padding:0}
.wrap{width:100%;max-width:430px;background:#fff;min-height:100vh;padding:12px}
.pad{border:2px dashed #0e3d8f;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;background:#fff}
.pad img{width:62px;height:62px;border-radius:50%;border:2px solid #0e3d8f;object-fit:cover;background:#fff}
.p-bn{font-size:15px;font-weight:700;color:#000;line-height:1.2}
.p-en{font-size:13px;font-weight:700;color:#c00000;margin-top:2px;text-transform:uppercase;line-height:1.1}
.p-info{font-size:11px;font-weight:600;margin-top:3px}
.lbl{font-size:14px;font-weight:700;margin:16px 0 6px;color:#000}
.inp{width:100%;padding:12px;border:1.8px solid #0e2f5a;border-radius:12px;font-size:15px;outline:none;font-family:'Hind Siliguri'}
.inp:focus{border-color:#ffcc00}
.file-box{width:100%;padding:10px;border:1.8px solid #0e2f5a;border-radius:12px;display:flex;align-items:center;gap:8px}
.btn-yellow{width:100%;padding:15px;background:#ffcc00;border:none;border-radius:14px;font-size:18px;font-weight:800;margin-top:16px;cursor:pointer;box-shadow:0 4px 0 #d4a800}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn-dark{padding:14px;background:#0e2f5a;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-green{padding:14px;background:#00a859;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.list{margin-top:14px;font-size:14px;font-weight:600}
.item{background:#f0f0ff;padding:9px 12px;border-radius:10px;margin-top:6px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">

<div class="pad">
<img id="prevLogo" src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">
<div>
<div class="p-bn" id="prevBN">মমতাজ উদ্দীন বিজনেস ম্যানেজমেন্ট কলেজ</div>
<div class="p-en" id="prevEN">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div>
<div class="p-info">■ EIIN : <span id="prevEIIN">132332</span> &nbsp; ■ Ins. Code: <span id="prevCODE">50017</span></div>
</div>
</div>

<div class="lbl">📷 ১। লোগো আপলোড (গোল নীল লোগো)</div>
<div class="file-box">
<input type="file" id="logoFile" accept="image/*" onchange="loadLogo(event)">
</div>

<div class="lbl">২। বাংলা নাম</div>
<input id="bnName" class="inp" value="মমতাজ উদ্দীন বিজনেস ম্যানেজমেন্ট কলেজ" oninput="document.getElementById('prevBN').innerText=this.value">

<div class="lbl">৩। English নাম</div>
<input id="enName" class="inp" value="MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE" oninput="document.getElementById('prevEN').innerText=this.value">

<div class="lbl">৪। EIIN</div>
<input id="eiin" class="inp" value="132332" oninput="document.getElementById('prevEIIN').innerText=this.value">

<div class="lbl">৫। Ins. Code
