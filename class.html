<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Select</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a2a5e;display:flex;justify-content:center;padding:12px;font-family:sans-serif}
.phone{width:100%;max-width:400px}
.top{background:#fff;border:3px solid #ffcc00;border-radius:16px;padding:10px;text-align:center;margin-bottom:14px}
.top img{width:100%;max-height:150px;object-fit:contain}
.card{background:#fff;border-radius:16px;padding:14px}
.inputWrap{position:relative;margin-top:10px}input{width:100%;padding:12px 40px 12px 12px;border:2px solid #0a2a5e;border-radius:10px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer}
.change{display:block;text-align:right;font-size:12px;color:#0a2a5e;text-decoration:underline;margin-top:4px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cBtn{padding:14px;background:#ffcc00;border:2px solid #0a2a5e;border-radius:12px;font-weight:900;font-size:17px;cursor:pointer}
.cBtn:active{transform:scale(0.96)}
.logout{width:100%;margin-top:14px;padding:10px;background:#fff;border:2px solid red;border-radius:10px;color:red;font-weight:700;cursor:pointer}
</style></head><body>
<div class="phone">

<div class="top" id="topBox">
<img id="padImg" src="">
<p id="collegeName" style="font-weight:900;margin-top:6px;color:#0a2a5e"></p>
<p style="font-size:12px;color:green">✅ লগইন সফল</p>
</div>

<div class="card">
<b>🔐 প্রতিষ্ঠানের পাসওয়ার্ড</b>
<div class="inputWrap"><input id="pass" type="password" placeholder="পাসওয়ার্ড দিন"><span class="eye" onclick="let p=document.getElementById('pass');p.type=p.type==='password'?'text':'password'">👁️</span></div>
<span class="change" onclick="resetPass()">পাসওয়ার্ড পরিবর্তন / রিসেট</span>

<hr style="margin:12px 0">
<b>📚 শ্রেণী নির্বাচন করুন (১-১২)</b>
<div class="grid">
<button class="cBtn" onclick="goClass(1)">১ম শ্রেণী</button>
<button class="cBtn" onclick="goClass(2)">২য় শ্রেণী</button>
<button class="cBtn" onclick="goClass(3)">৩য় শ্রেণী</button>
<button class="cBtn" onclick="goClass(4)">৪র্থ শ্রেণী</button>
<button class="cBtn" onclick="goClass(5)">৫ম শ্রেণী</button>
<button class="cBtn" onclick="goClass(6)">৬ষ্ঠ শ্রেণী</button>
<button class="cBtn" onclick="goClass(7)">৭ম শ্রেণী</button>
<button class="cBtn" onclick="goClass(8)">৮ম শ্রেণী</button>
<button class="cBtn" onclick="goClass(9)">৯ম শ্রেণী</button>
<button class="cBtn" onclick="goClass(10)">১০ম শ্রেণী</button>
<button class="cBtn" onclick="goClass(11)">১১শ শ্রেণী</button>
<button class="cBtn" onclick="goClass(12)">১২শ শ্রেণী</button>
</div>

<button class="logout" onclick="localStorage.clear();location.href='index.html'">লগআউট</button>
</div>
</div>

<script>
// ১ নং পেজ থেকে প্যাড আনা
const img=localStorage.getItem('padImage');
if(!img){alert('আগে প্যাড আপলোড করুন');location.href='index.html';}
document.getElementById('padImg').src=img;

function goClass(c){
 const p=document.getElementById('pass').value.trim();
 const saved=localStorage.getItem('userPass');
 if(!p){alert('পাসওয়ার্ড দিন');return;}
 if(p!==saved){alert('ভুল পাসওয়ার্ড!');return;}
 localStorage.setItem('selectedClass',c);
 location.href='form.html'; // ৩ নং পেজে যাবে
}
function resetPass(){
 const s=localStorage.getItem('userPass'); if(!s){alert('পাসওয়ার্ড নাই');return;}
 const o=prompt('পুরাতন পাসওয়ার্ড:'); if(o!==s){alert('ভুল');return;}
 const n=prompt('নতুন পাসওয়ার্ড:'); if(!n)return;
 localStorage.setItem('userPass',n); alert('নতুন পাসওয়ার্ড: '+n);
}
</script>
</body></html>
