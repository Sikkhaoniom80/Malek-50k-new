<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>অরিজিনাল ব্যানার - সব পরিবর্তন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#efe8d9;font-family:'Hind Siliguri';display:flex;justify-content:center}
.w{max-width:560px;width:100%;padding:12px;min-height:100vh}
/* আপনার ছবির মতো হুবহু ব্যানার */
.banner{background:#f1f2ff;border:1px solid #b8c1ff;display:flex;align-items:center;gap:14px;padding:10px 14px}
.logo{width:68px;height:68px;object-fit:contain;cursor:pointer;flex-shrink:0;border-radius:50%;border:1px solid #0a3a6b}
.info{flex:1;line-height:1.25}
.bn{font-family:'Noto Serif Bengali';color:#0a2e7a;font-size:18px;font-weight:800;letter-spacing:.2px;outline:none;border:1px dashed transparent;padding:3px 6px;border-radius:4px;min-height:26px}
.en{color:#cc0000;font-size:15px;font-weight:800;letter-spacing:.5px;outline:none;border:1px dashed transparent;padding:3px 6px;border-radius:4px;margin-top:1px;min-height:22px}
.meta{display:flex;gap:24px;margin-top:5px;font-weight:700;color:#0a2e7a;font-size:13px}
.meta div{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;background:#0a2e7a;display:inline-block}
.val{outline:none;border:1px dashed transparent;padding:2px 6px;border-radius:4px;min-width:60px;background:#fff8}
.edit:focus{background:#ffffb8;border-color:#ff9900}
.hint{text-align:center;color:#0e8a3c;font-weight:700;font-size:13px;margin:8px 0}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:'Hind Siliguri';margin:5px 0}.y{background:#ffcc00}.g{background:#0e8a3c;color:#fff}.d{background:#0a2342;color:#fff}
input{display:none}
</style></head><body><div class="w">

<!-- হুবহু আপনার ছবির মতো, কিন্তু ৫টাই এডিট হবে -->
<div class="banner">
<img id="logo" class="logo" src="/mnt/data/wa_image_6145195911921207667" onclick="document.getElementById('file').click()" title="লোগো বদলাতে ক্লিক করুন">
<div class="info">
<div id="bn" class="bn edit" contenteditable="true" oninput="auto()">মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div>
<div id="en" class="en edit" contenteditable="true" oninput="auto()">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div>
<div class="meta">
<div><span class="dot"></span> EIIN : <span id="eiin" class="val edit" contenteditable="true" oninput="auto()">132332</span></div>
<div><span class="dot"></span> Ins. Code: <span id="code" class="val edit" contenteditable="true" oninput="auto()">50017</span></div>
</div>
</div>
</div>

<div class="hint">👆 উপরের ৫টা ঘরে ক্লিক করে সব বদলাতে পারবেন - লোগো, বাংলা, English, EIIN, Code - অটো সেভ হবে</div>

<div class="card">
<button class="btn y" onclick="save()">💾 সেভ করুন</button>
<button class="btn g" onclick="location.href='report.html'">➡️ ৩য় পেজ - রিপোর্ট (ডাইনামিক)</button>
<div style="display:flex;gap:10px"><button class="btn d" style="flex:1" onclick="location.href='index.html'">← ১ম পেজ</button><button class="btn" style="flex:1;background:#fff;border:2px solid #0a2342" onclick="location.href='student.html'">ছাত্র পেজ →</button></div>
</div>

<input type="file" id="file" accept="image/*">
</div>
<script>
function load(){
let all=JSON.parse(localStorage.getItem('allColleges')||'{}');
let cur=localStorage.getItem('loggedCollege')||'50017';
if(all[cur]){
document.getElementById('bn').innerText=all[cur].bn||'মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ';
document.getElementById('en').innerText=all[cur].en||'MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE';
document.getElementById('eiin').innerText=all[cur].eiin||'132332';
document.getElementById('code').innerText=all[cur].code||'50017';
if(all[cur].logo)document.getElementById('logo').src=all[cur].logo;
}
}
function auto(){
let bn=document.getElementById('bn').innerText.trim();
let en=document.getElementById('en').innerText.trim();
let eiin=document.getElementById('eiin').innerText.trim();
let code=document.getElementById('code').innerText.trim();
let logo=document.getElementById('logo').src;
let all=JSON.parse(localStorage.getItem('allColleges')||'{}');
let old=localStorage.getItem('loggedCollege');
if(old && old!==code && all[old]) delete all[old];
all[code]={...(all[code]||{}),bn:bn,nameBN:bn,en:en,nameEN:en,eiin:eiin,code:code,logo:logo,pass:'1234'};
localStorage.setItem('allColleges',JSON.stringify(all));
localStorage.setItem('loggedCollege',code);
}
function save(){auto();alert('✅ সেভ হয়েছে মামা!\nবাংলা: '+document.getElementById('bn').innerText+'\nEnglish: '+document.getElementById('en').innerText+'\nEIIN:'+document.getElementById('eiin').innerText+' Code:'+document.getElementById('code').innerText);}
document.getElementById('file').addEventListener('change',e=>{
let r=new FileReader();r.onload=()=>{document.getElementById('logo').src=r.result;auto();};r.readAsDataURL(e.target.files[0]);
});
load();
</script></body></html>
