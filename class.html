<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ব্যানার + আলাদা লগইন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#efe8d9;font-family:'Hind Siliguri';display:flex;justify-content:center}
.w{max-width:560px;width:100%;padding:10px;min-height:100vh}
.banner{background:#f1f2ff;border:2px solid #c5ccff;border-radius:8px;display:flex;align-items:center;gap:12px;padding:10px 12px}
.logo{width:68px;height:68px;object-fit:contain;border-radius:50%;border:1.5px solid #0a3a6b;cursor:pointer;flex-shrink:0}
.info{flex:1;min-width:0}
.bn{color:#0a2e7a;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;border:1px dashed transparent;padding:3px 6px}
.en{color:#cc0000;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;border:1px dashed transparent;padding:3px 6px;text-transform:uppercase}
.meta{display:flex;gap:20px;margin-top:6px;font-weight:700;color:#0a2e7a;font-size:13px}
.dot{width:10px;height:10px;background:#0a2e7a;display:inline-block;margin-right:4px}
.val{outline:none;border:1px dashed transparent;padding:2px 8px;border-radius:4px;min-width:60px;background:#fff}
.edit:focus{background:#ffffb8;border-color:#ff9900}
.hint{text-align:center;color:#0e8a3c;font-weight:700;font-size:13px;margin:8px 0}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:'Hind Siliguri';margin:5px 0}.y{background:#ffcc00}.g{background:#0e8a3c;color:#fff}.d{background:#0a2342;color:#fff}
input[type=text],input[type=password]{width:100%;padding:12px;border:2px dashed #ffb703;border-radius:10px;font-family:'Hind Siliguri';font-size:15px;font-weight:700;outline:none;margin:6px 0;background:#fffef5}
input:focus{background:#fff8c0;border-color:#0e8a3c}
.label{font-weight:800;margin-top:8px;display:block}
input{display:none}.show{display:block}
</style></head><body><div class="w">

<div class="banner">
<img id="logo" class="logo" src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" onclick="document.getElementById('file').click()">
<div class="info">
<div id="bn" class="bn edit" contenteditable="true" oninput="auto()">মমতাজ উদ্দিন বিজনেস ম্যানেজমেন্ট কলেজ</div>
<div id="en" class="en edit" contenteditable="true" oninput="auto()">MOMTAZ UDDIN BUSINESS MANAGEMENT COLLEGE</div>
<div class="meta">
<div><span class="dot"></span>EIIN : <span id="eiin" class="val edit" contenteditable="true" oninput="auto()">132331</span></div>
<div><span class="dot"></span>Ins. Code: <span id="code" class="val edit" contenteditable="true" oninput="auto()">50017</span></div>
</div>
</div>
</div>

<div class="hint">👆 উপরের ৫টা ঘরে ক্লিক করে সব বদলাতে পারবেন - অটো সেভ</div>

<!-- নতুন ২টা ফাঁকা ঘর + লগইন - ১ম পেজের সাথে মিলবে না -->
<div class="card">
<div style="text-align:center;font-weight:800;font-size:18px;margin-bottom:8px">🔐 আলাদা লগইন (ফাঁকা থাকবে)</div>
<div style="background:#fff8d6;border:1px dashed #ffb703;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-bottom:8px;text-align:center">এই কোড/পাসওয়ার্ড ১ম পেজের সাথে মিলবে না - যে কাজ করবে সে নিজে দিবে</div>

<label class="label">🏫 প্রতিষ্ঠান কোড (ফাঁকা)</label>
<input class="show" type="text" id="loginCode" placeholder="এখানে প্রতিষ্ঠান কোড লিখুন - ফাঁকা থাকবে">

<label class="label">🔑 পাসওয়ার্ড (ফাঁকা - ১ম পেজের সাথে মিলবে না)</label>
<input class="show" type="password" id="loginPass" placeholder="এখানে পাসওয়ার্ড লিখুন - ফাঁকা থাকবে">

<button class="btn y" onclick="secondLogin()">🔓 লগইন করে পরের পেজে যান</button>
<button class="btn g" onclick="save()">💾 শুধু ব্যানার সেভ করুন</button>
<div style="display:flex;gap:10px"><button class="btn d" style="flex:1" onclick="location.href='index.html'">← ১ম পেজ</button><button class="btn" style="flex:1;background:#fff;border:2px solid #0a2342" onclick="location.href='student.html'">ছাত্র →</button></div>
</div>

<input type="file" id="file" accept="image/*">
</div>
<script>
function load(){let all=JSON.parse(localStorage.getItem('allColleges')||'{}');let cur=localStorage.getItem('loggedCollege')||'50017';if(all[cur]){document.getElementById('bn').innerText=all[cur].bn||'';document.getElementById('en').innerText=all[cur].en||'';document.getElementById('eiin').innerText=all[cur].eiin||'132331';document.getElementById('code').innerText=all[cur].code||'50017';if(all[cur].logo)document.getElementById('logo').src=all[cur].logo;}}
function auto(){let bn=document.getElementById('bn').innerText.trim();let en=document.getElementById('en').innerText.trim();let eiin=document.getElementById('eiin').innerText.trim();let code=document.getElementById('code').innerText.trim();let logo=document.getElementById('logo').src;let all=JSON.parse(localStorage.getItem('allColleges')||'{}');let old=localStorage.getItem('loggedCollege');if(old&&old!==code&&all[old])delete all[old];all[code]={...(all[code]||{}),bn:bn,nameBN:bn,en:en,nameEN:en,eiin:eiin,code:code,logo:logo,pass:'1234'};localStorage.setItem('allColleges',JSON.stringify(all));localStorage.setItem('loggedCollege',code);}
// আলাদা লগইন - ১ম পেজের সাথে মিলবে না
function secondLogin(){
let c=document.getElementById('loginCode').value.trim();
let p=document.getElementById('loginPass').value.trim();
if(!c||!p){alert('⚠️ মামা প্রতিষ্ঠান কোড আর পাসওয়ার্ড দুটোই লিখতে হবে! ফাঁকা রাখা যাবে না');return;}
// ১ম পেজের পাসওয়ার্ড চেক - মিললে ব্লক
let all=JSON.parse(localStorage.getItem('allColleges')||'{}');
if(all[c] && all[c].pass===p){alert('⚠️ মামা এই পাসওয়ার্ড ১ম পেজের সাথে মিলে গেছে! আলাদা পাসওয়ার্ড দিন (১ম পেজের সাথে মিলবে না বলেছেন)');return;}
// আলাদা সিস্টেমে সেভ - ১ম পেজের সাথে মিলবে না
localStorage.setItem('secondPageLoginCode',c);
localStorage.setItem('secondPageLoginPass',p);
localStorage.setItem('secondPageLoggedIn','true');
localStorage.setItem('loggedCollege',c);
auto();
alert('✅ লগইন সফল মামা! কোড: '+c+'\nএখন ৩য় পেজে যাচ্ছি - এই পাসওয়ার্ড ১ম পেজের সাথে মিলবে না, আলাদা!');
location.href='report.html';
}
function save(){auto();alert('✅ ব্যানার সেভ হয়েছে মামা!');}
document.getElementById('file').addEventListener('change',e=>{let r=new FileReader();r.onload=()=>{document.getElementById('logo').src=r.result;auto();};r.readAsDataURL(e.target.files[0]);});
load();
</script></body></html>
