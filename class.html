<div class="whiteCard" style="background:#fff;border-radius:20px;padding:16px;margin-top:10px">

<!-- ১। কলেজ কোড -->
<label class="label">কলেজ কোড</label>
<input id="code" class="inputBox" value="50017" readonly style="background:#f0f0f0;font-weight:700">

<!-- ২। পাসওয়ার্ড -->
<label class="label">পাসওয়ার্ড দিন</label>
<div style="position:relative">
<input id="pass" type="password" class="inputBox" placeholder="••••••••" style="padding-right:90px">
<span onclick="toggle()" style="position:absolute;right:70px;top:13px;cursor:pointer">👁️</span>
<span onclick="resetPass()" style="position:absolute;right:10px;top:11px;background:#e6f0ff;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;color:#0a2342">রিসেট</span>
</div>

<!-- ৩। শ্রেণী -->
<label class="label">শ্রেণী নির্বাচন করুন</label>
<select id="classSelect" class="inputBox">
<option value="">-- শ্রেণী বেছে নিন --</option>
<option>১ম শ্রেণী</option>
<option>২য় শ্রেণী</option>
<option>৩য় শ্রেণী</option>
<option>৪র্থ শ্রেণী</option>
<option>৫ম শ্রেণী</option>
<option>৬ষ্ঠ শ্রেণী</option>
<option>৭ম শ্রেণী</option>
<option>৮ম শ্রেণী</option>
<option>৯ম শ্রেণী</option>
<option>১০ম শ্রেণী</option>
<option>১১শ শ্রেণী</option>
<option>১২শ শ্রেণী</option>
</select>

<!-- ৪। লগইন -->
<button class="yellowBtn" onclick="login()" style="width:100%;padding:14px;background:#ffcc00;border:none;border-radius:14px;font-weight:700;font-size:18px;margin-top:16px;box-shadow:0 4px 0 #c9a000;cursor:pointer">🔐 লগইন</button>

<p style="text-align:center;font-size:11px;margin-top:8px;color:#666">পাসওয়ার্ড ভুলে গেলে রিসেট চাপুন</p>
</div>

<script>
function toggle(){ let p=document.getElementById('pass'); p.type=p.type=='password'?'text':'password'; }
function resetPass(){
 let c=document.getElementById('code').value;
 let old=prompt('পুরাতন পাসওয়ার্ড:'); 
 if(old!=localStorage.getItem('pass_'+c)){ alert('ভুল পাসওয়ার্ড'); return; }
 let np=prompt('নতুন পাসওয়ার্ড:'); 
 if(np){ localStorage.setItem('pass_'+c,np); alert('নতুন পাসওয়ার্ড: '+np); }
}
function login(){
 let c=document.getElementById('code').value;
 let p=document.getElementById('pass').value;
 let cls=document.getElementById('classSelect').value;
 if(!p || !cls){ alert('পাসওয়ার্ড আর শ্রেণী দিন'); return; }
 let saved=localStorage.getItem('pass_'+c);
 if(!saved){ localStorage.setItem('pass_'+c,p); } // প্রথমবার ফিক্সড
 else if(p!=saved){ alert('ভুল পাসওয়ার্ড!'); return; }
 localStorage.setItem('currentClass',cls);
 location.href='dashboard.html?code='+c+'&class='+cls;
}
</script>
