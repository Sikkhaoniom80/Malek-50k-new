<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a2a5e;display:flex;justify-content:center;padding:12px;font-family:sans-serif}
.phone{width:100%;max-width:400px}
.box{background:#fff;border:3px solid #ffcc00;border-radius:16px;padding:12px;margin-bottom:12px}
.box img{width:100%;max-height:170px;object-fit:contain;border-radius:8px;display:none;background:#f5f5f5}
.upBtns{display:flex;gap:8px;margin-top:8px}.upBtn{flex:1;padding:10px;background:#0a2a5e;color:#ffcc00;border-radius:10px;font-weight:800;border:none;cursor:pointer}
.title{font-weight:900;color:#0a2a5e;margin-bottom:6px}
.classMain{width:100%;padding:12px;background:#fff;border:2px solid #0a2a5e;border-radius:10px;font-weight:900;display:flex;justify-content:space-between;cursor:pointer}
.grid{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid.show{display:grid}
.cBtn{padding:12px;background:#ffcc00;border:2px solid #0a2a5e;border-radius:10px;font-weight:900;cursor:pointer}
.inputWrap{position:relative}input{width:100%;padding:12px 40px 12px 12px;border:2px solid #0a2a5e;border-radius:10px;font-size:15px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer}
.reset{font-size:12px;color:#0a2a5e;text-decoration:underline;cursor:pointer;text-align:right;display:block;margin-top:5px}
.login{width:100%;padding:14px;background:#0a2a5e;color:#ffcc00;border-radius:12px;font-weight:900;font-size:18px;border:none;cursor:pointer}
.login:active{transform:scale(0.96)}
</style></head><body>
<div class="phone">

<!-- ১। ক্যামেরা গ্যালারি -->
<div class="box">
<div class="title">১। 📷 ক্যামেরা / গ্যালারি (আপলোড করলে উপরে প্যাড হবে)</div>
<img id="padImg"><p id="noPad" style="text-align:center;padding:15px;color:#777;font-weight:700">প্যাড আপলোড করুন</p>
<div class="upBtns">
<button class="upBtn" onclick="document.getElementById('cam').click()">📷 ক্যামেরা</button>
<button class="upBtn" onclick="document.getElementById('file').click()">🖼️ গ্যালারি</button>
</div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
</div>

<!-- ২। শ্রেণী -->
<div class="box">
<div class="title">২। 📚 শ্রেণী নির্বাচন</div>
<button class="classMain" onclick="toggleClass()"><span id="classText">শ্রেণীতে ক্লিক করুন</span><span>▼</span></button>
<div class="grid" id="grid">
<button class="cBtn" onclick="setClass(1)">১ম</button><button class="cBtn" onclick="setClass(2)">২য়</button>
<button class="cBtn" onclick="setClass(3)">৩য়</button><button class="cBtn" onclick="setClass(4)">৪র্থ</button>
<button class="cBtn" onclick="setClass(5)">৫ম</button><button class="cBtn" onclick="setClass(6)">৬ষ্ঠ</button>
<button class="cBtn" onclick="setClass(7)">৭ম</button><button class="cBtn" onclick="setClass(8)">৮ম</button>
<button class="cBtn" onclick="setClass(9)">৯ম</button><button class="cBtn" onclick="setClass(10)">১০ম</button>
<button class="cBtn" onclick="setClass(11)">১১শ</button><button class="cBtn" onclick="setClass(12)">১২শ</button>
</div>
</div>

<!-- ৩। পাসওয়ার্ড -->
<div class="box">
<div class="title">৩। 🔐 পাসওয়ার্ড</div>
<div class="inputWrap"><input id="pass" type="password" placeholder="নতুন পাসওয়ার্ড দিন, যেমন: 123"><span class="eye" onclick="let p=document.getElementById('pass');p.type=p.type==='password'?'text':'password'">👁️</span></div>
<span class="reset" onclick="resetPass()">🔄 পাসওয়ার্ড রিসেট / চেঞ্জ</span>
</div>

<!-- ৪। লগইন -->
<button class="login" onclick="doLogin()">৪। ✅ লগইন করুন</button>

</div>
<script>
let selectedClass=null;
const file=document.getElementById('file'), cam=document.getElementById('cam'), img=document.getElementById('padImg'), noPad=document.getElementById('noPad');
function loadImg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const u=e.target.result;img.src=u;img.style.display='block';noPad.style.display='none';localStorage.setItem('padImage',u);};r.readAsDataURL(f);}
file.onchange=()=>loadImg(file);cam.onchange=()=>loadImg(cam);
const old=localStorage.getItem('padImage');if(old){img.src=old;img.style.display='block';noPad.style.display='none';}
const oldPass=localStorage.getItem('userPass');if(oldPass)document.getElementById('pass').value=oldPass;
const oldClass=localStorage.getItem('selectedClass');if(oldClass){selectedClass=oldClass;document.getElementById('classText').innerText=oldClass+' শ্রেণী সিলেক্ট';}

function toggleClass(){document.getElementById('grid').classList.toggle('show');}
function setClass(c){selectedClass=c;document.getElementById('classText').innerText=c+' শ্রেণী';document.getElementById('grid').classList.remove('show');localStorage.setItem('selectedClass',c);}
function resetPass(){const cur=localStorage.getItem('userPass');if(cur){const o=prompt('পুরাতন পাসওয়ার্ড দিন:');if(o!==cur){alert('ভুল');return;}}const n=prompt('নতুন পাসওয়ার্ড দিন:');if(!n)return;localStorage.setItem('userPass',n);document.getElementById('pass').value=n;alert('নতুন পাসওয়ার্ড: '+n);}
function doLogin(){const pad=localStorage.getItem('padImage');if(!pad){alert('১। প্যাড আপলোড করুন');return;}if(!selectedClass){alert('২। শ্রেণী সিলেক্ট করুন');return;}let p=document.getElementById('pass').value.trim();if(!p){alert('৩। পাসওয়ার্ড দিন');return;}localStorage.setItem('userPass',p);location.href='form.html';}
</script>
</body></html>
