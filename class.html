<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pad Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a2a5e;display:flex;justify-content:center;padding:15px;font-family:sans-serif}
.phone{width:100%;max-width:400px}
.topBox{display:none;background:#fff;border-radius:18px;padding:10px;text-align:center;border:3px solid #ffcc00;margin-bottom:15px}
.topBox img{width:100%;max-height:160px;object-fit:contain}
.upload{background:#d9e8ff;border:2.5px dashed #0a2a5e;border-radius:16px;padding:20px;text-align:center}
.camBtn{width:100%;padding:14px;background:#ffcc00;border:2px solid #0a2a5e;border-radius:12px;font-weight:900;font-size:18px;cursor:pointer;margin-top:10px}
.inputWrap{position:relative;margin-top:14px}input{width:100%;padding:14px 40px 14px 14px;border:2px solid #0a2a5e;border-radius:12px;font-size:15px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer}
.change{display:block;text-align:right;font-size:12px;color:#fff;text-decoration:underline;margin-top:6px;cursor:pointer}
.mainBtn{width:100%;padding:13px;background:#ffcc00;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:12px;cursor:pointer}
</style></head><body>
<div class="phone">
<div class="topBox" id="topBox"><img id="prev"><p id="cName" style="font-weight:900;color:#0a2a5e;margin-top:5px"></p><small style="color:green">✅ প্যাড পাওয়া গেছে</small></div>

<div class="upload">
<div id="upText"><div style="font-size:38px">📷</div><b>প্যাডের ছবি আপলোড করুন<br>(নাম+লোগো সহ)</b></div>
<button class="camBtn" onclick="document.getElementById('file').click()">📷 ক্যামেরা + 🖼️ গ্যালারি</button>
<input type="file" id="file" hidden accept="image/*">
</div>

<div class="inputWrap"><input id="pass" type="password" placeholder="নিজে পাসওয়ার্ড তৈরি করুন"><span class="eye" onclick="let p=document.getElementById('pass');p.type=p.type==='password'?'text':'password'">👁️</span></div>
<span class="change" onclick="resetPass()">পাসওয়ার্ড পরিবর্তন / রিসেট</span>
<button class="mainBtn" onclick="go('reg')">রেজিস্ট্রেশন করুন</button>
<button class="mainBtn" onclick="go('login')">লগইন করুন</button>
</div>

const file=document.getElementById('file');
file.onchange=e=>{
 const f=e.target.files[0]; if(!f) return;
 const u=URL.createObjectURL(f);
 document.getElementById('prev').src=u;
 document.getElementById('topBox').style.display='block';
 document.getElementById('cName').innerText=f.name.split('.')[0].toUpperCase();
 localStorage.setItem('padImage',u);
 document.getElementById('upText').innerHTML=`<img src="${u}" style="width:100%;max-height:130px;object-fit:contain"><br><b style="color:green">✅ ${f.name.split('.')[0]}</b>`;
};
